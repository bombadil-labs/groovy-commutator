[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groovy-commutator"
version = "0.1.0"
description = "An operator-commutator framework for cellular automata, generalized from single rules to rule pairs."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# SAT-backed research scripts (bounded source-recoder synthesis and its exact
# recovery, the phase-splice SAT recovery). These import `pysat` and need the
# cadical195 / glucose4 / maplechrono / minisat22 backends the frozen recovery
# protocol names as its solver portfolio. Declared here because the original
# 2026-09-10 work never declared it.
research-sat = [
    "python-sat",
]

[tool.setuptools.packages.find]
where = ["src"]
