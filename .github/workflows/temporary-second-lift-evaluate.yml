name: Temporary second-lift evaluation runner

on:
  push:
    branches:
      - codex/second-lift-evaluation
    paths:
      - '.github/workflows/temporary-second-lift-evaluate.yml'
      - 'scripts/verify_second_lift_completion.py'
      - 'docs/research/protocols/second-lift-completion-comparison-20260910.md'
      - 'results/second_lift_completion_20260911.json'
      - 'results/second_lift_completion_tables_20260911/**'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop after the canonical result has been committed
        id: state
        shell: bash
        run: |
          if [ -f results/second_lift_completion_20260911.json ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install package
        if: steps.state.outputs.needed == 'true'
        run: python -m pip install -e .
      - name: Replay frozen pre-evaluation controls
        if: steps.state.outputs.needed == 'true'
        run: python scripts/verify_second_lift_completion.py --controls-only
      - name: Run the pinned primary evaluation
        if: steps.state.outputs.needed == 'true'
        run: python scripts/verify_second_lift_completion.py
      - name: Commit canonical result artifacts back to the evaluation branch
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'Codex evaluation runner'
          git config user.email 'noreply@openai.com'
          git add results/second_lift_completion_20260911.json results/second_lift_completion_tables_20260911
          git commit -m 'Evaluate frozen second-lift comparison [second-lift-results]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
