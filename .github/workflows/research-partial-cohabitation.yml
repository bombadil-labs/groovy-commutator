name: Research partial cohabitation
on:
  pull_request:
    paths:
      - 'scripts/partial_cohabitation_20260915.py'
      - 'results/partial_cohabitation_20260915.json'
      - 'docs/research/protocols/partial-cohabitation-20260915.md'
      - 'experiments/on_beam_256_4d_20260914/labels.json'
      - '.github/workflows/research-partial-cohabitation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/partial_cohabitation_20260915.py'
      - 'results/partial_cohabitation_20260915.json'
      - 'docs/research/protocols/partial-cohabitation-20260915.md'
      - 'experiments/on_beam_256_4d_20260914/labels.json'
      - '.github/workflows/research-partial-cohabitation.yml'
permissions:
  contents: read
jobs:
  semantic-controls-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==2.3.5'
      - run: python scripts/partial_cohabitation_20260915.py --self-test
      - run: python scripts/check_result_integrity.py results/partial_cohabitation_20260915.json
