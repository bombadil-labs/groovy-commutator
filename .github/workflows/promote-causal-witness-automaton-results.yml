name: Promote Research032 exact result artifacts

on:
  push:
    branches: ['research/causal-witness-automaton-20260909']
    paths:
      - '.github/workflows/promote-causal-witness-automaton-results.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/causal-witness-automaton-20260909
      - name: Download frozen CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/h5 /tmp/h6 /tmp/recovery
          gh run download 34371277608 -n causal-witness-automaton-h5-summary -D /tmp/h5
          gh run download 34371971934 -n causal-witness-automaton-h6-summary -D /tmp/h6
          gh run download 34374551113 -n causal-witness-h6-recovery -D /tmp/recovery
      - name: Promote exact compact outputs
        run: |
          cp /tmp/h5/causal_witness_automaton_h5_summary.json results/causal_witness_automaton_h5_20260909.json
          cp /tmp/h6/causal_witness_automaton_h6_summary.json results/causal_witness_automaton_h6_20260909.json
          cp /tmp/recovery/causal_witness_congruence.json results/causal_witness_congruence_20260909.json
          cp /tmp/recovery/causal_witness_h6_z3.json results/causal_witness_h6_z3_20260909.json
          cp /tmp/recovery/causal_witness_h6_pysat.json results/causal_witness_h6_pysat_20260909.json
      - name: Commit immutable publication artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/causal_witness_automaton_h5_20260909.json \
                  results/causal_witness_automaton_h6_20260909.json \
                  results/causal_witness_congruence_20260909.json \
                  results/causal_witness_h6_z3_20260909.json \
                  results/causal_witness_h6_pysat_20260909.json
          git commit -m 'Research032: promote exact symbolic witness results'
          git push origin HEAD:research/causal-witness-automaton-20260909
