name: Reconcile dimensional history after beam orientation once
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/reconcile-dimensional-history-after-168-once.yml'
permissions:
  contents: write
jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/dimensional-history-scaling/reconcile-main-after-168' &&
      github.event.pull_request.base.ref == 'gather/dimensional-history-scaling'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge accepted main and resolve only the known docs overlap
        run: |
          set -euo pipefail
          git fetch origin main
          cp docs/research/2026-09-09-dimensional-closure-program.md /tmp/gather-program.md
          cp docs/research/checkpoints/dimensional-lift.md /tmp/gather-checkpoint.md
          git show origin/main:docs/research/2026-09-09-dimensional-closure-program.md > /tmp/main-program.md
          git show origin/main:docs/research/checkpoints/dimensional-lift.md > /tmp/main-checkpoint.md
          git merge --no-commit --no-ff origin/main || true
          python - <<'PY'
          from pathlib import Path

          gather_program = Path('/tmp/gather-program.md').read_text(encoding='utf-8')
          main_program = Path('/tmp/main-program.md').read_text(encoding='utf-8')
          gather_checkpoint = Path('/tmp/gather-checkpoint.md').read_text(encoding='utf-8')
          main_checkpoint = Path('/tmp/main-checkpoint.md').read_text(encoding='utf-8')

          # Carry the accepted #168 beam-orientation section verbatim into the
          # #171 Program, retaining the already integrated theorem-control section.
          p_start = '## Beam refinement: structural correspondence must become consequential\n'
          p_end = '## Shared representation contract\n'
          assert p_start in main_program and p_end in main_program
          beam_program = p_start + main_program.split(p_start, 1)[1].split(p_end, 1)[0]
          if p_start not in gather_program:
              assert gather_program.count(p_end) == 1
              gather_program = gather_program.replace(p_end, beam_program + p_end, 1)
          else:
              current = p_start + gather_program.split(p_start, 1)[1].split(p_end, 1)[0]
              assert current == beam_program
          Path('docs/research/2026-09-09-dimensional-closure-program.md').write_text(gather_program, encoding='utf-8')

          # Orientation is deliberately top-of-log.  Preserve #171's new checkpoint
          # immediately below it, followed by accepted cross-width history.
          c_start = '## Orientation 2026-09-12: resonance and resource accounting refine the existing beam\n'
          c_end = '## Checkpoint 2026-09-12: cross-width two-lag closure persists through width eight and fails at width nine; accepted\n'
          assert c_start in main_checkpoint and c_end in main_checkpoint
          orientation = c_start + main_checkpoint.split(c_start, 1)[1].split(c_end, 1)[0]
          history_marker = '## Checkpoint 2026-09-12: product-form Rule90 plus a coordinate slice is dimension-blind for the frozen history criterion; Gate 2 pending\n'
          assert gather_checkpoint.count(history_marker) == 1
          if c_start not in gather_checkpoint:
              gather_checkpoint = gather_checkpoint.replace(history_marker, orientation + history_marker, 1)
          else:
              existing = c_start + gather_checkpoint.split(c_start, 1)[1].split(history_marker, 1)[0]
              assert existing == orientation
          Path('docs/research/checkpoints/dimensional-lift.md').write_text(gather_checkpoint, encoding='utf-8')
          PY
          # These two #168 files do not overlap #171; take accepted main verbatim.
          git checkout origin/main -- docs/research/2026-09-12-dimensional-beam-resonance.md site/content/research/dimensional-beam-resonance.json
          git add docs/research/2026-09-09-dimensional-closure-program.md docs/research/checkpoints/dimensional-lift.md docs/research/2026-09-12-dimensional-beam-resonance.md site/content/research/dimensional-beam-resonance.json
          # Refuse to hide any unexpected conflict.
          test -z "$(git diff --name-only --diff-filter=U)"
          git rm .github/workflows/reconcile-dimensional-history-after-168-once.yml
          git diff --cached --check
          git config user.name 'OpenAI GPT-5.6 Sol - history reconciliation'
          git config user.email 'noreply@openai.com'
          git commit -m 'Merge current main into dimensional history scaling after #168'
          git push origin HEAD:work/dimensional-history-scaling/reconcile-main-after-168
      - name: Validate reconciled current account
        run: |
          npm ci --prefix site
          npm run test:research --prefix site
          npm run build --prefix site