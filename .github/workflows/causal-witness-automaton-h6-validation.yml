name: Research032 fresh horizon-6 symbolic witness census

on:
  push:
    branches: ['research/causal-witness-automaton-20260909']
    paths:
      - 'scripts/aggregate_causal_witness_automaton_h6.py'
      - '.github/workflows/causal-witness-automaton-h6-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pandas
      - name: Run exact symbolic shard through fresh horizon 6
        shell: bash
        run: |
          start=$(( ${{ matrix.shard }} * 32 ))
          end=$(( start + 32 ))
          python scripts/experiment_causal_witness_automaton.py \
            --rule-start "$start" --rule-end "$end" --hmax 6 \
            --node-budget 5000000 \
            --output "/tmp/causal-witness-mdd-h6-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-witness-mdd-h6-${{ matrix.shard }}
          path: /tmp/causal-witness-mdd-h6-${{ matrix.shard }}.json
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: causal-witness-mdd-h6-*
          path: /tmp/shards
      - name: Aggregate fresh horizon-6 pass
        run: |
          python scripts/aggregate_causal_witness_automaton_h6.py \
            --input-dir /tmp/shards \
            --output /tmp/causal_witness_automaton_h6_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: causal-witness-automaton-h6-summary
          path: /tmp/causal_witness_automaton_h6_summary.json
          retention-days: 30
      - name: Surface fresh result on PR 37
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          s=json.load(open('/tmp/causal_witness_automaton_h6_summary.json'))
          print('## Research032 phase 2 — fresh horizon-6 census')
          print()
          print(f"- h=3 regression events: **{s['h3_regression_count']}/4**")
          print(f"- h=4 births: **{s['h4_births']}**")
          print(f"- h=5 births: **{s['h5_births']}**")
          print(f"- **fresh h=6 births: {s['fresh_h6_births']}**")
          print(f"- rules censored by the frozen 5M-node ceiling: **{len(s['censored'])}**")
          print(f"- exact phase complete: **{s['complete']}**")
          print(f"- unresolved pair/target distinctions after the run: **{s['unresolved_after_run']}**")
          if s['fresh_h6_events']:
              print('\n### Fresh horizon-6 events')
              for e in s['fresh_h6_events'][:20]:
                  print(f"- Rule {e['rule']}, target `{e['target']}`, pair `{e['pair']}`")
          if s['censored']:
              print('\n### Censored rules')
              for e in s['censored']:
                  print(f"- Rule {e['rule']} at h={e['horizon']}: {e['reason']}")
          if s['h6_state_growth']:
              g=s['h6_state_growth']
              print('\n### h=6 symbolic state growth')
              print(f"- rules built: {g['rules_built']}")
              print(f"- median core nodes: {g['median_build_nodes']}")
              print(f"- max core nodes: {g['max_build_nodes']} (Rule {g['max_build_rule']})")
              print(f"- max query-expanded nodes: {g['max_query_nodes']}")
          PY
          gh pr comment 37 --body-file /tmp/comment.md
