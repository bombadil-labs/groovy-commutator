name: First interface-factor evaluation (one-shot)

# One-shot orchestration for the first frozen n=6,7 evaluation. The verifier
# was already pinned and integrated into the gathering branch before this file
# existed. This workflow commits only the canonical generated JSON; it is
# removed from the evaluation branch after that commit lands.

on:
  push:
    branches:
      - 'research/interface-factor-evaluation'
    paths:
      - '.github/workflows/interface-factor-first-evaluation.yml'

permissions:
  contents: write

jobs:
  first-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-factor-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Assert canonical result does not pre-exist
        run: test ! -e results/interface_factor_20260911.json
      - name: Execute the frozen primary and stress census exactly once
        run: python scripts/verify_interface_factor.py
      - name: Commit the canonical generated result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/interface_factor_20260911.json
          git commit -m 'Record first interface-factor canonical evaluation'
          git push origin HEAD:research/interface-factor-evaluation
