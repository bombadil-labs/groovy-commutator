name: Temporary relational-rank integrity registration

on:
  push:
    branches:
      - work/dimensional-relational-rank/evaluation-corrected
    paths:
      - '.github/workflows/_temporary-relational-rank-register.yml'

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-relational-rank/evaluation-corrected
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Register canonical result in the permanent integrity map
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_result_integrity.py')
          s = p.read_text()
          entry = """    'results/relational_rank_20260912.json': {\n        'script': 'scripts/verify_relational_rank.py',\n        'protocol': 'docs/research/protocols/relational-rank-20260912.md',\n        'guard_free_axial': 'results/guard_free_axial_lift_20260910.json',\n        'transverse_freedom': 'results/transverse_freedom_20260911.json',\n        'intervention_axis': 'results/intervention_axis_20260911.json'},\n"""
          if 'results/relational_rank_20260912.json' not in s:
              marker = '}\n\ndef sha('
              if marker not in s:
                  raise SystemExit('integrity registry insertion marker not found')
              s = s.replace(marker, entry + marker, 1)
              p.write_text(s)
          PY
          python scripts/check_result_integrity.py results/relational_rank_20260912.json
      - name: Commit registration and remove temporary runner
        run: |
          git config user.name 'Codex relational-rank integrity repair'
          git config user.email 'noreply@openai.com'
          git add scripts/check_result_integrity.py
          git rm .github/workflows/_temporary-relational-rank-register.yml
          git commit -m 'Register relational-rank canonical result integrity'
          git push origin HEAD:work/dimensional-relational-rank/evaluation-corrected