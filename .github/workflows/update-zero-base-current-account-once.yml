name: Update zero-base current account once

on:
  push:
    branches: [work/dimensional-zero-base/current-account-safe]
    paths:
      - '.github/workflows/update-zero-base-current-account-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Update only the zero-base current account from checked-out bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          import pathlib

          checkpoint_path = pathlib.Path('docs/research/checkpoints/dimensional-lift.md')
          checkpoint = checkpoint_path.read_text()
          checkpoint_heading = '## Checkpoint 2026-09-12: zero-dimensional base selector audit completed; gate-2 pending'
          if checkpoint_heading not in checkpoint:
              block = '''## Checkpoint 2026-09-12: zero-dimensional base selector audit completed; gate-2 pending

Read `docs/research/2026-09-12-zero-dimensional-base.md`. This unit audits the bottom two law/state cardinality matches after the first Gate-1 review exposed two important confounds: the accepted 1D→2D selector requires address/program role overlap, and compensated decoder reindexing is not geometric covariance.

- Gate 1: Claude/Fable first rejected exact head `ca5a34ad` for an impossible disjoint-role Z1 contract, a vacuous/impossible positive covariance bet, and unresolved repeated-execution architecture. Protocol-only correction #137 resolved those blockers; renewed Gate 1 approved exact head `c46a6f7d4c13a56512b20832be4f1b2489a50f78` before implementation/evaluation.
- Implementation-only PR #140 integrated with no canonical result. Evaluation PR #141 then ran the unchanged verifier, registered `results/zero_dimensional_base_20260912.json`, and obtained byte-for-byte permanent replay. All frozen P1–P8 verdicts pass.
- The complete binary 0D floor is `{0,204,51,255}` under the center-only ECA embedding; the accepted affine-commutator responses are the constant tuple `(0,0,1,1)`.
- Single-layer selector role accounting gives minimum overlap `max(0, k + 2^k - |P|)`: Z0 attains 0, while Z1 necessarily requires and attains 2 overlapping roles. In the accepted shell selector, `W` and `E` are simultaneously address and program state.
- All 16 frozen Gray-family Z1 layouts have all nine physical inputs essential, algebraic degree four, and exactly six quartic terms. Degree/full essentiality are generic multiplexer facts; the six quartics fingerprint the two-site role overlap and are layout-independent inside this family.
- The frozen Gray geometry gives a negative result: induced shell `D4` address actions intersect the ECA group generated by mirror and address complement only at the identity for every frozen layout, matching the pre-run cycle-type/antipode proof.
- For center-only laws the ordered-axis constructor gives `f^d`; Rule 51/NOT therefore alternates with dimension parity. Its failure of exact replication is separate: the appended-axis map `u_51=NOT` fixes no attainable bit.
- The accepted editable-routing family still uses `8d` native routing bits, hence 16 at `d=2`; this is not compression of an arbitrary 512-bit 2D rule table or a demonstrated 3D shell interpreter. Repeated stateful execution was deliberately deferred to a separate future protocol.
- Do not infer intrinsic dimension, a natural/unique geometry, self-assembly, endogenous program selection, spacetime emergence, physics, metaphysics, arbitrary 2D→3D shell encoding, or any connection to `8n+1`/primes.
- **Review state:** result reporting and current-account integration are complete on gathering PR #136; exact-head independent Gate 2 and reviewer merge remain required before acceptance on `main`.

'''
              marker = '\n## Checkpoint '
              idx = checkpoint.find(marker)
              if idx < 0:
                  raise SystemExit('checkpoint insertion marker not found')
              checkpoint = checkpoint[:idx+1] + block + checkpoint[idx+1:]
              checkpoint_path.write_text(checkpoint)

          program_path = pathlib.Path('docs/research/2026-09-09-dimensional-closure-program.md')
          program = program_path.read_text()
          program_heading = '## Zero-dimensional base-case audit (2026-09-12)'
          if program_heading not in program:
              section = '''\n\n## Zero-dimensional base-case audit (2026-09-12)\n\nThe [zero-dimensional base-case audit](2026-09-12-zero-dimensional-base.md) now supplies an exact local control at the bottom of the dimensional ladder. The complete binary 0D floor and the accepted ECA shared-shell construction instantiate the same overlap-permitted selector semantics, but their physical role accounting differs: the 0D→1D selector needs no address/program overlap, while any single-layer 1D→2D realization in the nine-cell Moore patch needs at least two dual-role cells, attained by `W` and `E`.\n\nThe frozen Gray-family layouts do not turn familiar ECA mirror/address-complement symmetries into nontrivial literal square symmetries: the induced shell `D4` actions intersect the ECA group generated by those transformations only at the identity. All 16 layouts nevertheless have the generic local multiplexer structure already proved for the shared-state selector: all nine inputs are essential, algebraic degree four, and six quartic terms fingerprint the two overlapping roles.\n\nThis result is intentionally local. It establishes neither repeated stateful dimensional lifting nor a natural geometry, intrinsic dimension, self-assembly, endogenous control, arbitrary 2D→3D shell encoding, spacetime emergence, physics, metaphysics, or a connection to primes. The separately frozen relational-rank unit may use this accepted base case as a control only after the present gathering PR reaches `main`.\n'''
              program_path.write_text(program.rstrip() + section + '\n')

          registry_path = pathlib.Path('site/content/research-program.json')
          programs = json.loads(registry_path.read_text())
          if not isinstance(programs, list):
              raise SystemExit('research-program registry is not the expected list')
          found = False
          for p in programs:
              if p.get('slug') == 'dimensional-lift':
                  found = True
                  supports = p.setdefault('supports', [])
                  if 'zero-dimensional-base' not in supports:
                      supports.append('zero-dimensional-base')
                  p['updated'] = '2026-09-12'
          if not found:
              raise SystemExit('dimensional-lift program metadata not found')
          registry_path.write_text(json.dumps(programs, indent=2, ensure_ascii=False) + '\n')

          knowledge_path = pathlib.Path('site/content/knowledge.json')
          raw = knowledge_path.read_text()
          graph = json.loads(raw)
          node_id = 'zero-dimensional-selector-overlap'
          if not any(n.get('id') == node_id for n in graph.get('nodes', [])):
              graph.setdefault('nodes', []).append({
                  'id': node_id,
                  'title': 'The same local selector semantics crosses the first two law/state cardinality matches, but Z1 requires role overlap',
                  'kind': 'finding',
                  'status': 'exact',
                  'summary': 'The first two law/state cardinality matches share one overlap-permitted local selector semantics, but the 1D→2D shell necessarily uses two dual-role address/program cells; its frozen Gray geometry realizes no nontrivial familiar ECA mirror/complement symmetry.',
                  'updated': '2026-09-12',
                  'source': 'docs/knowledge/zero-dimensional-selector-overlap.md',
                  'research': ['zero-dimensional-base'],
              })
          compact = raw.count('\n') < 10
          if compact:
              knowledge_path.write_text(json.dumps(graph, separators=(',', ':'), ensure_ascii=False) + '\n')
          else:
              knowledge_path.write_text(json.dumps(graph, indent=2, ensure_ascii=False) + '\n')
          PY
          npm ci --prefix site
          npm run test:research --prefix site
          npm run build --prefix site
          git rm .github/workflows/update-zero-base-current-account-once.yml
          git add docs/research/checkpoints/dimensional-lift.md \
                  docs/research/2026-09-09-dimensional-closure-program.md \
                  site/content/research-program.json \
                  site/content/knowledge.json
          git commit -m "report: integrate zero-dimensional base current account"
          git push origin HEAD:work/dimensional-zero-base/current-account-safe