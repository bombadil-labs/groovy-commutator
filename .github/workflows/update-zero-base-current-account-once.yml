name: Update zero-base checkpoint once

on:
  push:
    branches: [work/dimensional-zero-base/current-account-safe]
    paths:
      - '.github/workflows/update-zero-base-current-account-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert the zero-base checkpoint without rewriting unrelated history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import pathlib
          path = pathlib.Path('docs/research/checkpoints/dimensional-lift.md')
          text = path.read_text()
          heading = '## Checkpoint 2026-09-12: zero-dimensional base selector audit completed; gate-2 pending'
          if heading not in text:
              block = '''## Checkpoint 2026-09-12: zero-dimensional base selector audit completed; gate-2 pending

Read `docs/research/2026-09-12-zero-dimensional-base.md`. This unit audits the bottom two law/state cardinality matches after the first Gate-1 review exposed two important confounds: the accepted 1D→2D selector requires address/program role overlap, and compensated decoder reindexing is not geometric covariance.

- Gate 1: Claude/Fable first rejected exact head `ca5a34ad` for an impossible disjoint-role Z1 contract, a vacuous/impossible positive covariance bet, and unresolved repeated-execution architecture. Protocol-only correction #137 resolved those blockers; renewed Gate 1 approved exact head `c46a6f7d4c13a56512b20832be4f1b2489a50f78` before implementation/evaluation.
- Implementation-only PR #140 integrated with no canonical result. Evaluation PR #141 then ran the unchanged verifier, registered `results/zero_dimensional_base_20260912.json`, and obtained byte-for-byte permanent replay. All frozen P1–P8 verdicts pass.
- The complete binary 0D floor is `{0,204,51,255}` under the center-only ECA embedding; the accepted affine-commutator responses are the constant tuple `(0,0,1,1)`.
- Single-layer selector role accounting gives minimum overlap `max(0, k + 2^k - |P|)`: Z0 attains 0, while Z1 necessarily requires and attains 2 overlapping roles. In the accepted shell selector, `W` and `E` are simultaneously address and program state.
- All 16 frozen Gray-family Z1 layouts have all nine physical inputs essential, algebraic degree four, and exactly six quartic terms. Degree/full essentiality are generic multiplexer facts; the six quartics fingerprint the two-site role overlap and are layout-independent inside this family.
- The frozen Gray geometry gives a negative result: induced shell `D4` address actions intersect the ECA group generated by mirror and address complement only at the identity for every frozen layout, matching the pre-run cycle-type/antipode proof.
- For center-only laws the ordered-axis constructor gives `f^d`; Rule 51/NOT therefore alternates with dimension parity. Its failure of exact replication is separate: the appended-axis map `u_51=NOT` fixes no attainable bit.
- The accepted editable-routing family still uses `8d` native routing bits, hence 16 at `d=2`; this is not compression of an arbitrary 512-bit 2D rule table or a demonstrated 3D shell interpreter. Repeated stateful execution was deliberately deferred to a separate future protocol.
- Do not infer intrinsic dimension, a natural/unique geometry, self-assembly, endogenous program selection, spacetime emergence, physics, metaphysics, arbitrary 2D→3D shell encoding, or any connection to `8n+1`/primes.
- **Review state:** result reporting and checkpoint integration are complete on gathering PR #136; living Program/registry integration, exact-head independent Gate 2, and reviewer merge remain required before acceptance on `main`.

'''
              marker = '\n## Checkpoint '
              idx = text.find(marker)
              if idx < 0:
                  raise SystemExit('checkpoint insertion marker not found')
              text = text[:idx+1] + block + text[idx+1:]
              path.write_text(text)
          PY
          git rm .github/workflows/update-zero-base-current-account-once.yml
          git add docs/research/checkpoints/dimensional-lift.md
          git commit -m "report: add zero-dimensional base checkpoint safely"
          git push origin HEAD:work/dimensional-zero-base/current-account-safe