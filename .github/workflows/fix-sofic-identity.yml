name: One-shot sofic identity normalization

on:
  push:
    branches:
      - fix/sofic-note-036-identity
    paths:
      - .github/workflows/fix-sofic-identity.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Normalize Note 036 identity and add provenance guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          p = root / 'docs/research/2026-09-09-sofic-defect-orbit.md'
          s = p.read_text()
          old = '> **Public numbering note.** This work was preregistered internally as Research035 before a parallel branch merged the ternary commutator lift as public Note 035. To preserve both histories without renumbering frozen protocols, this checkpoint is published as **Note 036** while its protocol and script filenames retain the internal Research035 label.'
          new = '> **Publication identity.** This checkpoint is **Note 036**, with canonical slug `sofic-defect-orbit`. A temporary prepublication number collided with a parallel research note and was normalized before publication. Immutable Git history and the recorded frozen source hashes preserve the preregistration; there is no alternate internal note number.'
          assert old in s
          p.write_text(s.replace(old, new))

          p = root / 'docs/research/protocols/sofic-defect-orbit-resource-addendum-20260909.md'
          s = p.read_text()
          old = '# Resource addendum: Research035 exact sofic orbit — 2026-09-09'
          assert old in s
          p.write_text(s.replace(old, '# Resource addendum: exact sofic defect orbit — 2026-09-09'))

          p = root / 'docs/research/protocols/sofic-defect-orbit-lazy-union-recovery-20260909.md'
          s = p.read_text()
          replacements = {
              'complete primary Research035 run': 'complete primary `sofic-defect-orbit` run',
              'frozen Research035 exact sofic protocol': 'frozen `sofic-defect-orbit` exact sofic protocol',
              'recovery of the already-frozen Research035 hypotheses': 'recovery of the already-frozen Note 036 / `sofic-defect-orbit` hypotheses',
              'publish Research035 as a proof-complexity boundary': 'publish Note 036 / `sofic-defect-orbit` as a proof-complexity boundary',
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s)

          p = root / 'docs/research/protocols/sofic-defect-orbit-raw-slice-recovery-20260909.md'
          s = p.read_text()
          old = '**Public numbering note:** the protocol retains the internal Research035 lineage frozen before the parallel dimensional program claimed public Note 035. Any public note from this line will be numbered 036.'
          new = '**Publication identity:** this protocol belongs to public **Note 036** with canonical slug `sofic-defect-orbit`. A temporary prepublication number collided with a parallel note and was normalized; no alternate note number is canonical.'
          assert old in s
          s = s.replace(old, new)
          assert 'The primary Research035 method' in s
          s = s.replace('The primary Research035 method', 'The primary `sofic-defect-orbit` method')
          p.write_text(s)

          p = root / 'docs/research/protocols/sofic-defect-orbit-public-numbering-20260909.md'
          p.write_text('''# Publication identity — sofic defect-orbit line

          The canonical public identity for this work is **Note 036**, with slug `sofic-defect-orbit`.

          A temporary prepublication number collided with a parallel research note. It was normalized before publication and is not an alternate identifier for this line.

          Preregistration provenance remains auditable through three independent records:

          - the dated frozen protocol files and their Git history;
          - the `source_hashes` stored in the committed result JSON, which identify the exact source bytes used by the frozen runs;
          - the immutable commit and pull-request history that records when protocols, resource ceilings, recoveries, and results were committed.

          Publication-identity cleanup changes some live source bytes without changing experiment semantics. Historical `source_hashes` therefore identify the frozen run snapshot and are not expected to equal the hashes of the current identity-normalized files. No hypothesis, domain, threshold, result, or program evidence assignment changes under this normalization.

          There is no alternate internal note number. `sofic-defect-orbit` is evidence only for the `erased-distinctions` living program; the parallel `dimensional-lift` program remains separate.
          '''.replace('\n          ', '\n'))

          text_replacements = {
              'scripts/experiment_sofic_defect_orbit.py': {
                  '"""Research035: exact sofic orbit closure for one-defect paired block-3 ECA dynamics."""': '"""Note 036 / sofic-defect-orbit: exact sofic orbit closure for one-defect paired block-3 ECA dynamics."""',
              },
              'scripts/experiment_sofic_defect_orbit_lazy.py': {
                  '"""Research035 recovery: exact sofic slices with lazy nondeterministic accumulated union."""': '"""Note 036 / sofic-defect-orbit recovery: exact sofic slices with lazy nondeterministic accumulated union."""',
              },
              'scripts/experiment_sofic_defect_orbit_raw.py': {
                  '"""Research035 recovery: exact raw-NFA sofic slices with lazy accumulated union."""': '"""Note 036 / sofic-defect-orbit recovery: exact raw-NFA sofic slices with lazy accumulated union."""',
              },
              'scripts/aggregate_sofic_defect_orbit.py': {
                  '"""Aggregate sharded Research035 exact sofic defect-orbit results."""': '"""Aggregate sharded Note 036 / sofic-defect-orbit results."""',
                  'raise SystemExit("no Research035 shards")': 'raise SystemExit("no sofic-defect-orbit shards")',
              },
              'scripts/aggregate_sofic_defect_orbit_lazy.py': {
                  '"""Aggregate the frozen Research035 lazy-union recovery."""': '"""Aggregate the frozen Note 036 / sofic-defect-orbit lazy-union recovery."""',
              },
              'scripts/aggregate_sofic_defect_orbit_raw.py': {
                  '"""Aggregate frozen Research035 raw-NFA slice recovery."""': '"""Aggregate frozen Note 036 / sofic-defect-orbit raw-NFA slice recovery."""',
                  '        "public_note_number": "036",\n        "internal_research_line": "Research035",': '        "publication_identity": {"canonical_slug": "sofic-defect-orbit", "note_number": "036"},',
              },
          }
          for relative, replacements in text_replacements.items():
              p = root / relative
              s = p.read_text()
              for old, new in replacements.items():
                  assert old in s, (relative, old)
                  s = s.replace(old, new)
              p.write_text(s)

          for relative in ['scripts/aggregate_sofic_defect_orbit.py', 'scripts/aggregate_sofic_defect_orbit_lazy.py']:
              p = root / relative
              s = p.read_text()
              start = s.index('out = {')
              marker = '        "experiment": '
              idx = s.index(marker, start)
              line_end = s.index('\n', idx) + 1
              if '"publication_identity"' not in s[start:]:
                  s = s[:line_end] + '        "publication_identity": {"canonical_slug": "sofic-defect-orbit", "note_number": "036"},\n' + s[line_end:]
              target = '        "source_hashes": shards[0]["source_hashes"],'
              assert target in s
              s = s.replace(target, '        "source_hashes_scope": "Frozen prepublication source bytes used for this result; live files may differ by publication-identity-only normalization.",\n' + target, 1)
              p.write_text(s)

          p = root / 'scripts/aggregate_sofic_defect_orbit_raw.py'
          s = p.read_text()
          target = '        "source_hashes": shards[0]["source_hashes"],'
          assert target in s
          s = s.replace(target, '        "source_hashes_scope": "Frozen prepublication source bytes used for this result; live files may differ by publication-identity-only normalization.",\n' + target, 1)
          p.write_text(s)

          provenance = {
              'schema_version': 1,
              'canonical_slug': 'sofic-defect-orbit',
              'note_number': '036',
              'alternate_internal_note_number': None,
              'historical_results': [
                  'results/sofic_defect_orbit_20260909.json',
                  'results/sofic_defect_orbit_lazy_20260909.json',
                  'results/sofic_defect_orbit_raw_control_20260909.json',
              ],
              'source_hashes_semantics': 'The source_hashes embedded in historical result files identify the exact frozen prepublication source bytes used for those runs. Publication-identity-only edits to live source are expected to change current file hashes.',
              'publication_identity_note': 'docs/research/protocols/sofic-defect-orbit-public-numbering-20260909.md',
              'publication_record': 'site/content/research/sofic-reachability.json',
              'scientific_semantics_changed': False,
          }
          (root / 'results/sofic_defect_orbit_provenance_20260909.json').write_text(json.dumps(provenance, indent=2) + '\n')

          p = root / 'site/scripts/research-program.test.mjs'
          s = p.read_text()
          anchor = "test('same-day numbered notes render newest number first', () => {"
          assert anchor in s
          test_block = r'''test('sofic defect-orbit has one canonical publication identity', () => {
            const note = records().find((entry) => entry.slug === 'sofic-defect-orbit');
            assert.ok(note);
            assert.equal(note.number, '036');

            const banned = [
              ['Research', '035'].join(''),
              ['Note', '035'].join(''),
              ['Note ', '035'].join(''),
              'internal_research_line',
            ];
            const lineage = [
              note.source,
              'docs/research/protocols/sofic-defect-orbit-20260909.md',
              'docs/research/protocols/sofic-defect-orbit-resource-addendum-20260909.md',
              'docs/research/protocols/sofic-defect-orbit-lazy-union-recovery-20260909.md',
              'docs/research/protocols/sofic-defect-orbit-raw-slice-recovery-20260909.md',
              'docs/research/protocols/sofic-defect-orbit-public-numbering-20260909.md',
              'scripts/experiment_sofic_defect_orbit.py',
              'scripts/experiment_sofic_defect_orbit_lazy.py',
              'scripts/experiment_sofic_defect_orbit_raw.py',
              'scripts/aggregate_sofic_defect_orbit.py',
              'scripts/aggregate_sofic_defect_orbit_lazy.py',
              'scripts/aggregate_sofic_defect_orbit_raw.py',
              'results/sofic_defect_orbit_20260909.json',
              'results/sofic_defect_orbit_lazy_20260909.json',
              'results/sofic_defect_orbit_raw_control_20260909.json',
              'results/sofic_defect_orbit_provenance_20260909.json',
            ];
            for (const relative of lineage) {
              const text = fs.readFileSync(path.join(ROOT, relative), 'utf8');
              for (const token of banned) assert.equal(text.includes(token), false, `${relative} contains stale alias ${token}`);
            }

            const provenance = JSON.parse(fs.readFileSync(path.join(ROOT, 'results/sofic_defect_orbit_provenance_20260909.json'), 'utf8'));
            assert.equal(provenance.canonical_slug, 'sofic-defect-orbit');
            assert.equal(provenance.note_number, '036');
            assert.equal(provenance.alternate_internal_note_number, null);
            assert.equal(provenance.scientific_semantics_changed, false);
            assert.match(provenance.source_hashes_semantics, /frozen prepublication source bytes/);
            for (const relative of provenance.historical_results.slice(0, 2)) {
              const result = JSON.parse(fs.readFileSync(path.join(ROOT, relative), 'utf8'));
              assert.ok(result.source_hashes && Object.keys(result.source_hashes).length > 0);
            }
          });

          '''
          s = s.replace(anchor, test_block + anchor)
          p.write_text(s)
          PY
      - name: Verify identity normalization
        run: |
          set -euo pipefail
          if grep -RInE 'Research035|Note ?035|internal_research_line' \
            docs/research/2026-09-09-sofic-defect-orbit.md \
            docs/research/protocols/sofic-defect-orbit-*.md \
            scripts/experiment_sofic_defect_orbit*.py \
            scripts/aggregate_sofic_defect_orbit*.py \
            results/sofic_defect_orbit_20260909.json \
            results/sofic_defect_orbit_lazy_20260909.json \
            results/sofic_defect_orbit_raw_control_20260909.json \
            results/sofic_defect_orbit_provenance_20260909.json; then
            echo 'stale sofic publication alias remains' >&2
            exit 1
          fi
          python -m py_compile \
            scripts/experiment_sofic_defect_orbit.py \
            scripts/experiment_sofic_defect_orbit_lazy.py \
            scripts/experiment_sofic_defect_orbit_raw.py \
            scripts/aggregate_sofic_defect_orbit.py \
            scripts/aggregate_sofic_defect_orbit_lazy.py \
            scripts/aggregate_sofic_defect_orbit_raw.py
      - name: Install site dependencies
        run: npm ci --prefix site
      - name: Run research tests
        run: npm run test:research --prefix site
      - name: Build site
        run: npm run build --prefix site
      - name: Commit normalized identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-sofic-identity.yml
          git add \
            docs/research/2026-09-09-sofic-defect-orbit.md \
            docs/research/protocols/sofic-defect-orbit-resource-addendum-20260909.md \
            docs/research/protocols/sofic-defect-orbit-lazy-union-recovery-20260909.md \
            docs/research/protocols/sofic-defect-orbit-raw-slice-recovery-20260909.md \
            docs/research/protocols/sofic-defect-orbit-public-numbering-20260909.md \
            scripts/experiment_sofic_defect_orbit.py \
            scripts/experiment_sofic_defect_orbit_lazy.py \
            scripts/experiment_sofic_defect_orbit_raw.py \
            scripts/aggregate_sofic_defect_orbit.py \
            scripts/aggregate_sofic_defect_orbit_lazy.py \
            scripts/aggregate_sofic_defect_orbit_raw.py \
            site/scripts/research-program.test.mjs \
            results/sofic_defect_orbit_provenance_20260909.json
          git commit -m 'Fix sofic Note 036 publication identity'
          git push origin HEAD:${GITHUB_REF_NAME}
