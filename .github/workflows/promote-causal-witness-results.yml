name: Promote Research031 result artifacts

on:
  push:
    branches: [research/causal-witness-horizon-20260909]
    paths:
      - '.github/workflows/promote-causal-witness-results.yml'

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pandas
      - name: Download frozen primary aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifact results
          gh run download 34330667980 \
            --repo bombadil-labs/groovy-commutator \
            --name causal-witness-publication \
            --dir artifact
          cp artifact/causal-witness-summary.json results/causal_witness_horizon_20260909_summary.json
      - name: Reproduce independent audit and size controls
        run: |
          python scripts/audit_causal_witness_horizon.py \
            --output results/causal_witness_horizon_20260909_audit.json
          python scripts/check_causal_witness_ring_sizes.py \
            --output results/causal_witness_horizon_sizes_20260909.json
      - name: Commit exact compact results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/causal_witness_horizon_20260909_summary.json \
                  results/causal_witness_horizon_20260909_audit.json \
                  results/causal_witness_horizon_sizes_20260909.json
          git diff --cached --quiet && exit 0
          git commit -m 'Research031: promote exact light-cone result artifacts'
          git push
