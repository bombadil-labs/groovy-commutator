name: Reconcile dimensional resonance gathering with main once

on:
  push:
    branches:
      - work/dimensional-resonance-response/reconcile-main-v2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-resonance-response/reconcile-main-v2
          fetch-depth: 0
      - name: Merge main and union the one known registry conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex resonance reconciliation"
          git config user.email "noreply@openai.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "scripts/check_result_integrity.py" ]; then
            printf 'unexpected conflicts: %s\n' "${conflicts[*]}"
            exit 1
          fi
          git checkout --theirs scripts/check_result_integrity.py
          python .reconcile_resonance_integrity.py
          git add scripts/check_result_integrity.py
          rm .reconcile_resonance_integrity.py .github/workflows/reconcile-dimensional-resonance-main-v2-once.yml
          git add -A
          git commit -m "chore: reconcile resonance gathering with accepted main"
          git push origin HEAD:work/dimensional-resonance-response/reconcile-main-v2
