name: Temporary transverse-freedom evaluation runner

on:
  push:
    branches:
      - work/dimensional-spatial-axis/evaluation
    paths:
      - '.github/workflows/temporary-transverse-freedom-evaluate.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stop after the canonical result has been committed
        id: state
        shell: bash
        run: |
          if [ -f results/transverse_freedom_20260911.json ]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install package
        if: steps.state.outputs.needed == 'true'
        run: python -m pip install -e .
      - name: Replay frozen theorem and indexing controls
        if: steps.state.outputs.needed == 'true'
        run: python scripts/verify_transverse_freedom.py --controls-only
      - name: Run the pinned primary diagnostic
        if: steps.state.outputs.needed == 'true'
        run: python scripts/verify_transverse_freedom.py
      - name: Commit canonical result back to the evaluation branch
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'Codex evaluation runner'
          git config user.email 'noreply@openai.com'
          git add results/transverse_freedom_20260911.json
          git commit -m 'Evaluate frozen transverse-freedom diagnostic [transverse-freedom-results]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
