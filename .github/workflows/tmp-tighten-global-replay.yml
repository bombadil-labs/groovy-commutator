name: Tighten global conflict physical replay witness

on:
  push:
    branches: [research/interface-history-global-implementation]
    paths:
      - '.github/workflows/tmp-tighten-global-replay.yml'

permissions:
  contents: write

jobs:
  patch-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an actual shared-coordinate physical difference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify_interface_history_global.py')
          text = p.read_text()
          old = '''        # Equal complete retained current symbols account for every retained\n        # coordinate. A different row domain or a common-coordinate raw-cell\n        # difference is therefore information outside that retained field.\n        "unretained_current_difference_exists": bool(domain_difference or common_difference),\n'''
          new = '''        # Equal complete retained current symbols account for every retained\n        # coordinate. Only an actual differing raw cell on the shared physical\n        # coordinate domain counts as the required hidden-current witness; a\n        # different finite replay-window shape is never accepted as evidence.\n        "unretained_current_difference_exists": common_difference,\n'''
          if old not in text:
              raise SystemExit('expected current-physical-difference block not found')
          text = text.replace(old, new, 1)
          old2 = '''    if diff["current_complete_physical_fields_identical"] or not diff["unretained_current_difference_exists"]:\n        raise AssertionError("G7 conflict lacks an unretained current physical distinction")\n'''
          new2 = '''    if (\n        diff["current_complete_physical_fields_identical"]\n        or not diff["common_coordinate_physical_difference_exists"]\n        or not diff["unretained_current_difference_exists"]\n    ):\n        raise AssertionError("G7 conflict lacks an unretained shared-coordinate physical distinction")\n'''
          if old2 not in text:
              raise SystemExit('expected G7 witness assertion not found')
          p.write_text(text.replace(old2, new2, 1))
          PY
      - name: Remove one-shot patch workflow
        run: rm .github/workflows/tmp-tighten-global-replay.yml
      - name: Commit correction
        run: |
          git config user.name 'Codex interface-history-global implementation'
          git config user.email 'noreply@openai.com'
          git add scripts/verify_interface_history_global.py .github/workflows/tmp-tighten-global-replay.yml
          git commit -m 'fix: require shared-coordinate hidden physical witness'
          git push origin HEAD:research/interface-history-global-implementation
