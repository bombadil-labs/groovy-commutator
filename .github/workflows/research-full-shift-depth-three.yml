name: Full-shift depth three

# The accepted depth-three replay takes roughly 80–120 minutes and is therefore
# not automatic CI. Pull requests and pushes use the common seconds-scale
# scripts/check_result_integrity.py tier instead. This workflow is an exceptional
# manual escape hatch only; repository policy requires Myk's explicit authorization
# before spending Actions time on it.

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Myk authorization reference for this expensive replay'
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-shift-depth-three:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recorded source hashes match the tree
        run: python scripts/check_result_integrity.py results/full_shift_depth_three_20260912.json
      - name: Install research package
        run: python -m pip install -e .
      - name: Rerun the frozen audit and compare the canonical JSON byte for byte
        run: |
          echo "Authorized expensive replay: ${{ inputs.authorization }}"
          cp results/full_shift_depth_three_20260912.json /tmp/expected.json
          python scripts/verify_full_shift_depth_three.py > /dev/null
          cmp /tmp/expected.json results/full_shift_depth_three_20260912.json
