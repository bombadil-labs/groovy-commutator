name: Reaggregate and promote Research035 censored result

on:
  push:
    branches: ['research/sofic-defect-orbit-20260909']
    paths:
      - '.github/workflows/promote-sofic-censoring-summary.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  reaggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sofic-defect-orbit-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen primary artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/shards artifacts/controls
          for i in $(seq 0 31); do
            gh run download 34388121180 \
              --repo bombadil-labs/groovy-commutator \
              --name "sofic-defect-orbit-shard-$i" \
              --dir artifacts/shards
          done
          gh run download 34388121180 \
            --repo bombadil-labs/groovy-commutator \
            --name sofic-defect-orbit-controls \
            --dir artifacts/controls
      - name: Reaggregate with censor-aware hypothesis semantics
        run: |
          python scripts/aggregate_sofic_defect_orbit.py \
            --input-dir artifacts/shards \
            --controls artifacts/controls/sofic-controls.json \
            --output results/sofic_defect_orbit_20260909.json
      - name: Commit exact reaggregation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/sofic_defect_orbit_20260909.json
          git commit -m 'Research035: promote censor-aware exact sofic summary'
          git push origin HEAD:research/sofic-defect-orbit-20260909
      - name: Surface censoring breakdown on PR 41
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          x=json.load(open('results/sofic_defect_orbit_20260909.json'))
          print('## Research035 corrected aggregate — primary run was fully censored')
          print()
          print(f"- primary questions: **{x['research034_survivors']}**")
          print(f"- finite witnesses established: **{x['finite_witness_resolutions']}**")
          print(f"- finite sofic closures established: **{x['finite_sofic_closure_resolutions']}**")
          print(f"- censored before resolution: **{x['censored']}**")
          print(f"- censoring by reason: **{x['censoring_by_reason']}**")
          print(f"- censoring by horizon: **{x['censoring_by_horizon']}**")
          print()
          print('Frozen hypotheses are **inconclusive due to censoring**, not false.')
          PY
          gh pr comment 41 --repo bombadil-labs/groovy-commutator --body-file /tmp/comment.md
