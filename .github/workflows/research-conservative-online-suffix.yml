name: Conservative online suffix instrument checks

on:
  pull_request:
    paths:
      - 'src/groovy/online_suffix.py'
      - 'scripts/check_conservative_online_suffix.py'
      - 'docs/research/protocols/conservative-online-suffix-learner-20260910.md'
      - 'docs/research/2026-09-10-conservative-online-suffix-learner.md'
      - 'docs/knowledge/conservative-online-suffix-learner.md'
      - '.github/workflows/research-conservative-online-suffix.yml'
  push:
    branches: [main]
    paths:
      - 'src/groovy/online_suffix.py'
      - 'scripts/check_conservative_online_suffix.py'
      - '.github/workflows/research-conservative-online-suffix.yml'

permissions:
  contents: read

jobs:
  explicit-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Compile instrument and checks
        run: python -m py_compile src/groovy/online_suffix.py scripts/check_conservative_online_suffix.py
      - name: Run hand-checkable traces
        run: python scripts/check_conservative_online_suffix.py
