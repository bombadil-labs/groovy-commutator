name: One-shot interface-history global evaluation

on:
  push:
    branches: [research/interface-history-global-evaluation]
    paths:
      - '.github/workflows/run-interface-history-global-evaluation.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-history-global-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run frozen n=6,7 census from pinned green implementation
        run: python scripts/verify_interface_history_global.py
      - name: Commit canonical result to evaluation branch
        run: |
          test -f results/interface_history_global_20260912.json
          git config user.name 'Codex interface-history-global evaluation'
          git config user.email 'noreply@openai.com'
          git add results/interface_history_global_20260912.json
          git commit -m 'research: evaluate global interface-history determinism'
          git push origin HEAD:research/interface-history-global-evaluation
