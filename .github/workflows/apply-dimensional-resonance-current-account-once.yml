name: Apply dimensional resonance current account once

on:
  push:
    branches:
      - work/dimensional-resonance-response/current-account

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-resonance-response/current-account
          fetch-depth: 0
      - name: Apply preservation-safe current-account edits
        run: python .apply_resonance_current_account.py
      - name: Remove temporary editor and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .apply_resonance_current_account.py .github/workflows/apply-dimensional-resonance-current-account-once.yml
          git config user.name "Codex resonance current account"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "docs: integrate dimensional resonance response into current account"
          git push origin HEAD:work/dimensional-resonance-response/current-account
