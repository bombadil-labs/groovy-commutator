name: Rule-54 golden fiber and all-256 GQR replay

on:
  pull_request:
    paths:
      - 'experiments/jet_gqr_256/**'
      - 'results/jet_gqr_256_20261007.json'
      - 'results/rule54_golden_invariance_20261007.json'
      - 'docs/research/protocols/jet-gqr-census-fibonacci-invariance-20261007.md'
      - 'docs/research/protocols/rule54-two-golden-scc-swap-20261007.md'
      - '.github/workflows/research-jet-gqr-256.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact symbolic graph runtime
        run: python -m pip install numpy scipy sympy
      - name: Compile and replay complete 256-rule census and Rule54 swap
        run: python experiments/jet_gqr_256/verify.py
