name: Research dimensional resonance physical response

# Cost-bounded permanent verification. The scientific n=6/7 evaluation and any
# byte-for-byte replay run outside GitHub Actions when they exceed Myk's ~10 min
# CI budget. Automatic CI only checks implementation/source integrity.
on:
  pull_request:
    paths:
      - 'scripts/verify_dimensional_resonance_response.py'
      - 'scripts/verify_dimensional_resonance_source_census.py'
      - 'scripts/verify_interface_factor.py'
      - 'results/dimensional_resonance_response_20260912.json'
      - 'docs/research/protocols/dimensional-resonance-response-*.md'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-dimensional-resonance-response.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_dimensional_resonance_response.py'
      - 'scripts/verify_dimensional_resonance_source_census.py'
      - 'scripts/verify_interface_factor.py'
      - 'results/dimensional_resonance_response_20260912.json'
      - 'docs/research/protocols/dimensional-resonance-response-*.md'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-dimensional-resonance-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-response-implementation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Compile pinned physical verifier
        run: python -m py_compile scripts/verify_dimensional_resonance_response.py
      - name: Replay approved source-only census/orbit construction
        run: >-
          python scripts/verify_dimensional_resonance_source_census.py
          --self-test --output /tmp/dimensional-resonance-source-census.json
      - name: Run out-of-domain physical implementation self-test
        run: python scripts/verify_dimensional_resonance_response.py --self-test
      - name: Fast canonical-result source integrity when result exists
        run: |
          if [ -f results/dimensional_resonance_response_20260912.json ]; then
            python scripts/check_result_integrity.py results/dimensional_resonance_response_20260912.json
          else
            echo 'Implementation-only stage: canonical physical-response result absent.'
          fi
