name: Groovy field bounded audit

on:
  pull_request:
    paths:
      - 'src/groovy/groovy_field.py'
      - 'scripts/groovy_field_*.py'
      - 'scripts/verify_groovy_field_audit.py'
      - 'tests/test_groovy_field.py'
      - 'results/groovy_field_20260922/**'
      - '.github/workflows/research-groovy-field.yml'
  push:
    branches: [main]
    paths:
      - 'src/groovy/groovy_field.py'
      - 'scripts/groovy_field_*.py'
      - 'scripts/verify_groovy_field_audit.py'
      - 'tests/test_groovy_field.py'
      - 'results/groovy_field_20260922/**'
      - '.github/workflows/research-groovy-field.yml'

permissions:
  contents: read

jobs:
  bounded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Verify preserved bytes and replay the bounded audit
        run: python scripts/verify_groovy_field_audit.py --check
      - name: Test closure controls and certificate rejection paths
        run: python -m pytest tests/test_groovy_field.py -q
