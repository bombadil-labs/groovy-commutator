name: Temporary second-lift report index updater

on:
  push:
    branches:
      - codex/second-lift-report
    paths:
      - '.github/workflows/temporary-second-lift-report-update.yml'
      - 'docs/research/2026-09-11-second-lift-completion.md'
      - 'docs/knowledge/second-lift-completion-comparison.md'
      - 'site/content/research/second-lift-completion.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Program, checkpoint and generated knowledge index
        shell: bash
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          dec = lambda s: base64.b64decode(s).decode()
          item21 = dec('')
          old_open = dec('LSBUaGUgcmVsYXRpb25zaGlwIGJldHdlZW4gY29ycmVjdGlvbiBkZXB0aCwgc3BhdGlhbCBkaW1lbnNpb24sIGdyb3dpbmcgc3BhdGlhbCByYWRpdXMgYW5kIG1pbmltdW0gY2F1c2FsIHJlcHJlc2VudGF0aW9uIGRpbWVuc2lvbiBpcyBub3QgeWV0IGNoYXJhY3Rlcml6ZWQuIEEgZml4ZWQgY29kZSdzIGFuY2VzdHJhbCByYW5rIG1heSBwcmltYXJpbHkgcmVmbGVjdCBpdHMgbGF5b3V0Lgo=')
          new_open = dec('')
          old_tail = dec('')
          new_tail = dec('')
          cpblock = dec('')
          p = Path('docs/research/2026-09-09-dimensional-closure-program.md')
          t = p.read_text()
          if "21. **Rule32's inherited second-lift tuples close at radius one through depth two.**" not in t:
              anchor = "20. **Loop revision and inherited control have exact support costs.** Changing a loop vector requires the sum of transverse cross-section sizes over its changed directions. Replication multiplies both edge and site costs by the added period while preserving edited trajectories. The exhaustive known-state flat-mask audit measures additional native higher-dimensional choices; its period-two full-field counts do not establish general nonlinear reversibility or an endogenous controller.\n"
              assert anchor in t and old_open in t and old_tail in t
              t = t.replace(anchor, anchor + item21, 1).replace(old_open, new_open, 1).replace(old_tail, new_tail, 1)
              p.write_text(t)
          p = Path('docs/research/checkpoints/dimensional-lift.md')
          t = p.read_text()
          heading = '## Checkpoint 2026-09-11: bounded second-lift completion comparison completed'
          if heading not in t:
              anchor = 'Program page: `docs/research/2026-09-09-dimensional-closure-program.md`\n'
              assert anchor in t
              p.write_text(t.replace(anchor, anchor + cpblock, 1))
          p = Path('site/content/knowledge.json')
          k = json.loads(p.read_text())
          for node in k['nodes']:
              if node.get('id') == 'second-lift-completion-comparison':
                  node.update({'title': "Bounded second-lift completion comparison on Rule32's inherited family", 'kind': 'experiment', 'status': 'completed', 'summary': 'For H128/H160, K/O and h=0..2, the inherited Rule32 pair family has exact minimum cap radius 1, while all full-four-symbol ambient controls fail through R<=2; the spatial lattice remains one-dimensional.', 'updated': '2026-09-11', 'source': 'docs/knowledge/second-lift-completion-comparison.md', 'research': ['second-lift-completion']})
          for edge in k['edges']:
              if edge.get('source') == 'second-lift-completion-comparison':
                  edge['research'] = ['second-lift-completion-protocol', 'second-lift-completion']
          p.write_text(json.dumps(k, separators=(',', ':')) + '\n')
          PY
      - name: Commit generated report indexes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No report-index changes needed.'
            exit 0
          fi
          git config user.name 'Codex report updater'
          git config user.email 'noreply@openai.com'
          git add docs/research/2026-09-09-dimensional-closure-program.md docs/research/checkpoints/dimensional-lift.md site/content/knowledge.json
          git commit -m 'Integrate second-lift result into Program and checkpoint'
          git push origin "HEAD:${GITHUB_REF_NAME}"
