name: Temporary second-lift report index updater

on:
  push:
    branches:
      - codex/second-lift-report
    paths:
      - '.github/workflows/temporary-second-lift-report-update.yml'
      - 'docs/research/2026-09-11-second-lift-completion.md'
      - 'docs/knowledge/second-lift-completion-comparison.md'
      - 'site/content/research/second-lift-completion.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Program, checkpoint and generated knowledge index
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          program_path = Path('docs/research/2026-09-09-dimensional-closure-program.md')
          program = program_path.read_text()
          if "21. **Rule32's inherited second-lift tuples close at radius one through depth two.**" not in program:
              anchor = "20. **Loop revision and inherited control have exact support costs.** Changing a loop vector requires the sum of transverse cross-section sizes over its changed directions. Replication multiplies both edge and site costs by the added period while preserving edited trajectories. The exhaustive known-state flat-mask audit measures additional native higher-dimensional choices; its period-two full-field counts do not establish general nonlinear reversibility or an endogenous controller.\n"
              addition = "\n21. **Rule32's inherited second-lift tuples close at radius one through depth two.** For both declared H128/H160 completions, both K/O coordinate systems and h=0,1,2, radius zero fails while radius one closes the inherited Rule32 pair family; radius two also passes. All 36 full-four-symbol ambient controls fail through radius two. The inherited O tables are literally completion-independent, while K tables can differ and remain locally recoded. This is product-alphabet correction closure on the same one-dimensional lattice, not a new spatial dimension.\n"
              assert anchor in program
              program = program.replace(anchor, anchor + addition, 1)

              old = "- The relationship between correction depth, spatial dimension, growing spatial radius and minimum causal representation dimension is not yet characterized. A fixed code's ancestral rank may primarily reflect its layout.\n"
              new = "- The relationship between correction depth, spatial dimension, growing spatial radius and minimum causal representation dimension is not yet characterized. The completed second-lift comparison keeps the spatial lattice one-dimensional while growing the represented product alphabet; its radius-one inherited closure therefore does not settle how a genuinely new spatial axis should arise. A fixed code's ancestral rank may primarily reflect its layout.\n"
              assert old in program
              program = program.replace(old, new, 1)

              old_tail = """## Planned execution: bounded second-lift completion comparison

The [frozen protocol](protocols/second-lift-completion-comparison-20260910.md) follows the completed gradient audit. Its [registered experiment](../knowledge/second-lift-completion-comparison.md) remains planned: implementation and primary evaluation are unrun. The [note](2026-09-10-second-lift-completion-protocol.md) distinguishes prior exploratory checks from the existing analytic invariant.

For H128/H160 on the shared invariant Rule32 pair family, finite-depth correction tuples are invertibly locally recoded and retain identical whole-field fibers. The open measurement is local cap radius and representation cost, with a separate full-four-symbol ambient control. This constructor increases a product alphabet and correction depth on the same spatial lattice. Proposal completion does not claim the census has run or that a new spatial dimension has been established.
"""
              new_tail = """## Completed execution: bounded second-lift completion comparison

The [frozen protocol](protocols/second-lift-completion-comparison-20260910.md) has now been executed; see the [result note](2026-09-11-second-lift-completion.md) and [knowledge record](../knowledge/second-lift-completion-comparison.md). The implementation was pinned before the primary 72-case matrix, with the recorded pre-pin control/diagnostic dry-run preserved as a procedural deviation.

For H128/H160 on the shared invariant Rule32 pair family, both K and O coordinates close with **minimum radius one** at every tested depth h=0,1,2: R=0 conflicts and R=1,2 pass for both completions. Every one of the 36 full-four-symbol ambient controls conflicts through R=2. The inherited O tables are literally identical across completions, as required by the future-coordinate theorem; K tables can differ while the exhaustive triangular recoding audits preserve their whole-field fibers and the same minimum cap radius.

The result isolates the resource being purchased: at depths 0,1,2 the represented alphabet carries 2,4,6 bits per site while the measured inherited cap radius remains one. The spatial lattice remains one-dimensional throughout. This is therefore a completed second application of the correction construction in a product alphabet, not evidence that correction depth itself is a new spatial dimension or that the turtle beam has been physically spatialized.
"""
              assert old_tail in program
              program = program.replace(old_tail, new_tail, 1)
              program_path.write_text(program)

          cp_path = Path('docs/research/checkpoints/dimensional-lift.md')
          cp = cp_path.read_text()
          heading = '## Checkpoint 2026-09-11: bounded second-lift completion comparison completed'
          if heading not in cp:
              anchor = 'Program page: `docs/research/2026-09-09-dimensional-closure-program.md`\n'
              block = r'''

## Checkpoint 2026-09-11: bounded second-lift completion comparison completed

Read `docs/research/2026-09-11-second-lift-completion.md`. This is the newest
completed dimensional unit. It executes the frozen product-alphabet protocol
without reclassifying correction depth as spatial dimension.

- Frozen protocol: `second-lift-completion-comparison-20260910.md`. Primary
  implementation commit `57e9613` was pinned before the 72-case cap matrix.
  The repository-canonical result was produced at `f65938a` and then replayed
  byte for byte by CI. Result SHA256:
  `5ecc4d863b9308f7a788297d1e6d3a82d86d021797032f72a8b24161f54b2e29`.
- Exact matrix: H128/H160 completions, inherited Rule32 first-image family
  versus the full four-symbol shift, K/O coordinates, h=0..2, R=0..2.
  24/72 cases pass and 48 conflict. Primary/reference feature-target digests
  agree for all 72; every conflict retains a canonical witness; every passing
  full tuple law is independently replayed.
- On the inherited family, every completion/coordinate/depth has the same
  threshold: R=0 conflicts, R=1 passes, R=2 passes. Thus the minimum local cap
  radius is exactly one throughout the frozen depths. At h=0,1,2 the stored
  tuple alphabet uses 2,4,6 bits per site respectively.
- On the full ambient GF(2)^2 shift, all 36 cases conflict through R=2. This is
  a bounded failure only; no arbitrary-radius exclusion follows.
- Inherited O tables are literally identical between completions at every
  budget. K tables generally differ, but exhaustive K/O and H128/H160
  triangular recodings pass their complete declared local domains. The fixed
  depth whole-field information equality is a theorem-backed control, not a
  numerical discovery.
- Finite diagnostic only: on the n=8 inherited ring, the 255 distinct first
  image states map to 254 tuple states at every h=0..2, leaving one size-two
  exceptional fiber under the uniform-distinct-state measure. Increasing
  correction depth through h=2 does not remove that finite ambiguity.
- Process record: before the implementation commit was pinned, only the
  theorem-backed recoding audits and small n=8/n=4 diagnostics were
  accidentally dry-run; no primary matrix/table result was inspected. After
  pinning, one local wrapper run was killed by infrastructure timeout and its
  partial artifacts were discarded uninspected; the unchanged rerun and the
  canonical GitHub run agree byte for byte.
- Do not infer a new spatial dimension, ambient impossibility beyond R=2,
  self-assembly, endogenous control, or an orbit/fixed-point classification.
  The spatial lattice stays Z; this result measures correction-coordinate
  locality and alphabet cost.
'''
              assert anchor in cp
              cp = cp.replace(anchor, anchor + block, 1)
              cp_path.write_text(cp)

          kpath = Path('site/content/knowledge.json')
          k = json.loads(kpath.read_text())
          for node in k['nodes']:
              if node.get('id') == 'second-lift-completion-comparison':
                  node.update({
                      'title': "Bounded second-lift completion comparison on Rule32's inherited family",
                      'kind': 'experiment',
                      'status': 'completed',
                      'summary': 'For H128/H160, K/O and h=0..2, the inherited Rule32 pair family has exact minimum cap radius 1, while all full-four-symbol ambient controls fail through R<=2; the spatial lattice remains one-dimensional.',
                      'updated': '2026-09-11',
                      'source': 'docs/knowledge/second-lift-completion-comparison.md',
                      'research': ['second-lift-completion'],
                  })
          for edge in k['edges']:
              if edge.get('source') == 'second-lift-completion-comparison':
                  edge['research'] = ['second-lift-completion-protocol', 'second-lift-completion']
          kpath.write_text(json.dumps(k, separators=(',', ':')) + '\n')
          PY
      - name: Commit generated report indexes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No report-index changes needed.'
            exit 0
          fi
          git config user.name 'Codex report updater'
          git config user.email 'noreply@openai.com'
          git add docs/research/2026-09-09-dimensional-closure-program.md docs/research/checkpoints/dimensional-lift.md site/content/knowledge.json
          git commit -m 'Integrate second-lift result into Program and checkpoint'
          git push origin "HEAD:${GITHUB_REF_NAME}"
