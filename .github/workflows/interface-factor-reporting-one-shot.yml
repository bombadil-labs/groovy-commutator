name: Interface-factor reporting publication (one-shot)

# Reporting-only orchestration. The frozen protocol, verifier and canonical
# evaluation are already integrated on the gathering branch. This workflow
# edits only publication/checkpoint/catalog metadata, then deletes itself.

on:
  push:
    branches:
      - 'research/interface-factor-reporting'
    paths:
      - '.github/workflows/interface-factor-reporting-one-shot.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-factor-reporting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Program, checkpoint, and generated catalogs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          program = Path('docs/research/2026-09-09-dimensional-closure-program.md')
          text = program.read_text()
          assert '24. **The natural six-bit touching-strip interface fails bounded local factorization.**' not in text
          marker = '\n## What remains open\n'
          assert text.count(marker) == 1
          item = (
              '\n24. **The natural six-bit touching-strip interface fails bounded local factorization.** '
              'On the exhaustive declared adjacent-strip reachable family for rings `n=6,7`, none of the 16 frozen `(A,B)` plus interface-bit masks admits an autonomous local factor at longitudinal radius `R=0,1,2` through the primary horizon; full P15 also fails through the longer stress horizon. J1/J2/J8 controls pass, and the canonical full-state `R=1` and `R=2` conflicts independently replay to causally relevant physical differences outside the retained four-row band. This closes one natural finite symbolic-interface attempt negatively, not all larger-radius, history-bearing, moving, nonlocal, or alternative representations.\n'
          )
          text = text.replace(marker, item + marker)
          text += (
              '\n## Completed execution: touching-strip interface factor\n\n'
              'The [frozen protocol](protocols/interface-factor-20260911.md) and '
              '[result note](2026-09-11-interface-factor.md) test whether the interacting pair of adjacent finite Rule90 strips can be made locally autonomous by retaining the two strip vertex bits plus four natural interface-correction bits. The six coordinates are an invertible recoding of the retained four-row band and the interface bits vanish initially, so the test does not manufacture a positive result by discarding same-site information.\n\n'
              'The census exhausts every source pair on rings `n=6` and `n=7`, pools primary transitions `t=0..3`, and separately stress-tests through `t=6`. All 16 frozen subsets of the four interface bits are tested with `A/B` retained, at exactly `R=0,1,2`. Frozen constructive bet J3 fails: full P15 has no passing radius on either horizon. Stronger within the same frozen family, no mask passes any tested radius. Thus there is no inclusion-minimal passing mask and the predeclared essential-dependency audit is not applicable.\n\n'
              'The negative result survives the fixed controls. The coordinate bijection and zero-interface initial condition pass. Every source remains exterior-background-clean after the first coarse update, while exterior departure appears by the second. Independent scalar physical replays agree with the vectorized selector evolution. For P15 at `R=2`, two records with identical five-symbol local neighborhoods have next center symbols `0` and `24`; their independently replayed next-step causal patches differ outside rows `0..3`. The canonical `R=1` conflict has the same exterior hidden-cause property.\n\n'
              'This is a bounded factor obstruction for one representation family, not a fixed-height or intrinsic-dimension impossibility theorem. Larger longitudinal radii, histories, moving/support-tracking state, other coordinates, nonlocal factors and restricted source families remain logically open and were not introduced post hoc. The result sharpens the earlier interface-state failure by showing that re-coordinating the natural six retained bits and supplying longitudinal context through radius two still does not produce an autonomous factor on the declared reachable family.\n'
          )
          program.write_text(text)

          checkpoint = Path('docs/research/checkpoints/dimensional-lift.md')
          ctext = checkpoint.read_text()
          heading = '## Checkpoint 2026-09-11: bounded touching-strip interface-factor census completed; gate-2 pending'
          assert heading not in ctext
          insert_at = ctext.find('## Checkpoint ')
          assert insert_at >= 0
          section = (
              heading + '\n\n'
              'Read `docs/research/2026-09-11-interface-factor.md`. This unit follows the adjacent-strip/interface-state work by testing a frozen finite symbolic interface representation as a pooled local factor, rather than equating raw fixed-height escape with failure of every symbolic description.\n\n'
              '- Protocol sub-PR #124 integrated at `84f5b5de` before implementation/evaluation; implementation sub-PR #126 integrated at `f75a4aa2` with no canonical result; evaluation sub-PR #127 then generated result `aa69196`, registered integrity, removed one-shot runners, passed 20 exact-head checks including permanent byte-for-byte replay, and integrated at `dd6004d`.\n'
              '- Frozen J3 is false: full six-bit P15 has no passing radius among `R=0,1,2` on primary `t=0..3`, and none on stress `t=0..6`.\n'
              '- Complete J5 census: none of the 16 frozen interface masks passes any tested radius on either horizon; there is no inclusion-minimal passing mask and no P15 dependency audit because J7 was conditional on a passing full factor.\n'
              '- J1 passes: coordinate/inverse agreement and zero initial interface corrections. J2 passes: no exterior change after the first coarse update for every declared source, with exterior departure by the second. All independent scalar J8 physical replays agree.\n'
              '- The canonical P15 `R=2` primary conflict has equal five-symbol neighborhoods but next symbols `0` and `24`; independent physical replay locates differing cells outside rows `0..3` inside the next-step causal patch. `R=1` likewise has an exterior hidden-cause witness.\n'
              '- Scope is exactly the exhaustive declared `n=6,7` adjacent-strip reachable family, frozen six-bit/interface-subset representations, fixed horizons and `R<=2`. Do not infer failure at larger radius, with history, moving/support-tracking state, other coordinates, nonlocal factors, arbitrary-width grids, or recursive 2D-to-3D lifting.\n'
              '- No post-hoc rescue representation was introduced. Reporting is integrated on the gathering branch only after this reporting sub-PR merges. Retrospective Claude/Fable review remains owed under Myk\'s temporary exception before final acceptance under the project correction/review policy.\n\n'
          )
          ctext = ctext[:insert_at] + section + ctext[insert_at:]
          checkpoint.write_text(ctext)

          rp = Path('site/content/research-program.json')
          programs = json.loads(rp.read_text())
          matched = [p for p in programs if p.get('source') == 'docs/research/2026-09-09-dimensional-closure-program.md']
          assert len(matched) == 1
          entry = matched[0]
          entry['updated'] = '2026-09-11'
          entry['summary'] = ('Transverse intervention independence supplies a positive operational axis witness, while the touching-strip interface-factor census now supplies a complementary bounded negative result: the natural six-bit interaction state and every frozen interface subset fail local closure through radius two on the declared reachable family. Both remain representation-relative; an intrinsic dimensional criterion is still open.')
          supports = entry.setdefault('supports', [])
          if 'interface-factor' not in supports:
              supports.append('interface-factor')
          rp.write_text(json.dumps(programs, indent=2, ensure_ascii=False) + '\n')

          kp = Path('site/content/knowledge.json')
          knowledge = json.loads(kp.read_text())
          node_id = 'touching-strip-local-factor-obstruction'
          assert all(n.get('id') != node_id for n in knowledge['nodes'])
          knowledge['nodes'].append({
              'id': node_id,
              'kind': 'finding',
              'status': 'exact',
              'title': 'The natural touching-strip interface state fails bounded local factorization',
              'summary': 'On the exhaustive declared n=6,7 adjacent-strip reachable family, all 16 frozen interface masks fail local factorization at R<=2; full-state R=1 and R=2 conflicts replay to causally relevant physical differences outside the retained four-row band.',
              'updated': '2026-09-11',
              'source': 'docs/knowledge/touching-strip-local-factor-obstruction.md',
              'research': ['interface-factor'],
          })
          knowledge['edges'].extend([
              {
                  'source': node_id, 'type': 'depends_on', 'target': 'coupled-strip-closure',
                  'reason': 'The frozen factor test starts from the established adjacent-strip joint-representation problem and the same physical strip encoding.',
                  'research': ['interface-factor'],
              },
              {
                  'source': node_id, 'type': 'supports', 'target': 'interface-state-failure',
                  'reason': 'The pooled reachable-domain conflicts sharpen the earlier finite-band failure: the natural six retained bits still do not close after recoding and longitudinal context through radius two.',
                  'research': ['interface-factor'],
              },
              {
                  'source': node_id, 'type': 'depends_on', 'target': 'observation-factor',
                  'reason': 'Failure is certified by equal retained local neighborhoods with different next retained center symbols under the declared factor criterion.',
                  'research': ['interface-factor'],
              },
          ])
          kp.write_text(json.dumps(knowledge, separators=(',', ':'), ensure_ascii=False) + '\n')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "docs/research/2026-09-09-dimensional-closure-program.md
          docs/research/checkpoints/dimensional-lift.md
          site/content/knowledge.json
          site/content/research-program.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/2026-09-09-dimensional-closure-program.md docs/research/checkpoints/dimensional-lift.md site/content/knowledge.json site/content/research-program.json
          git commit -m 'Integrate interface-factor result into program and checkpoint'
      - name: Remove reporting-only runner and push publication commits
        run: |
          git rm .github/workflows/interface-factor-reporting-one-shot.yml
          git commit -m 'Remove one-shot interface-factor reporting runner'
          git push origin HEAD:research/interface-factor-reporting
