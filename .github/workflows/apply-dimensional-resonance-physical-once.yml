name: Apply dimensional resonance physical verifier once

on:
  push:
    branches: ['work/dimensional-resonance-response/physical-verifier']
    paths: ['.github/workflows/apply-dimensional-resonance-physical-once.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-resonance-response/physical-verifier
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize pinned implementation files
        env:
          VERIFIER_B64: ''
          WORKFLOW_B64: ''
        run: |
          python - <<'PY2'
          import base64, gzip, os, pathlib
          pathlib.Path('scripts/verify_dimensional_resonance_response.py').write_bytes(gzip.decompress(base64.b64decode(os.environ['VERIFIER_B64'])))
          pathlib.Path('.github/workflows/research-dimensional-resonance-response.yml').write_bytes(gzip.decompress(base64.b64decode(os.environ['WORKFLOW_B64'])))
          PY2
      - name: Register future canonical result preservation-safely
        run: |
          python - <<'PY2'
          from pathlib import Path
          p=Path('scripts/check_result_integrity.py')
          s=p.read_text()
          key="'results/dimensional_resonance_response_20260912.json'"
          if key in s:
              raise SystemExit('future dimensional resonance result already registered; refusing ambiguous patch')
          marker='}\n\ndef sha('
          if marker not in s:
              raise SystemExit('integrity registry terminator not found')
          entry = (
              "    'results/dimensional_resonance_response_20260912.json': {\n"
              "        'script': 'scripts/verify_dimensional_resonance_response.py',\n"
              "        'protocol': 'docs/research/protocols/dimensional-resonance-response-20260912.md',\n"
              "        'gate1_refreeze': 'docs/research/protocols/dimensional-resonance-response-gate1-refreeze-20260912.md',\n"
              "        'gate1_null_clarification': 'docs/research/protocols/dimensional-resonance-response-gate1-null-clarification-20260912.md',\n"
              "        'gate1_approval': 'docs/research/protocols/dimensional-resonance-response-gate1-approval-20260912.md',\n"
              "        'source_census_script': 'scripts/verify_dimensional_resonance_source_census.py',\n"
              "        'physical_predecessor_script': 'scripts/verify_interface_factor.py'},\n\n"
          )
          s=s.replace(marker, entry+marker, 1)
          p.write_text(s)
          PY2
      - run: python -m pip install -e .
      - name: Cheap no-result implementation checks only
        run: |
          python -m py_compile scripts/verify_dimensional_resonance_response.py
          python scripts/verify_dimensional_resonance_source_census.py --self-test --output /tmp/source.json
          python scripts/verify_dimensional_resonance_response.py --self-test
          test ! -e results/dimensional_resonance_response_20260912.json
      - name: Commit implementation and remove one-shot editor
        run: |
          rm .github/workflows/apply-dimensional-resonance-physical-once.yml
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          git add scripts/verify_dimensional_resonance_response.py .github/workflows/research-dimensional-resonance-response.yml scripts/check_result_integrity.py .github/workflows/apply-dimensional-resonance-physical-once.yml
          git commit -m 'research: pin dimensional resonance physical verifier'
          git push origin HEAD:work/dimensional-resonance-response/physical-verifier
