name: Research checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/research/**'
      - 'docs/knowledge/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/pull_request_template.md'
      - 'results/**'
      - 'site/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/research-*.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/research/**'
      - 'docs/knowledge/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/pull_request_template.md'
      - 'results/**'
      - 'site/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/research-*.yml'

permissions:
  contents: read

jobs:
  python-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and research runtime
        run: python -m pip install -e . pandas
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Fast canonical-result integrity
        run: python scripts/check_result_integrity.py
      - name: Existing algebra regression
        run: python scripts/verify_history_algebra.py
      - name: Representation-design smoke test
        run: >-
          python scripts/experiment_representation_design.py
          --rule-start 106 --rule-end 107 --n 8 --max-steps 64
          --output /tmp/representation-design-smoke.json
      - name: Block-3 Rule24 independent counterexample audit
        run: >-
          python scripts/audit_block3_representation_design.py
          --output /tmp/block3-rule24-audit.json
      - name: Block-3 Rule24 fresh-size regression
        run: >-
          python scripts/check_block3_representation_design_rule24_n15.py
          --output /tmp/block3-rule24-n15.json

  program-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Test Program publisher
        run: node --test scripts/research-program.test.mjs
        working-directory: site

  research-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Test Research and Knowledge publishers
        run: node --test scripts/research.test.mjs scripts/knowledge.test.mjs
        working-directory: site

  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Build site
        run: npm run build
        working-directory: site
