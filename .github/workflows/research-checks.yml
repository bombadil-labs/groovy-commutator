name: Research checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/research/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/research-*.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/research/**'
      - 'results/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/research-*.yml'

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  python-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and research runtime
        run: python -m pip install -e . pandas
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Existing algebra regression
        run: python scripts/verify_history_algebra.py
      - name: Representation-design smoke test
        run: >-
          python scripts/experiment_representation_design.py
          --rule-start 106 --rule-end 107 --n 8 --max-steps 64
          --output /tmp/representation-design-smoke.json
      - name: Block-3 Rule24 independent counterexample audit
        run: >-
          python scripts/audit_block3_representation_design.py
          --output /tmp/block3-rule24-audit.json
      - name: Block-3 Rule24 fresh-size regression
        run: >-
          python scripts/check_block3_representation_design_rule24_n15.py
          --output /tmp/block3-rule24-n15.json
      - name: Surface Research029 retained cost-aware counterexamples
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'research/fatal-predictive-synergy-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/r029-publication
          mkdir -p /tmp/r029-publication
          gh run download 34321656128 --repo "$GITHUB_REPOSITORY" --name contextual-quotient-publication --dir /tmp/r029-publication
          python - <<'PY' > /tmp/r029-cost-failures.md
          import json
          from pathlib import Path
          files=list(Path('/tmp/r029-publication').rglob('contextual-quotient-summary.json'))
          if len(files)!=1:
              raise SystemExit(f'expected one summary, found {files}')
          x=json.loads(files[0].read_text())
          print('## Research029 retained cost-aware counterexamples')
          print()
          print(f"Frozen cost-aware prediction: **{x['cost_aware_failures']} failures**.")
          print()
          for r in x['cost_aware_failure_cases']:
              print(f"- Rule **{r['rule']}**, target `{r['target']}`, quotient `{r['quotient']}`")
              print(f"  - first unsafe: `{json.dumps(r['first_unsafe'], sort_keys=True)}`")
          PY
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/r029-cost-failures.md
