name: One-shot summarize interface-history global result

on:
  push:
    branches: [research/interface-history-global-evaluation]
    paths:
      - '.github/workflows/run-interface-history-global-summary.yml'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-history-global-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write compact review summary from the committed canonical result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/interface_history_global_20260912.json')
          d=json.loads(p.read_text())
          counts={}
          total_pass=0
          total=0
          for ring, rd in d['census'].items():
              counts[ring]={}
              for domain, dd in rd.items():
                  counts[ring][domain]={}
                  for h, hd in dd.items():
                      passed=[int(m) for m,v in hd.items() if v['pass']]
                      counts[ring][domain][h]={'pass_count':len(passed),'passing_masks':passed}
                      total_pass += len(passed); total += len(hd)
          p15={}
          for ring in ('6','7'):
              x=d['census'][ring]['D2']['2']['15']
              p15[ring]={
                'pass':x['pass'],
                'canonical_conflict':x['canonical_conflict'],
              }
          controls=d['controls']
          summary={
            'G4_primary_bet_holds_both_rings':d['G4_primary_bet_holds_both_rings'],
            'G4_by_ring':d['G4_P15_h2_D2_global_conflict_by_ring'],
            'G5_P15_ladders':d['G5_P15_ladders'],
            'G6_pareto_minimal':d['G6_pareto_minimal'],
            'total_cells':total,
            'passing_cells':total_pass,
            'conflicting_cells':total-total_pass,
            'counts':counts,
            'P15_h2_D2':p15,
            'G1_local_regression':controls['G1_predecessor_source_hashes_and_full_state_local_regression'],
            'G3_monotonicity':controls['G3_history_refinement_monotonicity'],
            'G7_reference_agreement_cells':controls['G7_primary_reference_verdict_agreement_cells'],
            'G7_conflict_replay_count':len(controls['G7_canonical_global_conflict_replays']),
            'source_hashes':d['source_hashes'],
            'scope':d['scope'],
          }
          Path('results/interface_history_global_20260912_summary.tmp.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit temporary review summary
        run: |
          git config user.name 'Codex interface-history-global review summary'
          git config user.email 'noreply@openai.com'
          git add results/interface_history_global_20260912_summary.tmp.json
          git commit -m 'chore: expose compact global interface-history review summary'
          git push origin HEAD:research/interface-history-global-evaluation
