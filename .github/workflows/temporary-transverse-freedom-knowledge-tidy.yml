name: Temporary transverse-freedom knowledge tidy

on:
  push:
    branches:
      - work/dimensional-spatial-axis/reporting
    paths:
      - '.github/workflows/temporary-transverse-freedom-knowledge-tidy.yml'

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/dimensional-spatial-axis/reporting
      - name: Align knowledge-node type with exact finding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('site/content/knowledge.json')
          data = json.loads(p.read_text())
          node = next(n for n in data['nodes'] if n.get('id') == 'transverse-freedom-capacity')
          node['kind'] = 'finding'
          node['status'] = 'exact'
          p.write_text(json.dumps(data, separators=(',', ':')) + '\n')
          PY
          git config user.name 'Codex report integrator'
          git config user.email 'noreply@openai.com'
          git add site/content/knowledge.json
          git rm .github/workflows/temporary-transverse-freedom-knowledge-tidy.yml
          git commit -m 'Classify transverse-freedom knowledge entry as exact finding'
          git push origin HEAD:work/dimensional-spatial-axis/reporting
