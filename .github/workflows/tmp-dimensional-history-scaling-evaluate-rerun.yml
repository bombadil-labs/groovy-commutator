name: One-shot dimensional history-scaling theorem-control evaluation rerun

on:
  push:
    branches:
      - research/dimensional-history-scaling-evaluation-rerun
    paths:
      - '.github/workflows/tmp-dimensional-history-scaling-evaluate-rerun.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run canonical frozen theorem-control evaluation from corrected workflow stage
        run: python scripts/verify_dimensional_history_scaling_control.py
      - name: Commit canonical result and remove one-shot runner
        shell: bash
        run: |
          test -f results/dimensional_history_scaling_control_20260912.json
          rm .github/workflows/tmp-dimensional-history-scaling-evaluate-rerun.yml
          git config user.name 'Codex history-scaling evaluation runner'
          git config user.email 'noreply@openai.com'
          git add results/dimensional_history_scaling_control_20260912.json .github/workflows/tmp-dimensional-history-scaling-evaluate-rerun.yml
          git commit -m 'research: reevaluate dimensional history-scaling theorem control'
          git push origin HEAD:research/dimensional-history-scaling-evaluation-rerun
