name: Temporary interface-history result inspection

on:
  push:
    branches:
      - work/dimensional-interface-history/evaluation
    paths:
      - '.github/workflows/_temporary-interface-history-inspection.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write minimal result summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/interface_history_20260911.json').read_text())
          out=[]
          out.append('TOP_LEVEL_KEYS=' + ', '.join(d.keys()))
          out.append('SUMMARY=' + json.dumps(d.get('summary'), sort_keys=True))
          for key in ('predictions','verdicts','controls'):
              if key in d:
                  out.append(key.upper()+'=' + json.dumps(d[key], sort_keys=True)[:8000])
          wanted={'K1','K2','K3','K4','K5','K6','K7','K8','K9','K10'}
          hits=[]
          def walk(x,path=''):
              if isinstance(x,dict):
                  for k,v in x.items():
                      np=f'{path}.{k}' if path else k
                      if k.upper() in wanted:
                          s=json.dumps(v, sort_keys=True)
                          hits.append(np+'='+s[:4000])
                      walk(v,np)
              elif isinstance(x,list):
                  for i,v in enumerate(x[:100]): walk(v,f'{path}[{i}]')
          walk(d)
          out.extend(hits[:30])
          Path('.interface-history-result-mini.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit mini inspection file only
        run: |
          git config user.name 'Codex interface-history inspection'
          git config user.email 'actions@users.noreply.github.com'
          git add .interface-history-result-mini.txt
          test "$(git diff --cached --name-only)" = '.interface-history-result-mini.txt'
          git commit -m 'chore: inspect interface-history summary'
          git push
