name: Temporary interface-history result inspection

on:
  push:
    branches:
      - work/dimensional-interface-history/evaluation
    paths:
      - '.github/workflows/_temporary-interface-history-inspection.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write focused result summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/interface_history_20260911.json').read_text())
          keys=['K4_one_lag_constructive_bet','K5_depth_two_outcome','K6_pareto_minimal','K9_dependency_audits']
          lines=[]
          for k in keys:
              lines.append(k+'='+json.dumps(d.get(k), sort_keys=True)[:12000])
          p15=d.get('P15',{})
          if isinstance(p15,dict):
              compact={}
              for k,v in p15.items():
                  if isinstance(v,(str,int,float,bool)) or v is None:
                      compact[k]=v
                  elif isinstance(v,dict) and len(v)<=20:
                      compact[k]=v
              lines.append('P15_COMPACT='+json.dumps(compact, sort_keys=True)[:12000])
          Path('.interface-history-focused.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Commit focused inspection file only
        run: |
          git config user.name 'Codex interface-history inspection'
          git config user.email 'actions@users.noreply.github.com'
          git add .interface-history-focused.txt
          test "$(git diff --cached --name-only)" = '.interface-history-focused.txt'
          git commit -m 'chore: inspect interface-history verdicts'
          git push
