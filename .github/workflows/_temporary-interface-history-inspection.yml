name: Temporary interface-history result inspection

on:
  push:
    branches:
      - work/dimensional-interface-history/evaluation
    paths:
      - '.github/workflows/_temporary-interface-history-inspection.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write scalar control summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/interface_history_20260911.json').read_text())
          leaves=[]
          def walk(x,path=''):
              if len(leaves)>=300: return
              if isinstance(x,dict):
                  for k,v in x.items(): walk(v,f'{path}.{k}' if path else k)
              elif isinstance(x,(str,int,float,bool)) or x is None:
                  if any(tag in path.lower() for tag in ('pass','agreement','discrep','mismatch','k1','k2','k3','k7','k8','k10')):
                      leaves.append(f'{path}={json.dumps(x)}')
          walk(d.get('controls',{}),'controls')
          Path('.interface-history-controls-mini.txt').write_text('\n'.join(leaves)+'\n')
          PY
      - name: Commit scalar inspection file only
        run: |
          git config user.name 'Codex interface-history inspection'
          git config user.email 'actions@users.noreply.github.com'
          git add .interface-history-controls-mini.txt
          test "$(git diff --cached --name-only)" = '.interface-history-controls-mini.txt'
          git commit -m 'chore: inspect interface-history controls'
          git push
