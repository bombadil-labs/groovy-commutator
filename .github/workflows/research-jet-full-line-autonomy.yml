name: Exact full-line commutator jet autonomy

on:
  pull_request:
    paths:
      - "experiments/jet_full_line_autonomy_20261007/**"
      - "results/jet_full_line_autonomy_20261007.json"
      - "experiments/jet_gqr_256/jet_algebra.py"
      - ".github/workflows/research-jet-full-line-autonomy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-jet-factor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric runtime
        run: python -m pip install numpy
      - name: Replay 20 full-line factor decisions and minimum radii
        run: python experiments/jet_full_line_autonomy_20261007/verify.py
      - name: Replay complete Rule54 finite-ring fiber census
        run: python experiments/jet_full_line_autonomy_20261007/verify_periodic_fibers.py
