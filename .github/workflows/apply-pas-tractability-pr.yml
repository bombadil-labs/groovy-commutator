name: Diagnose PAS tractability patch and self-test

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pas-tractability-pr.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'work/predictive-assembly-support/tractability-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/predictive-assembly-support/tractability-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture patch and bounded self-test output
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/pas-full-diagnostic.log 2>&1
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/apply-pas-tractability-once.yml').read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line == '        run: |']
          print(f'blocks={len(starts)}')
          if len(starts) != 3:
              raise SystemExit(90)
          i = starts[0] + 1
          block = []
          while i < len(lines):
              line = lines[i]
              if line.strip() == '':
                  block.append(''); i += 1; continue
              indent = len(line) - len(line.lstrip(' '))
              if indent < 10: break
              block.append(line[10:]); i += 1
          patch = subprocess.run(['bash','-lc','\n'.join(block)+'\n'], text=True, capture_output=True)
          print('PATCH_RC', patch.returncode)
          print('PATCH_STDOUT'); print(patch.stdout)
          print('PATCH_STDERR'); print(patch.stderr)
          if patch.returncode:
              raise SystemExit(patch.returncode)
          comp = subprocess.run(['python','-m','py_compile','scripts/verify_predictive_assembly_support.py'], text=True, capture_output=True)
          print('COMPILE_RC', comp.returncode); print(comp.stdout); print(comp.stderr)
          if comp.returncode: raise SystemExit(comp.returncode)
          st = subprocess.run(['python','scripts/verify_predictive_assembly_support.py','--self-test'], text=True, capture_output=True)
          print('SELFTEST_RC', st.returncode)
          print('SELFTEST_STDOUT'); print(st.stdout)
          print('SELFTEST_STDERR'); print(st.stderr)
          raise SystemExit(st.returncode)
          PY
          rc=$?
          git reset --hard HEAD
          printf 'diagnostic_rc=%s\n' "$rc" > .pas-editor-diagnostic.log
          cat /tmp/pas-full-diagnostic.log >> .pas-editor-diagnostic.log
          git config user.name 'Codex PAS tractability'
          git config user.email 'noreply@openai.com'
          git add .pas-editor-diagnostic.log
          git commit -m 'ci: update PAS tractability diagnostic'
          git push origin HEAD:work/predictive-assembly-support/tractability-certificate
          exit 0
