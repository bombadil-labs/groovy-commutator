name: Apply PAS tractability certificate on PR

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pas-tractability-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'work/predictive-assembly-support/tractability-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/predictive-assembly-support/tractability-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute the staged solver patch exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines = Path('.github/workflows/apply-pas-tractability-once.yml').read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line == '        run: |']
          if len(starts) != 3:
              raise SystemExit(f'expected 3 staged run blocks, found {len(starts)}')
          i = starts[0] + 1
          block = []
          while i < len(lines):
              line = lines[i]
              if line.strip() == '':
                  block.append('')
                  i += 1
                  continue
              indent = len(line) - len(line.lstrip(' '))
              if indent < 10:
                  break
              block.append(line[10:])
              i += 1
          cp = subprocess.run(['bash', '-lc', '\n'.join(block) + '\n'])
          raise SystemExit(cp.returncode)
          PY
      - name: Run bounded implementation-only verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/verify_predictive_assembly_support.py
          python scripts/verify_predictive_assembly_support.py --self-test
          test ! -f results/predictive_assembly_support_20260912.json
      - name: Commit only the solver correction; remove all temporary editor artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Codex PAS tractability'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/apply-pas-tractability-once.yml
          git rm .github/workflows/apply-pas-tractability-pr.yml
          git rm .pas-editor-diagnostic.log
          git add scripts/verify_predictive_assembly_support.py
          git commit -m 'research: pin bounded PAS independent optimality certificate'
          git push origin HEAD:work/predictive-assembly-support/tractability-certificate
