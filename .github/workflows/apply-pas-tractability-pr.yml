name: Diagnose PAS tractability patch script

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pas-tractability-pr.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'work/predictive-assembly-support/tractability-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/predictive-assembly-support/tractability-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture patch, compile, and self-test output
        shell: bash
        run: |
          set +e
          : > /tmp/pasdiag
          echo PREIMAGE=$(git hash-object scripts/verify_predictive_assembly_support.py) >> /tmp/pasdiag
          python .pas_patch.py >> /tmp/pasdiag 2>&1
          echo PATCH_RC=$? >> /tmp/pasdiag
          python -m py_compile scripts/verify_predictive_assembly_support.py >> /tmp/pasdiag 2>&1
          echo COMPILE_RC=$? >> /tmp/pasdiag
          python scripts/verify_predictive_assembly_support.py --self-test >> /tmp/pasdiag 2>&1
          echo SELFTEST_RC=$? >> /tmp/pasdiag
          git reset --hard HEAD
          cp /tmp/pasdiag .pas-editor-diagnostic.log
          git config user.name 'Codex PAS tractability'
          git config user.email 'noreply@openai.com'
          git add .pas-editor-diagnostic.log
          git commit -m 'ci: preserve PAS patch-script diagnostic'
          git push origin HEAD:work/predictive-assembly-support/tractability-certificate
          exit 0
