name: Diagnose PAS tractability editor

on:
  pull_request:
    paths:
      - '.github/workflows/apply-pas-tractability-pr.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'work/predictive-assembly-support/tractability-certificate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/predictive-assembly-support/tractability-certificate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture first staged editor block output
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/pas-editor.log 2>&1
          from pathlib import Path
          import re, subprocess, textwrap
          text = Path('.github/workflows/apply-pas-tractability-once.yml').read_text()
          blocks = [textwrap.dedent(m.group(1)) for m in re.finditer(r'(?m)^        run: \|\n((?:^          .*\n)+)', text)]
          print(f'blocks={len(blocks)}')
          if len(blocks) != 3:
              raise SystemExit(f'expected 3 staged run blocks, found {len(blocks)}')
          cp = subprocess.run(['bash', '-lc', blocks[0]], text=True, capture_output=True)
          print(f'block1_rc={cp.returncode}')
          print('STDOUT:')
          print(cp.stdout)
          print('STDERR:')
          print(cp.stderr)
          raise SystemExit(cp.returncode)
          PY
          rc=$?
          git reset --hard HEAD
          printf 'diagnostic_rc=%s\n' "$rc" > .pas-editor-diagnostic.log
          cat /tmp/pas-editor.log >> .pas-editor-diagnostic.log
          git config user.name 'Codex PAS tractability'
          git config user.email 'noreply@openai.com'
          git add .pas-editor-diagnostic.log
          git commit -m 'ci: preserve PAS tractability editor diagnostic'
          git push origin HEAD:work/predictive-assembly-support/tractability-certificate
          exit 0
