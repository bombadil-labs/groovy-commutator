name: Materialize dimensional resonance implementation once
on:
  push:
    branches: ['work/dimensional-resonance-response/physical-verifier']
    paths: ['.github/workflows/materialize-dimensional-resonance-once.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-resonance-response/physical-verifier
          fetch-depth: 0
      - name: Materialize implementation and diagnostic log
        shell: bash
        run: |
          set -u
          python - <<'PY' > .resonance-materialize.log 2>&1
          import base64, gzip, pathlib, re, traceback
          try:
              src=pathlib.Path('.github/workflows/apply-dimensional-resonance-physical-once.yml').read_text()
              for env_name, dest in [('VERIFIER_B64','scripts/verify_dimensional_resonance_response.py'),('WORKFLOW_B64','.github/workflows/research-dimensional-resonance-response.yml')]:
                  m=re.search(rf"{env_name}: '([^']+)'", src)
                  if not m: raise RuntimeError(f'{env_name} not found')
                  pathlib.Path(dest).write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
                  print('wrote', dest)
              p=pathlib.Path('scripts/check_result_integrity.py')
              s=p.read_text()
              key="'results/dimensional_resonance_response_20260912.json'"
              if key not in s:
                  marker='}\n\ndef sha('
                  print('marker_present', marker in s)
                  if marker in s:
                      entry=("    'results/dimensional_resonance_response_20260912.json': {\n"
                             "        'script': 'scripts/verify_dimensional_resonance_response.py',\n"
                             "        'protocol': 'docs/research/protocols/dimensional-resonance-response-20260912.md',\n"
                             "        'gate1_refreeze': 'docs/research/protocols/dimensional-resonance-response-gate1-refreeze-20260912.md',\n"
                             "        'gate1_null_clarification': 'docs/research/protocols/dimensional-resonance-response-gate1-null-clarification-20260912.md',\n"
                             "        'gate1_approval': 'docs/research/protocols/dimensional-resonance-response-gate1-approval-20260912.md',\n"
                             "        'source_census_script': 'scripts/verify_dimensional_resonance_source_census.py',\n"
                             "        'physical_predecessor_script': 'scripts/verify_interface_factor.py'},\n\n")
                      p.write_text(s.replace(marker,entry+marker,1))
                      print('registered future result')
                  else:
                      print('registry not patched; marker absent')
              else:
                  print('future result already registered')
          except Exception:
              traceback.print_exc()
          PY
          cat .resonance-materialize.log
      - name: Commit whatever was materialized
        run: |
          rm -f .github/workflows/apply-dimensional-resonance-physical-once.yml .github/workflows/debug-dimensional-resonance-physical-once.yml .github/workflows/materialize-dimensional-resonance-once.yml
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'research: materialize dimensional resonance verifier for bounded review'
          git push origin HEAD:work/dimensional-resonance-response/physical-verifier