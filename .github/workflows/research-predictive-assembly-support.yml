name: Predictive assembly support audit

# Permanent two-tier workflow. Before evaluation the canonical result is absent:
# CI syntax-checks the verifier and runs synthetic/provenance self-tests only.
# Once evaluation adds the canonical JSON, every touching PR checks hashes and
# result-changing PRs/main/weekly/manual runs replay the verifier byte for byte.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/verify_predictive_assembly_support.py'
      - 'scripts/verify_interface_history_global.py'
      - 'scripts/verify_interface_history.py'
      - 'scripts/verify_interface_factor.py'
      - 'results/predictive_assembly_support_20260912.json'
      - 'results/interface_history_global_20260912.json'
      - 'docs/research/protocols/predictive-assembly-support-20260912.md'
      - 'docs/research/protocols/predictive-assembly-support-gate1-clarification-20260912.md'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-predictive-assembly-support.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_predictive_assembly_support.py'
      - 'scripts/verify_interface_history_global.py'
      - 'scripts/verify_interface_history.py'
      - 'scripts/verify_interface_factor.py'
      - 'results/predictive_assembly_support_20260912.json'
      - 'results/interface_history_global_20260912.json'
      - 'docs/research/protocols/predictive-assembly-support-20260912.md'
      - 'docs/research/protocols/predictive-assembly-support-gate1-clarification-20260912.md'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-predictive-assembly-support.yml'
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predictive-assembly-support:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Syntax-check the pinned verifier
        run: python -m py_compile scripts/verify_predictive_assembly_support.py
      - name: Run implementation-only synthetic/provenance self-test
        run: python scripts/verify_predictive_assembly_support.py --self-test
      - name: Recorded source hashes match when canonical result exists
        run: |
          if [ -f results/predictive_assembly_support_20260912.json ]; then
            python scripts/check_result_integrity.py results/predictive_assembly_support_20260912.json
          else
            echo 'Implementation-only stage: canonical PAS result not committed yet.'
          fi
      - name: Does this run require the full canonical replay?
        id: result
        run: |
          if [ ! -f results/predictive_assembly_support_20260912.json ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'results/predictive_assembly_support_20260912.json'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Replay frozen verifier and compare canonical JSON byte for byte
        if: steps.result.outputs.changed == 'true'
        run: |
          cp results/predictive_assembly_support_20260912.json /tmp/expected.json
          python scripts/verify_predictive_assembly_support.py > /dev/null
          cmp /tmp/expected.json results/predictive_assembly_support_20260912.json
