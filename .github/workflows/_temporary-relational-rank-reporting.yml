name: Temporary relational-rank reporting integration

on:
  push:
    branches:
      - work/dimensional-relational-rank/reporting
    paths:
      - '.github/workflows/_temporary-relational-rank-reporting.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-relational-rank/reporting
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded current-account edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy
          import json

          checkpoint_path = Path('docs/research/checkpoints/dimensional-lift.md')
          program_path = Path('docs/research/2026-09-09-dimensional-closure-program.md')
          program_registry_path = Path('site/content/research-program.json')
          knowledge_path = Path('site/content/knowledge.json')

          checkpoint_block = '''## Checkpoint 2026-09-12: relational-rank audit completed; gate-2 pending

          Read `docs/research/2026-09-12-relational-rank.md`. This unit operationalizes the “dependent origination” intuition only as a scoped distinction between translation directions available to a declared state family and displacement directions used by a local law.

          - Gate 1: Claude/Fable first rejected protocol head `ad304465` because the anchored-track control hid presentation dependence, the proposed causal-rank census was already decided by a product theorem, and pairwise-difference rank would misclassify pure shifts. Correction #142 froze `rho_T=rank((H_B/K_B) tensor Q)`, added the anchored/translation-closure pair, defined `rho_C` from essential offsets themselves, proved `E(G_{r,2})=E_r×E_r`, and received renewed approval on exact head `803a775715a2a8bfe4a3214a43186f81c6aab431` before implementation/evaluation.
          - Implementation-only #146 integrated the independent evaluators and permanent workflow with no canonical result. The first evaluation #150 was preserved and closed after its Rule-51 analytic control incorrectly expected one NOT rather than the frozen two-pass cancellation. Correction #151 changed only that control before the regenerated run.
          - Corrected evaluation #152 generated `results/relational_rank_20260912.json`. The final evaluation head has zero product-theorem discrepancies, identical primary/reference target hashes, and all frozen P1–P8 verdicts true. A post-run CI repair registered the result and strengthened replay without changing scientific code or output.
          - Translation controls: 0D/full-1D/full-2D ranks are `0/1/2`; a literal copied 1D family inside 2D remains rank 1; finite product alphabets and anchored finite track families need not add translation rank; taking the translation closure of the anchored-track family raises `rho_T` from 1 to 2. `rho_T` is therefore explicitly family/presentation-relative.
          - Ordered-axis causal result: source rank zero is exactly `{0,51,204,255}`; target ranks are 0 for those four, 1 for `{15,85,170,240}`, and 2 for the remaining 248, with transitions `0→0:4`, `1→1:4`, `1→2:248` and no `1→0` collapse.
          - The central result is negative information: for this accepted constructor, target essential offsets are exactly `E_r×E_r`, so target `rho_C` supplies no rule classification beyond source essentiality. The relational-lift profile remains bookkeeping only.
          - Cross-tabs against the accepted 66/24/14/16 source families are deterministic descriptive intersections, not enrichment or natural-selection evidence.
          - Do not infer intrinsic/representation-independent dimension, a unique spatial theory, self-assembly, endogenous control, spacetime emergence, physics, metaphysics, Buddhist-doctrinal equivalence, or any `8n+1`/prime connection.
          - **Review state:** result reporting and current-account integration are complete on the gathering branch after this reporting sub-PR merges; exact-head Gate 2 and reviewer merge remain required before acceptance on `main`.
          '''
          checkpoint_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in checkpoint_block.splitlines()).strip() + '\n'
          checkpoint = checkpoint_path.read_text()
          cp_anchor = 'Program page: `docs/research/2026-09-09-dimensional-closure-program.md`\n'
          cp_marker = '## Checkpoint 2026-09-12: relational-rank audit completed; gate-2 pending'
          if cp_marker not in checkpoint:
              assert checkpoint.count(cp_anchor) == 1
              updated = checkpoint.replace(cp_anchor, cp_anchor + '\n' + checkpoint_block, 1)
              assert updated.replace('\n' + checkpoint_block, '', 1) == checkpoint
              checkpoint_path.write_text(updated)

          program_section = '''## Relational rank separates available directions from law-used directions

          The [relational-rank audit](2026-09-12-relational-rank.md) introduces two deliberately representation-relative quantities. `rho_T` is the free rank of lattice translations that act nontrivially on a declared state family after quotienting translations that fix the family pointwise; `rho_C` is the integer rank spanned by a local rule's essential displacement offsets. The controls make the distinction concrete: literal 1D replication into 2D leaves the copied image at translation rank one inside a rank-two full target, finite product alphabets and anchored finite track families need not increase translation rank, and taking the translation closure of the same track family raises `rho_T` from one to two. The last comparison is intentional evidence that `rho_T` depends on the declared family/presentation.

          For the accepted ordered-axis ECA constructor the causal-rank follow-up is an exact negative-information result rather than a new classifier. Gate 1 exposed and froze the theorem `E(G_{r,2})=E_r×E_r`; the complete 256-rule × 512-patch replay has no discrepancy. Target `rho_C` is zero for `{0,51,204,255}`, one for `{15,85,170,240}`, and two for the other 248 rules, so it is fully determined by source essentiality. The relational-lift profile therefore remains bookkeeping that separates available translation rank from law-used displacement rank, not an intrinsic dimensional invariant.

          The “dependent origination” phrase is retained only as motivation for asking relational questions. This result does not establish Buddhist doctrine, intrinsic dimension, a unique theory of space, self-assembly, spacetime emergence, physics, metaphysics, or a prime/`8n+1` connection.
          '''
          program_section = '\n'.join(line[10:] if line.startswith('          ') else line for line in program_section.splitlines()).strip() + '\n\n'
          program = program_path.read_text()
          pg_marker = '## Relational rank separates available directions from law-used directions'
          pg_anchor = '## Exact intertwining supplies a baseline\n'
          if pg_marker not in program:
              assert program.count(pg_anchor) == 1
              updated = program.replace(pg_anchor, program_section + pg_anchor, 1)
              assert updated.replace(program_section, '', 1) == program
              program_path.write_text(updated)

          registry = json.loads(program_registry_path.read_text())
          before_registry = copy.deepcopy(registry)
          target = next(p for p in registry if p.get('slug') == 'dimensional-lift')
          support = 'relational-rank'
          if support not in target['supports']:
              target['supports'].append(support)
          target['updated'] = '2026-09-12'
          target['summary'] = ('Transverse intervention independence, the bounded interface-factor obstruction and the zero-dimensional selector audit remain complementary representation-relative results. '
                               'The relational-rank audit now separates translation directions available to a declared family from displacement directions used by a law: copied 1D images remain translation-rank one inside a rank-two 2D target, while for the accepted ordered-axis constructor target causal rank is completely determined by source essentiality. '
                               'These ranks clarify resource accounting but do not supply an intrinsic dimensional criterion.')
          check = copy.deepcopy(registry)
          target_check = next(p for p in check if p.get('slug') == 'dimensional-lift')
          target_before = next(p for p in before_registry if p.get('slug') == 'dimensional-lift')
          target_check['supports'] = [x for x in target_check['supports'] if x != support]
          target_check['updated'] = target_before['updated']
          target_check['summary'] = target_before['summary']
          assert check == before_registry
          program_registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n')

          knowledge = knowledge_path.read_text()
          node_id = 'relational-rank-available-used-directions'
          edge1 = {"source":node_id,"type":"depends_on","target":"zero-dimensional-selector-overlap","reason":"The relational-rank unit follows the zero-base audit's distinction between an available target direction and the local architecture actually used by the inherited law.","research":["relational-rank","zero-dimensional-base"]}
          edge2 = {"source":node_id,"type":"depends_on","target":"representation-contract","reason":"Both rho_T and rho_C are explicitly scoped to declared state families, lattice presentations and local-law representations rather than promoted to intrinsic dimension.","research":["relational-rank","dimensional-vision-and-interpretation"]}
          node = {"id":node_id,"kind":"finding","status":"exact","title":"Available translation directions and law-used causal directions are distinct but representation-relative","summary":"rho_T separates nontrivial translation action on a declared state family from rho_C, the rank of a local law's essential displacement offsets. Copied or anchored families can remain translation-rank one inside 2D, but translation closure changes rho_T; for the accepted ordered-axis ECA constructor, E(G_r,2)=E_r×E_r makes target rho_C entirely determined by source essentiality, so the new rank adds no independent rule classification.","updated":"2026-09-12","source":"docs/knowledge/relational-rank.md","research":["relational-rank"]}
          if f'"id":"{node_id}"' not in knowledge:
              edge_marker = '],"nodes":['
              node_marker = '],"schemaVersion":1}'
              assert knowledge.count(edge_marker) == 1
              assert knowledge.count(node_marker) == 1
              edge_text = ',' + json.dumps(edge1, separators=(',', ':'), ensure_ascii=False) + ',' + json.dumps(edge2, separators=(',', ':'), ensure_ascii=False)
              node_text = ',' + json.dumps(node, separators=(',', ':'), ensure_ascii=False)
              updated = knowledge.replace(edge_marker, edge_text + edge_marker, 1)
              updated = updated.replace(node_marker, node_text + node_marker, 1)
              assert updated.replace(edge_text, '', 1).replace(node_text, '', 1) == knowledge
              json.loads(updated)
              knowledge_path.write_text(updated)

          print('relational-rank current-account update prepared')
          PY
      - name: Commit bounded reporting integration and remove temporary workflow
        run: |
          git config user.name 'Codex relational-rank reporting integration'
          git config user.email 'noreply@openai.com'
          git add docs/research/checkpoints/dimensional-lift.md \
                  docs/research/2026-09-09-dimensional-closure-program.md \
                  site/content/research-program.json \
                  site/content/knowledge.json
          git rm .github/workflows/_temporary-relational-rank-reporting.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'report: integrate relational-rank current account safely'
          git push origin HEAD:work/dimensional-relational-rank/reporting