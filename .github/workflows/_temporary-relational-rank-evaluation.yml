name: Temporary relational-rank evaluation

on:
  push:
    branches:
      - work/dimensional-relational-rank/evaluation
    paths:
      - '.github/workflows/_temporary-relational-rank-evaluation.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify canonical result is absent before first run
        run: test ! -f results/relational_rank_20260912.json
      - name: Execute frozen verifier once
        run: python scripts/verify_relational_rank.py
      - name: Commit canonical result only
        run: |
          git config user.name 'Codex relational-rank evaluation'
          git config user.email 'actions@users.noreply.github.com'
          git add results/relational_rank_20260912.json
          test "$(git diff --cached --name-only)" = 'results/relational_rank_20260912.json'
          git commit -m 'research: evaluate frozen relational-rank protocol'
          git push
