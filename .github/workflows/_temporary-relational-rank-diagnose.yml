name: Temporary relational-rank replay diagnosis

on:
  push:
    branches:
      - work/dimensional-relational-rank/evaluation-corrected
    paths:
      - '.github/workflows/_temporary-relational-rank-diagnose.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Replay and capture exact diff/integrity status
        shell: bash
        run: |
          set +e
          cp results/relational_rank_20260912.json /tmp/before.json
          python scripts/verify_relational_rank.py >/tmp/verifier.out 2>/tmp/verifier.err
          verifier_status=$?
          python scripts/check_result_integrity.py >/tmp/integrity.out 2>/tmp/integrity.err
          integrity_status=$?
          git diff -- results/relational_rank_20260912.json >/tmp/result.diff
          diff_status=$?
          {
            echo "verifier_status=$verifier_status"
            echo "integrity_status=$integrity_status"
            echo "git_diff_command_status=$diff_status"
            echo "--- verifier stdout ---"
            cat /tmp/verifier.out
            echo "--- verifier stderr ---"
            cat /tmp/verifier.err
            echo "--- integrity stdout ---"
            cat /tmp/integrity.out
            echo "--- integrity stderr ---"
            cat /tmp/integrity.err
            echo "--- result diff ---"
            sed -n '1,400p' /tmp/result.diff
          } > .relational-rank-replay-diagnosis.txt
      - name: Commit diagnosis only
        run: |
          git checkout -- results/relational_rank_20260912.json
          git config user.name 'Codex relational-rank diagnosis'
          git config user.email 'actions@users.noreply.github.com'
          git add .relational-rank-replay-diagnosis.txt
          test "$(git diff --cached --name-only)" = '.relational-rank-replay-diagnosis.txt'
          git commit -m 'chore: diagnose relational-rank replay failure'
          git push
