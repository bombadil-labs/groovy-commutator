name: Closed-violation depth-three certificate

# Cost-bounded from the start, per Myk's 2026-09-12 CI-cost boundary (PR #201,
# tightened by sub-PR #203) and the nineteenth unit's protocol Section 3: the
# canonical run of this verifier is expected at 60-100 minutes and bounded above
# by about three hours, so it is NEVER triggered automatically and is run once
# outside GitHub Actions from the pinned, reviewed implementation. Automatic
# pull-request and push runs do only what is seconds-to-minutes scale: compile
# and the verifier's sub-two-minute --self-test (measured at about 3 seconds),
# which writes nothing.
#
# This workflow first landed in the implementation-only sub-PR, before any
# canonical result existed, so the fast integrity tier was deliberately left
# out: scripts/check_result_integrity.py's docstring, after the eighteenth
# unit's Gate-2 B1 correction, registers a result only once the canonical run
# has actually produced the file, and a registered-but-absent result now fails
# that sweep outright. The canonical result exists as of the evaluation stage,
# so it is registered in that script and the seconds-scale integrity step is
# wired into both jobs below (and into the result file's own path triggers),
# and a registered result can no longer go missing silently.

on:
  pull_request:
    paths:
      - 'scripts/verify_closed_violation_depth_three.py'
      - 'scripts/verify_full_shift_depth_three.py'
      - 'scripts/verify_depth_one_certificate.py'
      - 'scripts/check_result_integrity.py'
      - 'results/closed_violation_depth_three_20260913.json'
      - '.github/workflows/research-closed-violation-depth-three.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_closed_violation_depth_three.py'
      - 'scripts/verify_full_shift_depth_three.py'
      - 'scripts/verify_depth_one_certificate.py'
      - 'scripts/check_result_integrity.py'
      - 'results/closed_violation_depth_three_20260913.json'
      - '.github/workflows/research-closed-violation-depth-three.yml'
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Myk authorization reference for the expensive full replay (leave empty for the cheap tier only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  cheap-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research package
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Verifier self test (writes nothing)
        run: python scripts/verify_closed_violation_depth_three.py --self-test
      - name: Recorded source hashes match the tree
        run: python scripts/check_result_integrity.py results/closed_violation_depth_three_20260913.json

  full-replay:
    # Manual only, and only when an authorization reference is supplied: this is
    # the 60-to-100-minute replay, never automatic. The canonical result now
    # exists, so there is something to replay.
    if: github.event_name == 'workflow_dispatch' && inputs.authorization != ''
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recorded source hashes match the tree
        run: python scripts/check_result_integrity.py results/closed_violation_depth_three_20260913.json
      - name: Install research package
        run: python -m pip install -e .
      - name: Rerun the frozen audit and compare the canonical JSON byte for byte
        run: |
          echo "Authorized expensive replay: ${{ inputs.authorization }}"
          cp results/closed_violation_depth_three_20260913.json /tmp/expected.json
          python scripts/verify_closed_violation_depth_three.py > /dev/null
          cmp /tmp/expected.json results/closed_violation_depth_three_20260913.json
