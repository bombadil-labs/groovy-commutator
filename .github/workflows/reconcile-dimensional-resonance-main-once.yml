name: Diagnose dimensional resonance reconciliation commands once

on:
  push:
    branches:
      - work/dimensional-resonance-response/reconcile-main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-resonance-response/reconcile-main
          fetch-depth: 0
      - name: Capture merge-resolution command statuses
        shell: bash
        run: |
          set +e
          git fetch origin main
          git config user.name "Codex resonance reconciliation"
          git config user.email "noreply@openai.com"
          git merge --no-commit --no-ff origin/main >/tmp/merge.out 2>&1
          merge_rc=$?
          git diff --name-only --diff-filter=U >/tmp/conflicts
          conflict_rc=$?
          git checkout --theirs scripts/check_result_integrity.py >/tmp/checkout.out 2>&1
          checkout_rc=$?
          python .reconcile_resonance_integrity.py >/tmp/helper.out 2>&1
          helper_rc=$?
          git add scripts/check_result_integrity.py >/tmp/add.out 2>&1
          add_rc=$?
          git status --porcelain=v2 >/tmp/status.out 2>&1
          status_rc=$?
          git merge --abort >/tmp/abort.out 2>&1
          abort_rc=$?
          {
            echo "merge_rc=$merge_rc conflict_rc=$conflict_rc checkout_rc=$checkout_rc helper_rc=$helper_rc add_rc=$add_rc status_rc=$status_rc abort_rc=$abort_rc"
            echo "--- conflicts"; cat /tmp/conflicts
            echo "--- merge"; cat /tmp/merge.out
            echo "--- checkout"; cat /tmp/checkout.out
            echo "--- helper"; cat /tmp/helper.out
            echo "--- add"; cat /tmp/add.out
            echo "--- status-before-abort"; cat /tmp/status.out
            echo "--- abort"; cat /tmp/abort.out
          } > .resonance-reconcile-debug
          rm .github/workflows/reconcile-dimensional-resonance-main-once.yml
          git add .resonance-reconcile-debug .github/workflows/reconcile-dimensional-resonance-main-once.yml
          git commit -m "chore: capture resonance reconciliation command diagnostics"
          git push origin HEAD:work/dimensional-resonance-response/reconcile-main
