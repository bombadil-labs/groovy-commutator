name: Diagnose dimensional resonance main reconciliation once

on:
  push:
    branches:
      - work/dimensional-resonance-response/reconcile-main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dimensional-resonance-response/reconcile-main
          fetch-depth: 0
      - name: Preserve exact conflict inventory
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            printf 'NO_CONFLICTS\n' > .resonance-main-conflicts
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts
            cp /tmp/conflicts .resonance-main-conflicts
            git merge --abort
          fi
          rm .github/workflows/reconcile-dimensional-resonance-main-once.yml
          git config user.name "Codex resonance reconciliation"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "chore: preserve resonance main conflict inventory"
          git push origin HEAD:work/dimensional-resonance-response/reconcile-main
