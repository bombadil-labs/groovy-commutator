name: Temporary interface-history merge diagnosis

on:
  push:
    branches:
      - gather/dimensional-interface-history
    paths:
      - '.github/workflows/_temporary-interface-history-reconcile.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gather/dimensional-interface-history
          fetch-depth: 0
      - name: Record exact merge-conflict surface
        run: |
          git config user.name 'Codex interface-history reconciliation'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          rc=$?
          set -e
          {
            echo "merge_exit=$rc"
            echo 'conflicts:'
            git diff --name-status --diff-filter=U
            echo 'stages:'
            git ls-files -u
          } > /tmp/conflicts.txt
          if [ -f .git/MERGE_HEAD ]; then git merge --abort; fi
          cp /tmp/conflicts.txt .interface-history-merge-conflicts.txt
          git add .interface-history-merge-conflicts.txt
          git commit -m 'chore: record interface-history merge conflicts'
          git push origin HEAD:gather/dimensional-interface-history