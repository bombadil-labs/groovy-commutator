name: Temporary interface-history main reconciliation

on:
  push:
    branches:
      - gather/dimensional-interface-history
    paths:
      - '.github/workflows/_temporary-interface-history-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gather/dimensional-interface-history
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge latest main and restore the pre-existing interface-history registry entry
        run: |
          git config user.name 'Codex interface-history reconciliation'
          git config user.email 'noreply@openai.com'
          git fetch origin main
          # Conflict diagnosis established that scripts/check_result_integrity.py is
          # the sole conflict. Resolve that one path in favor of current main.
          git merge --no-ff -X theirs origin/main -m 'Merge current main into finite interface history'
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_result_integrity.py')
          s = p.read_text()
          if 'results/interface_history_20260911.json' not in s:
              entry = """    'results/interface_history_20260911.json': {\n        'script': 'scripts/verify_interface_history.py',\n        'protocol': 'docs/research/protocols/interface-history-20260911.md',\n        'interface_factor_result': 'results/interface_factor_20260911.json',\n        'interface_factor_script': 'scripts/verify_interface_factor.py'},\n"""
              marker = '}\n\ndef sha('
              if marker not in s:
                  raise SystemExit('integrity insertion marker not found')
              s = s.replace(marker, entry + marker, 1)
              p.write_text(s)
          PY
          git rm -f .github/workflows/_temporary-interface-history-reconcile.yml
          git rm -f .interface-history-merge-conflicts.txt
          git add scripts/check_result_integrity.py
          git diff --cached --check
          git commit -m 'Restore interface-history integrity registration after main reconciliation'
          git push origin HEAD:gather/dimensional-interface-history