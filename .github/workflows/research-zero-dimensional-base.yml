name: Zero-dimensional base audit

# Implementation-only stage: this workflow syntax-checks the verifier and runs
# only its explicitly out-of-domain k=2 self-test while the canonical result is
# absent. Once evaluation creates the canonical result, every touching PR runs
# the fast source-hash integrity tier; result-changing PRs, main, weekly, and
# manual runs replay the frozen audit byte for byte.

on:
  pull_request:
    paths:
      - 'scripts/verify_zero_dimensional_base.py'
      - 'results/zero_dimensional_base_20260912.json'
      - 'docs/research/protocols/zero-dimensional-base-20260912.md'
      - 'results/history_algebra_checks.json'
      - 'results/shared_state_rule_20260907_audit.json'
      - 'results/shared_state_rule_20260907_local.json'
      - 'results/guard_free_axial_lift_20260910.json'
      - 'results/editable_routing_tables_20260909.json'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-zero-dimensional-base.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_zero_dimensional_base.py'
      - 'results/zero_dimensional_base_20260912.json'
      - 'docs/research/protocols/zero-dimensional-base-20260912.md'
      - 'results/history_algebra_checks.json'
      - 'results/shared_state_rule_20260907_audit.json'
      - 'results/shared_state_rule_20260907_local.json'
      - 'results/guard_free_axial_lift_20260910.json'
      - 'results/editable_routing_tables_20260909.json'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-zero-dimensional-base.yml'
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  current-account-update:
    if: github.event_name == 'pull_request' && github.head_ref == 'work/dimensional-zero-base/current-account-safe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded current-account edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import copy
          import json

          checkpoint_path = Path('docs/research/checkpoints/dimensional-lift.md')
          program_path = Path('docs/research/2026-09-09-dimensional-closure-program.md')
          program_registry_path = Path('site/content/research-program.json')
          knowledge_path = Path('site/content/knowledge.json')

          checkpoint_block = '''## Checkpoint 2026-09-12: zero-dimensional base selector audit completed; gate-2 pending

          Read `docs/research/2026-09-12-zero-dimensional-base.md`. This unit audits the bottom two law/state cardinality matches after the first Gate-1 review exposed two important confounds: the accepted 1D→2D selector requires address/program role overlap, and compensated decoder reindexing is not geometric covariance.

          - Gate 1: Claude/Fable first rejected exact head `ca5a34ad`; protocol-only correction #137 resolved the disjoint-role, covariance-null, and architecture-shopping blockers, and renewed Gate 1 approved exact head `c46a6f7d4c13a56512b20832be4f1b2489a50f78` before implementation/evaluation.
          - Implementation-only PR #140 integrated with no canonical result. Evaluation PR #141 then ran the unchanged verifier, registered `results/zero_dimensional_base_20260912.json`, and obtained byte-for-byte permanent replay. All frozen P1–P8 verdicts pass.
          - The complete binary 0D floor is `{0,204,51,255}` under the center-only ECA embedding; accepted affine-commutator responses are `(0,0,1,1)`.
          - Single-layer role accounting gives minimum overlap `max(0, k + 2^k - |P|)`: Z0 attains 0; Z1 necessarily requires and attains 2, with `W` and `E` dual-role address/program state.
          - All 16 frozen Gray-family layouts have all nine inputs essential, degree four, and exactly six quartic terms. Degree/full essentiality are generic multiplexer facts; six quartics fingerprint the two-site overlap and are layout-independent here.
          - The frozen Gray geometry yields a negative result: induced shell `D4` address actions intersect the ECA group generated by mirror and address complement only at the identity.
          - Center-only ordered-axis dynamics are `f^d`; Rule 51/NOT alternates with dimension parity, while its separate exact-replication failure is due to `u_51=NOT` fixing no attainable bit.
          - The accepted editable-routing family uses `8d` native routing bits, hence 16 at `d=2`; this is not arbitrary 512-bit 2D-rule compression or a demonstrated 3D shell interpreter. Repeated execution was deferred.
          - Do not infer intrinsic dimension, natural/unique geometry, self-assembly, endogenous program selection, spacetime emergence, physics, metaphysics, arbitrary 2D→3D shell encoding, or any `8n+1`/prime connection.
          - **Review state:** exact result reporting and current-account integration are complete on the gathering branch; exact-head Gate 2 and reviewer merge remain required before acceptance on `main`.
          '''
          checkpoint_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in checkpoint_block.splitlines()).strip() + '\n'
          checkpoint = checkpoint_path.read_text()
          cp_anchor = 'Program page: `docs/research/2026-09-09-dimensional-closure-program.md`\n'
          cp_marker = '## Checkpoint 2026-09-12: zero-dimensional base selector audit completed; gate-2 pending'
          if cp_marker not in checkpoint:
              assert checkpoint.count(cp_anchor) == 1
              updated = checkpoint.replace(cp_anchor, cp_anchor + '\n' + checkpoint_block, 1)
              assert updated.replace('\n' + checkpoint_block, '', 1) == checkpoint
              checkpoint_path.write_text(updated)

          program_section = '''## Zero-dimensional base exposes selector overlap before geometry

          The [zero-dimensional base audit](2026-09-12-zero-dimensional-base.md) makes the 0D floor explicit and rechecks the shared-shell selector without treating raw bit-count matches as geometry. The 0D→1D and 1D→2D constructions instantiate the same overlap-permitted local multiplexer semantics, but their physical role accounting differs: Z0 attains zero address/program overlap while a single-layer Z1 Moore patch necessarily requires two overlapping roles and attains that minimum with `W` and `E` dual-role. Across the frozen 16-layout Gray family, every selector has nine essential inputs, degree four and six quartic terms, while the familiar ECA mirror/complement group meets the induced shell `D4` actions only at the identity.

          This is an exact local architecture result, not repeated stateful execution or an intrinsic-dimension theorem. The negative geometry classification rules out the earlier idea that the Gray placement itself supplies a nontrivial familiar ECA symmetry. Repeated execution was split into later work before implementation, and the separate relational-rank protocol is motivated by these distinctions but is not evidence supplied by this result.
          '''
          program_section = '\n'.join(line[10:] if line.startswith('          ') else line for line in program_section.splitlines()).strip() + '\n\n'
          program = program_path.read_text()
          pg_marker = '## Zero-dimensional base exposes selector overlap before geometry'
          pg_anchor = '## Exact intertwining supplies a baseline\n'
          if pg_marker not in program:
              assert program.count(pg_anchor) == 1
              updated = program.replace(pg_anchor, program_section + pg_anchor, 1)
              assert updated.replace(program_section, '', 1) == program
              program_path.write_text(updated)

          registry = json.loads(program_registry_path.read_text())
          before_registry = copy.deepcopy(registry)
          target = next(p for p in registry if p.get('slug') == 'dimensional-lift')
          support = 'zero-dimensional-base'
          if support not in target['supports']:
              target['supports'].append(support)
          target['updated'] = '2026-09-12'
          target['summary'] = ('Transverse intervention independence and the bounded interface-factor obstruction remain complementary operational results. '
                               'The zero-dimensional base audit now shows that the first two law/state cardinality matches share one local selector semantics only after exposing a change from zero to two required address/program role overlaps; the frozen Gray geometry supplies no nontrivial familiar ECA symmetry. '
                               'All of these statements remain representation-relative; an intrinsic dimensional criterion is still open.')
          check = copy.deepcopy(registry)
          target_check = next(p for p in check if p.get('slug') == 'dimensional-lift')
          target_before = next(p for p in before_registry if p.get('slug') == 'dimensional-lift')
          target_check['supports'] = [x for x in target_check['supports'] if x != support]
          target_check['updated'] = target_before['updated']
          target_check['summary'] = target_before['summary']
          assert check == before_registry
          program_registry_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n')

          knowledge = knowledge_path.read_text()
          node_id = 'zero-dimensional-selector-overlap'
          edge1 = {"source":node_id,"type":"depends_on","target":"neighborhood-selector","reason":"The exact Z1 audit reuses the accepted shared-shell selector and exposes the minimum two dual-role address/program cells in that architecture.","research":["zero-dimensional-base","shared-state-rule"]}
          edge2 = {"source":node_id,"type":"depends_on","target":"representation-contract","reason":"The overlap and symmetry results are scoped to an explicit law/state/interpreter contract and are not promoted to an intrinsic-dimension claim.","research":["zero-dimensional-base","dimensional-vision-and-interpretation"]}
          node = {"id":node_id,"kind":"finding","status":"exact","title":"The first two law/state selector rungs share one local semantics but require different role overlap","summary":"The binary 0D selector attains zero address/program overlap; the accepted ECA Moore-shell selector necessarily requires and attains two dual-role cells. All 16 frozen Gray layouts have nine essential inputs, degree four and six quartic terms, while their induced D4 actions share only identity with the familiar ECA mirror/complement group.","updated":"2026-09-12","source":"docs/knowledge/zero-dimensional-selector-overlap.md","research":["zero-dimensional-base"]}
          if f'"id":"{node_id}"' not in knowledge:
              edge_marker = '],"nodes":['
              node_marker = '],"schemaVersion":1}'
              assert knowledge.count(edge_marker) == 1
              assert knowledge.count(node_marker) == 1
              edge_text = ',' + json.dumps(edge1, separators=(',', ':'), ensure_ascii=False) + ',' + json.dumps(edge2, separators=(',', ':'), ensure_ascii=False)
              node_text = ',' + json.dumps(node, separators=(',', ':'), ensure_ascii=False)
              updated = knowledge.replace(edge_marker, edge_text + edge_marker, 1)
              updated = updated.replace(node_marker, node_text + node_marker, 1)
              assert updated.replace(edge_text, '', 1).replace(node_text, '', 1) == knowledge
              json.loads(updated)
              knowledge_path.write_text(updated)

          print('current-account update prepared')
          PY
      - name: Restore workflow and commit only current-account records
        run: |
          git fetch origin "${{ github.base_ref }}"
          git checkout "origin/${{ github.base_ref }}" -- .github/workflows/research-zero-dimensional-base.yml
          git config user.name "Codex current-account integration"
          git config user.email "actions@users.noreply.github.com"
          git add docs/research/checkpoints/dimensional-lift.md \
                  docs/research/2026-09-09-dimensional-closure-program.md \
                  site/content/research-program.json \
                  site/content/knowledge.json \
                  .github/workflows/research-zero-dimensional-base.yml
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'no current-account changes to commit'
          else
            git commit -m 'report: integrate zero-base current account safely'
            git push origin HEAD:"${{ github.head_ref }}"
          fi

  zero-dimensional-base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check the frozen verifier
        run: python -m py_compile scripts/verify_zero_dimensional_base.py
      - name: Run implementation self-test outside the frozen Z0/Z1 domains
        run: python scripts/verify_zero_dimensional_base.py --self-test
      - name: Check recorded source hashes when a canonical result exists
        run: |
          if [ -f results/zero_dimensional_base_20260912.json ]; then
            python scripts/check_result_integrity.py results/zero_dimensional_base_20260912.json
          else
            echo 'implementation-only head: canonical result intentionally absent'
          fi
      - name: Decide whether full replay is required
        id: replay
        run: |
          if [ ! -f results/zero_dimensional_base_20260912.json ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'results/zero_dimensional_base_20260912.json'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Rerun the frozen audit and compare canonical JSON byte for byte
        if: steps.replay.outputs.run == 'true'
        run: |
          cp results/zero_dimensional_base_20260912.json /tmp/expected.json
          python scripts/verify_zero_dimensional_base.py > /dev/null
          cmp /tmp/expected.json results/zero_dimensional_base_20260912.json
