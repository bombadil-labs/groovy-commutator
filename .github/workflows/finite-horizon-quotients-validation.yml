name: Research030 finite-horizon quotient validation

on:
  push:
    branches:
      - research/finite-horizon-quotients-20260909
    paths:
      - 'scripts/experiment_finite_horizon_quotients.py'
      - 'scripts/aggregate_finite_horizon_quotients.py'
      - 'scripts/audit_finite_horizon_quotients.py'
      - 'scripts/check_finite_horizon_quotients_n15.py'
      - 'docs/research/protocols/finite-horizon-quotients-*.md'
      - '.github/workflows/finite-horizon-quotients-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finite-horizon-quotients-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and research runtime
        run: python -m pip install -e . pandas
      - name: Run long-memory sentinels
        run: |
          mkdir -p artifacts
          python scripts/experiment_finite_horizon_quotients.py \
            --rule-start 101 --rule-end 102 \
            --output artifacts/finite-horizon-rule101.json
          python scripts/experiment_finite_horizon_quotients.py \
            --rule-start 106 --rule-end 107 \
            --output artifacts/finite-horizon-rule106.json
      - name: Verify early local quotient discovery
        run: |
          python - <<'PY'
          import json
          cases={(101,'00000010'):(23,1),(106,'00000001'):(19,1)}
          seen=set()
          for fn in ('artifacts/finite-horizon-rule101.json','artifacts/finite-horizon-rule106.json'):
              x=json.load(open(fn))
              for row in x['rows']:
                  for t in row['targets']:
                      key=(t['rule'],t['target'])
                      if key in cases:
                          hs,dq=cases[key]
                          assert t['hstar']==hs and t['quotient_discovery_time']==dq and dq < hs, (key,t)
                          seen.add(key)
          assert seen==set(cases), (seen,cases)
          print({'sentinel_cases':sorted(seen)})
          PY

  shard:
    needs: sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and research runtime
        run: python -m pip install -e . pandas
      - name: Run exact finite-horizon quotient shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          start=$((SHARD * 32))
          end=$((start + 32))
          mkdir -p artifacts
          python scripts/experiment_finite_horizon_quotients.py \
            --rule-start "$start" --rule-end "$end" \
            --output "artifacts/finite-horizon-quotients-${start}-${end}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: finite-horizon-quotients-shard-${{ matrix.shard }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and research runtime
        run: python -m pip install -e . pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: finite-horizon-quotients-shard-*
          path: artifacts/shards
          merge-multiple: true
      - name: Aggregate exact census
        run: |
          mkdir -p artifacts/final
          python scripts/aggregate_finite_horizon_quotients.py \
            --input-dir artifacts/shards \
            --output artifacts/final/finite-horizon-quotients-summary.json
      - name: Independent explicit-context audit
        run: >-
          python scripts/audit_finite_horizon_quotients.py
          --summary artifacts/final/finite-horizon-quotients-summary.json
          --output artifacts/final/finite-horizon-quotients-audit.json
      - name: Frozen n=15 confirmation
        run: >-
          python scripts/check_finite_horizon_quotients_n15.py
          --output artifacts/final/finite-horizon-quotients-n15.json
      - name: Print compact summary
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifacts/final/finite-horizon-quotients-summary.json'))
          lm=x['long_memory_hstar_ge_10']
          print({
            'nonclosed':x['nonclosed_targets'],
            'early_fraction':x['early_quotient_fraction'],
            'half_info_early_fraction':x['half_info_before_half_hstar_fraction'],
            'median_dQ_over_hstar':x['median_dq_over_hstar'],
            'max_dQ':x['max_quotient_discovery_time'],
            'max_hstar':x['max_hstar'],
            'long_memory_cases':lm['cases'],
            'long_memory_all_dQ_one':lm['all_dq_one'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: finite-horizon-quotients-publication
          path: artifacts/final/*.json
          if-no-files-found: error
          retention-days: 90
