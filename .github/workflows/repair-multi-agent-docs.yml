name: Repair multi-agent collaboration docs

on:
  push:
    branches:
      - docs/multi-agent-collaboration

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore from main and apply collaboration edits
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:AGENTS.md > AGENTS.md
          git show origin/main:docs/research/README.md > docs/research/README.md
          python - <<'PY'
          from pathlib import Path

          p = Path('AGENTS.md')
          text = p.read_text()
          text = text.replace(
              '- Before experimental implementation and evaluation, obtain explicit\n  other-model review of the frozen protocol, as specified in\n',
              '- Before experimental implementation and evaluation, obtain explicit\n  independent-agent review of the frozen protocol, as specified in\n',
          )
          text = text.replace(
              '- If the other model is unavailable at protocol freeze, Myk may explicitly\n',
              '- If no independent collaborating agent is available at protocol freeze, Myk may explicitly\n',
          )
          text = text.replace(
              '  correction path; this exception does not waive other-model review before\n',
              '  correction path; this exception does not waive independent-agent review before\n',
          )
          old = '''- When the unit is complete, update its notes, knowledge dependencies,\n  Program and checkpoint as applicable. List its sub-PRs, deviations,\n  negative findings, verification, and unresolved limits in the gathering PR.\n  Mark it ready and obtain explicit review from the other model: Claude/Fable\n  reviews Codex-led work, and Codex reviews Claude/Fable-led work. Review the\n  combined argument, implementation, results, and interpretation.\n- Do not merge a gathering PR into `main` until relevant checks are green,\n  review findings are resolved, and the other model explicitly signs off on\n  the current head SHA. Material changes after review require renewed review;\n  after any head change, the reviewer must confirm applicability to the new\n  head. If both models authored the unit, state their contributions and\n  cross-review each other's work; self-review alone is insufficient.\n'''
          new = '''- When the unit is complete, update its notes, knowledge dependencies,\n  Program and checkpoint as applicable. List its sub-PRs, deviations,\n  negative findings, verification, and unresolved limits in the gathering PR.\n  Mark it ready and obtain explicit review from an **independent collaborating\n  agent**. Codex and Claude/Fable remain the default reciprocal reviewers, but\n  additional collaborators may join the same review pool. The reviewer must not\n  have authored the work being independently gated. Review the combined\n  argument, implementation, results, and interpretation.\n- Do not merge a gathering PR into `main` until relevant checks are green,\n  review findings are resolved, and an independent collaborating agent\n  explicitly signs off on the current head SHA. Material changes after review\n  require renewed review; after any head change, the reviewer must confirm\n  applicability to the new head. If multiple agents authored the unit, state\n  their contributions and arrange cross-review so that each independently gated\n  contribution is reviewed by an agent who did not author it; self-review alone\n  is insufficient.\n'''
          if old not in text:
              raise SystemExit('AGENTS review block not found')
          text = text.replace(old, new)
          anchor = '''- A signed PR comment is acceptable when agents share a GitHub account and\n  GitHub cannot record a separate formal approval. Include agent/model/session\n  identity, date, reviewed SHA, review scope and an explicit sign-off or list\n  of remaining blockers. CI success, silence, and a thumbs-up reaction alone\n  are not sign-off.\n'''
          addition = anchor + '''- **Additional collaborators are first-class participants.** A collaborator\n  may propose a new research Program in its own gathering PR, contribute\n  protocol/implementation/evaluation sub-PRs, and review work from other\n  agents. A new Program proposal should state its thesis/question, relationship\n  to existing Programs, scope and non-claims, initial research agenda, owner(s),\n  and intended review pool; when accepted it gets the normal Program registry\n  entry and checkpoint log. Do not force a genuinely distinct proposal into an\n  existing Program merely because its vocabulary overlaps.\n- Identify agent work by the **signed agent/model/session provenance and PR\n  context**, not GitHub username alone. Different agents may legitimately share\n  the same GitHub account. Branch names, PR bodies, signed comments, commit\n  authorship and session/model signatures are coordination evidence. A newly\n  participating agent should use the same signed-review format from its first\n  contribution so automated/manual review cycles can recognize its work.\n- Review sharing is many-to-many, not a fixed Codex↔Fable pairing. Any\n  participating agent may perform Gate 1 or Gate 2 for another agent's work if\n  it is independent of that work and has read the current protocol/context.\n  Prefer diversity of reviewers across successive units when practical, but do\n  not require a particular vendor/model family. The scientific requirement is\n  independent review, not brand identity.\n'''
          if anchor not in text:
              raise SystemExit('AGENTS signed-review anchor not found')
          text = text.replace(anchor, addition)
          text = text.replace("When the reviewing model's gate-2 review finds no", "When the reviewing agent's gate-2 review finds no")
          p.write_text(text)

          p = Path('docs/research/README.md')
          text = p.read_text()
          text = text.replace(
              '1. **Before implementation and evaluation:** the other model reviews the\n   frozen protocol, including definitions, predictions, domain, budget,\n',
              '1. **Before implementation and evaluation:** an independent collaborating\n   agent reviews the frozen protocol, including definitions, predictions, domain, budget,\n',
          )
          text = text.replace(
              '   If the reviewer is unavailable, Myk may explicitly authorize proceeding\n',
              '   If no independent reviewer is available, Myk may explicitly authorize proceeding\n',
          )
          text = text.replace(
              '2. **Before merge into main:** the other model reviews the complete unit at\n   the gathering PR\'s current head SHA, including code, evidence, deviations,\n',
              '2. **Before merge into main:** an independent collaborating agent reviews the complete unit at\n   the gathering PR\'s current head SHA, including code, evidence, deviations,\n',
          )
          text = text.replace(
              '   head\'s checks are green, the reviewing model merges with a merge commit in\n',
              '   head\'s checks are green, the reviewing agent merges with a merge commit in\n',
          )
          needle = 'Preserve original protocols and datasets when correcting a completed run.\n\n'
          addition = needle + '''### Multiple collaborating agents\n\nThe review protocol is intentionally not limited to one fixed pair of models.\nCodex and Claude/Fable are the current default reciprocal reviewers, and new\ncollaborating agents may join the same authorship/review pool. The invariant is\n**independence**: an agent may not supply the independent gate for work it\nauthored. For jointly authored work, record contribution boundaries and arrange\ncross-review so each independently gated contribution is reviewed by someone\nwho did not author it.\n\nA collaborator may introduce a new research Program through a normal gathering\nPR. The proposal should make the research question or thesis legible, situate\nit relative to the existing Programs without assuming it belongs to one of\nthem, state scope and non-claims, sketch the initial research agenda, name its\nowner(s) and intended reviewer pool, and add the Program/checkpoint registration\nwhen the proposal is accepted. A distinct outside perspective is allowed to\nremain a distinct Program; conceptual overlap alone is not grounds to collapse\nit into an existing line.\n\nAgents may share a GitHub account, so provenance is semantic rather than tied to\nGitHub username. Sign substantive PR comments/reviews with agent/model/session\nidentity and date, and pin reviews to the exact head SHA and scope. Branch names,\nPR context, commit authorship and signed comments together identify who authored\nand who reviewed a unit. This also lets automated review cycles recognize work\nfrom newly participating collaborators without hard-coding one username or one\nmodel family.\n\n'''
          if needle not in text:
              raise SystemExit('README insertion point not found')
          text = text.replace(needle, addition)
          p.write_text(text)
          PY
          rm .github/workflows/repair-multi-agent-docs.yml
          git config user.name 'Codex / OpenAI GPT-5.6 Sol'
          git config user.email 'codex@users.noreply.github.com'
          git add AGENTS.md docs/research/README.md .github/workflows/repair-multi-agent-docs.yml
          git commit -m 'Document multi-agent research collaboration protocol'
          git push origin HEAD:docs/multi-agent-collaboration