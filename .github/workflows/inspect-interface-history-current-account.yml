name: One-shot clean dimensional current account

on:
  push:
    branches: [research/interface-history-global-current-account]
    paths:
      - '.github/workflows/inspect-interface-history-current-account.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-history-global-current-account
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore compact knowledge-registry serialization
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('site/content/knowledge.json')
          data=json.loads(p.read_text())
          p.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':'))+'\n')
          PY
      - name: Remove all temporary inspection/apply artifacts and commit
        run: |
          git rm -f .github/workflows/apply-interface-history-global-current-account.yml
          git rm -f .github/workflows/inspect-interface-history-current-account.yml
          git rm -f tmp-interface-history-current-account-context.txt
          git rm -f tmp-interface-history-current-account-compact.txt
          git rm -f tmp-interface-history-knowledge-schema.json
          git rm -f tmp_apply_interface_history_global_current_account.py
          git add site/content/knowledge.json
          git config user.name 'Codex dimensional current-account cleanup'
          git config user.email 'noreply@openai.com'
          git commit -m 'chore: remove current-account inspection scaffolding'
          git push origin HEAD:research/interface-history-global-current-account
