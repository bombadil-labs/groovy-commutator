name: One-shot inspect dimensional current account

on:
  push:
    branches: [research/interface-history-global-current-account]
    paths:
      - '.github/workflows/inspect-interface-history-current-account.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-history-global-current-account
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract compact preservation-safe edit context
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          out=[]
          program='docs/research/2026-09-09-dimensional-closure-program.md'
          lines=Path(program).read_text().splitlines()
          out.append(f'===== {program} headings =====')
          out.extend(f'{i+1}: {x}' for i,x in enumerate(lines) if x.startswith('#'))
          out.append(f'===== {program} relevant contexts =====')
          hits=[i for i,x in enumerate(lines) if any(k in x.lower() for k in ['interface-history','interface history','touching-strip','interface factor','interface-factor'])]
          for i in hits[:20]:
              a=max(0,i-2); b=min(len(lines),i+4)
              out.extend(f'{j+1}: {lines[j]}' for j in range(a,b)); out.append('---')
          checkpoint='docs/research/checkpoints/dimensional-lift.md'
          lines=Path(checkpoint).read_text().splitlines()
          out.append(f'===== {checkpoint} top 100 =====')
          out.extend(f'{i+1}: {x}' for i,x in enumerate(lines[:100]))
          p=Path('site/content/knowledge.json'); data=json.loads(p.read_text())
          out.append('===== knowledge registry compact =====')
          out.append('type='+type(data).__name__)
          if isinstance(data,list):
              out.append('length='+str(len(data)))
              for i,item in enumerate(data):
                  s=json.dumps(item,ensure_ascii=False).lower()
                  if 'interface' in s or 'touching' in s:
                      if isinstance(item,dict): out.append(f'[{i}] '+json.dumps({k:v for k,v in item.items() if k in {"slug","id","title","source","status","kind","relationships","related"}},ensure_ascii=False))
          elif isinstance(data,dict):
              out.append('top_keys='+repr(list(data.keys())))
              for k,v in data.items():
                  if isinstance(v,list):
                      out.append(f'{k}: list length={len(v)}')
                      for i,item in enumerate(v):
                          s=json.dumps(item,ensure_ascii=False).lower()
                          if 'interface' in s or 'touching' in s:
                              if isinstance(item,dict): out.append(f'{k}[{i}] '+json.dumps({kk:vv for kk,vv in item.items() if kk in {"slug","id","title","source","status","kind","relationships","related"}},ensure_ascii=False))
                  elif isinstance(v,dict): out.append(f'{k}: dict keys sample={list(v)[:20]}')
          Path('tmp-interface-history-current-account-compact.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit compact inspection context
        run: |
          git config user.name 'Codex current-account inspection'
          git config user.email 'noreply@openai.com'
          git add tmp-interface-history-current-account-compact.txt
          git commit -m 'chore: expose compact current-account context'
          git push origin HEAD:research/interface-history-global-current-account
