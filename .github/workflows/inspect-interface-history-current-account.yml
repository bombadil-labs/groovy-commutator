name: One-shot test current-account workflow

on:
  push:
    branches: [research/interface-history-global-current-account]
    paths:
      - '.github/workflows/inspect-interface-history-current-account.yml'
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/inspect-interface-history-current-account.yml'

permissions:
  contents: write

jobs:
  test-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-history-global-current-account
      - run: echo workflow-trigger-ok
