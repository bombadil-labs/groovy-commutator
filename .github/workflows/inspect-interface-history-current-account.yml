name: One-shot inspect dimensional current account

on:
  push:
    branches: [research/interface-history-global-current-account]
    paths:
      - '.github/workflows/inspect-interface-history-current-account.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-history-global-current-account
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract knowledge schema examples
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('site/content/knowledge.json').read_text())
          selected_nodes=[x for x in data['nodes'] if x.get('id') in {'touching-strip-local-factor-obstruction','interface-history-bounded-failure'}]
          selected_edges=[x for x in data['edges'] if x.get('source') in {'touching-strip-local-factor-obstruction','interface-history-bounded-failure'} or x.get('target') in {'touching-strip-local-factor-obstruction','interface-history-bounded-failure'}]
          Path('tmp-interface-history-knowledge-schema.json').write_text(json.dumps({'nodes':selected_nodes,'edges':selected_edges},indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit knowledge schema examples
        run: |
          git config user.name 'Codex current-account inspection'
          git config user.email 'noreply@openai.com'
          git add tmp-interface-history-knowledge-schema.json
          git commit -m 'chore: expose interface knowledge edge schema'
          git push origin HEAD:research/interface-history-global-current-account
