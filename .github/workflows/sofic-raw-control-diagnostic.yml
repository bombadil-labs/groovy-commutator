name: Diagnose frozen Research035 raw control censoring

on:
  push:
    branches: ['research/sofic-defect-orbit-20260909']
    paths:
      - '.github/workflows/sofic-raw-control-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sofic-defect-orbit-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pandas
      - name: Reproduce frozen control boundary
        run: python scripts/diagnose_sofic_raw_control.py --output results/sofic_defect_orbit_raw_control_20260909.json
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/sofic_defect_orbit_raw_control_20260909.json
          git commit -m 'Research035: preserve raw-control censoring diagnostic'
          git push origin HEAD:research/sofic-defect-orbit-20260909
