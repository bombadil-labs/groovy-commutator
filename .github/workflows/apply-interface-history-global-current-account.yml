name: One-shot apply global interface-history current account

on:
  push:
    branches: [research/interface-history-global-current-account]
    paths:
      - '.github/workflows/apply-interface-history-global-current-account.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/interface-history-global-current-account
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update Program, checkpoint and knowledge registry by anchored edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          program=Path('docs/research/2026-09-09-dimensional-closure-program.md')
          text=program.read_text()
          section='''## Complete two-lag history separates information loss from bounded locality on the finite rings

The [full-field interface-history audit](2026-09-12-interface-history-global.md) keeps the accepted touching-strip physical/source family, masks and history depths fixed and asks whether the **complete retained ring history field** determines its next complete field. This is the radius-versus-information-loss fork left open by the bounded local failure above.

The frozen G4 bet fails on both rings. Full `P15` with two lags on `D2` is globally deterministic on `n=6` and `n=7` even though the accepted local factors conflict at every `R=0,1,2`. Across the complete 192-cell census only nine cells pass, all at `D2,h=2`: masks `{11,13,15}` on ring 6 and `{3,5,7,11,13,15}` on ring 7. The other 183 cells retain independently replayed global conflicts. Thus the same frozen family contains both cases: some representations truly lose predictive information globally, while for the nine passes the information exists somewhere in the complete ring field and only the bounded locality scale remains unresolved.

This is finite-ring full-field single-valuedness, not a proof of a radius-greater-than-two local factor, translation-equivariance, a uniform rule across widths, or infinite-lattice closure. A larger-radius search, moving/support-tracking state or alternative coordinate would be a separately frozen unit.

'''
          anchor='## Relational rank separates available directions from law-used directions\n'
          if section.splitlines()[0] not in text:
              assert anchor in text
              text=text.replace(anchor,section+anchor,1)
          exact='''25. **Complete two-lag interface history can retain enough information globally while radius two still fails.** On the frozen touching-strip family, full `P15,h=2,D2` is globally deterministic on rings 6 and 7 although every accepted local radius `R<=2` conflicts. Only 9/192 complete-history cells pass and all occur at `D2,h=2`; the other 183 have independently replayed global conflicts. This separates representation-level information loss from unresolved locality scale on the declared finite rings, without establishing a larger-radius or infinite-lattice factor.

'''
          anchor2='## What remains open\n'
          if exact.splitlines()[0] not in text:
              assert anchor2 in text
              text=text.replace(anchor2,exact+anchor2,1)
          program.write_text(text)

          checkpoint=Path('docs/research/checkpoints/dimensional-lift.md')
          text=checkpoint.read_text()
          cp='''## Checkpoint 2026-09-12: complete two-lag fields recover global determinism in nine finite-ring cells; gate-2 pending

Read `docs/research/2026-09-12-interface-history-global.md`. This unit resolves the radius-versus-information-loss fork left by accepted finite interface history without changing the touching-strip physical/source family, masks, domains or maximum history depth.

- Protocol-only #156 received Claude/Fable Gate 1 on exact integrated head `651ba1f574fcc2dca6bc8b130e11cbe7e5efac6c`. The reviewer required one pre-verifier canonical witness-order clarification; clarification-only #158 landed before implementation and did not require renewed Gate 1.
- Implementation-only #159 pinned the packed and explicit-tuple whole-field evaluators, complete G1/G7 controls, permanent workflow and future integrity registration with no result present. Exact final implementation head `ca5c9c8ca1db5092d1768b9944d24e9a8ad1713d` passed all 26 applicable checks and merged as `1163d7b0898fa3e9e0e68c9b26fe3ccf8fc2a9bb`.
- Canonical evaluation #160 ran the unchanged integrated verifier once. G1 predecessor regression and G3 same-domain monotonicity pass; primary/reference implementations agree on all 192 verdicts and canonical pairs; all 183 conflicts independently replay through G7.
- Frozen G4 fails on both rings: full `P15,h=2,D2` is globally deterministic on `n=6` and `n=7`, despite the accepted `R=0,1,2` local conflicts. The complete P15 ladder on both rings is conflict through `D2/h1`, then pass at `D2/h2`.
- Exactly 9/192 cells pass and every pass is at `D2,h=2`: ring 6 masks `{11,13,15}`, ring 7 masks `{3,5,7,11,13,15}`. Pareto minima are masks 11/13 (three interface bits) on ring 6 and 3/5 (two interface bits) on ring 7.
- Interpretation: the 183 global conflicts certify finite-ring representation-level information loss for those cells; the nine passes, including full P15 on both rings, instead show global information present with bounded locality unresolved. No radius greater than two is fitted in this unit.
- Scope remains rings `n=6,7`, declared reachable family, coarse transitions through `t=6`, `h<=2`, frozen masks and complete retained ring fields. Do not infer a local/translation-equivariant or infinite-lattice factor, arbitrary-width closure, recursive dimensional lift, intrinsic dimension, self-assembly, endogenous control, physics/metaphysics, spacetime or prime claims.
- **Review state:** canonical result and reporting/current-account integration are complete on the gathering branch after this sub-PR merges; exact-head independent Gate 2 and reviewer merge remain required before acceptance on `main`.

'''
          marker='Program page: `docs/research/2026-09-09-dimensional-closure-program.md`\n\n'
          if cp.splitlines()[0] not in text:
              assert marker in text
              text=text.replace(marker,marker+cp,1)
          checkpoint.write_text(text)

          kp=Path('site/content/knowledge.json')
          data=json.loads(kp.read_text())
          node_id='interface-history-global-determinism'
          if not any(n.get('id')==node_id for n in data['nodes']):
              data['nodes'].append({
                'id': node_id,
                'kind': 'finding',
                'status': 'exact',
                'title': 'Two lags restore full-field determinism for a small subset of the frozen touching-strip representations',
                'summary': 'On rings 6 and 7, full P15 with two lags on D2 is globally deterministic despite accepted local conflicts through radius two. Only 9 of 192 global cells pass, all at D2,h=2; the other 183 retain replayed global conflicts. The result separates finite-ring information loss from unresolved locality scale without proving a larger-radius or infinite-lattice factor.',
                'updated': '2026-09-12',
                'source': 'docs/knowledge/interface-history-global-determinism.md',
                'research': ['interface-history-global']
              })
          edge_keys={(e.get('source'),e.get('type'),e.get('target')) for e in data['edges']}
          edges=[
            {
              'source': node_id,
              'type': 'depends_on',
              'target': 'interface-history-bounded-failure',
              'reason': 'The full-field audit is the predeclared follow-up that distinguishes information already lost by the frozen short-history representation from information present globally but unavailable within radius two.',
              'research': ['interface-history-global','interface-history']
            },
            {
              'source': node_id,
              'type': 'depends_on',
              'target': 'representation-contract',
              'reason': 'Both global passes and conflicts are relative to the frozen finite rings, masks, history depths and reachable family; changing the representation or domain remains a separate question.',
              'research': ['interface-history-global','dimensional-vision-and-interpretation']
            }
          ]
          for e in edges:
              key=(e['source'],e['type'],e['target'])
              if key not in edge_keys:
                  data['edges'].append(e); edge_keys.add(key)
          kp.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          rp=Path('site/content/research-program.json')
          programs=json.loads(rp.read_text())
          found=False
          for rec in programs:
              if rec.get('source')=='docs/research/2026-09-09-dimensional-closure-program.md':
                  found=True
                  supports=rec.setdefault('supports',[])
                  if 'interface-history-global' not in supports: supports.append('interface-history-global')
                  rec['updated']='2026-09-12'
          assert found
          rp.write_text(json.dumps(programs,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit current-account update
        run: |
          git config user.name 'Codex dimensional current-account update'
          git config user.email 'noreply@openai.com'
          git add docs/research/2026-09-09-dimensional-closure-program.md docs/research/checkpoints/dimensional-lift.md site/content/knowledge.json site/content/research-program.json
          git commit -m 'research: integrate global interface-history current account'
          git push origin HEAD:research/interface-history-global-current-account
