name: One-shot predictive assembly-support evaluation

on:
  push:
    branches:
      - research/predictive-assembly-support-evaluation
    paths:
      - '.github/workflows/tmp-predictive-assembly-support-evaluate.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run first canonical frozen PAS evaluation
        run: python scripts/verify_predictive_assembly_support.py
      - name: Commit canonical result and remove one-shot runner
        shell: bash
        run: |
          test -f results/predictive_assembly_support_20260912.json
          rm .github/workflows/tmp-predictive-assembly-support-evaluate.yml
          git config user.name 'Codex PAS evaluation runner'
          git config user.email 'noreply@openai.com'
          git add results/predictive_assembly_support_20260912.json .github/workflows/tmp-predictive-assembly-support-evaluate.yml
          git commit -m 'research: evaluate predictive assembly support'
          git push origin HEAD:research/predictive-assembly-support-evaluation
