name: Register interface-history-global integrity mapping

on:
  push:
    branches: [research/interface-history-global-implementation]
    paths:
      - '.github/workflows/tmp-register-interface-history-global-integrity.yml'

permissions:
  contents: write

jobs:
  patch-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert future-result mapping without rewriting other registrations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_result_integrity.py')
          text = p.read_text()
          key = "'results/interface_history_global_20260912.json'"
          if key not in text:
              anchor = """    'results/interface_history_20260911.json': {\n        'script': 'scripts/verify_interface_history.py',\n        'protocol': 'docs/research/protocols/interface-history-20260911.md',\n        'interface_factor_result': 'results/interface_factor_20260911.json',\n        'interface_factor_script': 'scripts/verify_interface_factor.py'},\n"""
              addition = """    'results/interface_history_global_20260912.json': {\n        'script': 'scripts/verify_interface_history_global.py',\n        'protocol': 'docs/research/protocols/interface-history-global-20260912.md',\n        'gate1_clarification': 'docs/research/protocols/interface-history-global-gate1-clarification-20260912.md',\n        'predecessor_protocol': 'docs/research/protocols/interface-history-20260911.md',\n        'predecessor_script': 'scripts/verify_interface_history.py',\n        'predecessor_result': 'results/interface_history_20260911.json',\n        'interface_factor_script': 'scripts/verify_interface_factor.py',\n        'interface_factor_result': 'results/interface_factor_20260911.json'},\n"""
              if anchor not in text:
                  raise SystemExit('expected accepted interface-history integrity anchor not found; refusing to rewrite registry')
              p.write_text(text.replace(anchor, anchor + addition, 1))
          PY
      - name: Remove one-shot registration workflow
        run: rm .github/workflows/tmp-register-interface-history-global-integrity.yml
      - name: Commit preservation-safe registry update
        run: |
          git config user.name 'Codex interface-history-global implementation'
          git config user.email 'noreply@openai.com'
          git add scripts/check_result_integrity.py .github/workflows/tmp-register-interface-history-global-integrity.yml
          if git diff --cached --quiet; then
            echo 'No registry change needed.'
            exit 0
          fi
          git commit -m 'chore: register future global interface-history result integrity'
          git push origin HEAD:research/interface-history-global-implementation
