name: Issue62 archival replay

on:
  pull_request:
    paths:
      - 'exploratory/issue62-successor-sets/**'
      - 'src/groovy/ca.py'
      - '.github/workflows/research-issue62-archive.yml'
  push:
    branches: [main]
    paths:
      - 'exploratory/issue62-successor-sets/**'
      - 'src/groovy/ca.py'
      - '.github/workflows/research-issue62-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-set-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Replay the inspected example and compare complete stdout
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path("exploratory/issue62-successor-sets")
          got = subprocess.check_output([sys.executable, str(root / "successor_sets_rule110_D.py")])
          expected = (root / "output.txt").read_bytes()
          assert got == expected, got.decode()
          print(got.decode(), end="")
          PY
