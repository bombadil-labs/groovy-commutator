name: Temporary second-lift reporting verification

on:
  push:
    branches:
      - codex/second-lift-report
    paths:
      - '.github/workflows/temporary-second-lift-ci-debug.yml'
      - 'site/content/research/second-lift-completion.json'
      - 'site/content/knowledge.json'
      - 'docs/knowledge/second-lift-completion-comparison.md'
      - 'docs/research/2026-09-09-dimensional-closure-program.md'
      - 'docs/research/2026-09-11-second-lift-completion.md'
      - 'docs/research/checkpoints/dimensional-lift.md'

permissions:
  contents: read

jobs:
  verify-reporting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Research program tests
        working-directory: site
        run: node --test scripts/research-program.test.mjs
      - name: Research and knowledge tests
        working-directory: site
        run: node --test scripts/research.test.mjs scripts/knowledge.test.mjs
      - name: Build site
        working-directory: site
        run: npm run build
