name: Issue65 archival replay

on:
  pull_request:
    paths:
      - 'exploratory/issue65-relabeling/**'
      - 'src/groovy/ca.py'
      - 'src/groovy/nonuniform.py'
      - '.github/workflows/research-issue65-archive.yml'
  push:
    branches: [main]
    paths:
      - 'exploratory/issue65-relabeling/**'
      - 'src/groovy/ca.py'
      - 'src/groovy/nonuniform.py'
      - '.github/workflows/research-issue65-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relabeling-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Replay the inspected example and compare complete stdout
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path("exploratory/issue65-relabeling")
          got = subprocess.check_output([sys.executable, str(root / "rule_field_relabeling.py")])
          expected = (root / "output.txt").read_bytes()
          assert got == expected, got.decode()
          print(got.decode(), end="")
          PY
