name: Research033 independent reachable-context audit

on:
  push:
    branches: ['research/reachable-context-invariants-20260909']
    paths:
      - 'scripts/audit_reachable_context_invariants.py'
      - 'docs/research/protocols/reachable-context-invariants-audit-correction-20260909.md'
      - '.github/workflows/reachable-context-invariants-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reachable-context-invariants-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run independent scalar reconstruction
        run: |
          mkdir -p results
          python scripts/audit_reachable_context_invariants.py \
            --output results/reachable_context_invariants_20260909_audit.json
      - name: Commit exact audit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/reachable_context_invariants_20260909_audit.json
          git commit -m 'Research033: promote independent reachable-context audit'
          git push origin HEAD:research/reachable-context-invariants-20260909
