name: One-shot phase-splice source-recoder primary census

on:
  push:
    branches:
      - 'research/relational-source-recoder-20260909'
    paths:
      - '.github/workflows/run-phase-splice-source-recoder-primary.yml'

permissions:
  contents: write

jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research runtime
        run: python -m pip install -e . pandas
      - name: Compile frozen primary instrument
        run: python -m py_compile scripts/experiment_phase_splice_source_recoder.py scripts/aggregate_phase_splice_source_recoder.py
      - name: Run frozen semantic controls
        run: >-
          python scripts/experiment_phase_splice_source_recoder.py
          --controls-only
          --output artifacts/controls.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase-splice-controls
          path: artifacts/controls.json
          if-no-files-found: error
          retention-days: 90

  primary-shards:
    needs: controls
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        rule: [122, 154, 161, 164, 166, 180, 210, 218]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research runtime
        run: python -m pip install -e . pandas
      - name: Run frozen rule shard
        env:
          RULE: ${{ matrix.rule }}
        run: |
          mkdir -p artifacts
          python scripts/experiment_phase_splice_source_recoder.py \
            --rule-start "$RULE" \
            --rule-end "$((RULE + 1))" \
            --output "artifacts/phase-splice-rule-${RULE}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phase-splice-rule-${{ matrix.rule }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [controls, primary-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research runtime
        run: python -m pip install -e . pandas
      - uses: actions/download-artifact@v4
        with:
          name: phase-splice-controls
          path: artifacts/controls
      - uses: actions/download-artifact@v4
        with:
          pattern: phase-splice-rule-*
          path: artifacts/shards
          merge-multiple: true
      - name: Aggregate exact primary census
        run: >-
          python scripts/aggregate_phase_splice_source_recoder.py
          --input-dir artifacts/shards
          --controls artifacts/controls/controls.json
          --output results/phase_splice_source_recoder_20260909.json
      - name: Verify aggregate frozen domain
        run: |
          python - <<'PY'
          import json
          x=json.load(open('results/phase_splice_source_recoder_20260909.json'))
          assert x['ok'] is True
          assert x['public_note_number'] is None
          assert x['primary_rules'] == [122,154,161,164,166,180,210,218]
          assert x['seed_languages'] == 22
          assert x['target_questions'] == 170
          assert x['target_questions_by_wolfram_class'] == {'II':158,'III':12}
          assert sum(x['seed_status_counts'].values()) == 22
          assert x['exact_permanence_resolutions'] + x['unresolved_target_questions'] + x['censored_target_questions'] == 170
          print({
              'statuses': x['seed_status_counts'],
              'permanence_resolutions': x['exact_permanence_resolutions'],
              'unresolved_questions': x['unresolved_target_questions'],
              'censored_questions': x['censored_target_questions'],
              'hypothesis': x['primary_hypothesis'],
              'first_certificate': x['first_canonical_certificate'],
              'max_nodes': x['maximum_mdd_nodes_observed'],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase-splice-primary-publication
          path: results/phase_splice_source_recoder_20260909.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit aggregate and retire one-shot runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/run-phase-splice-source-recoder-primary.yml
          git add results/phase_splice_source_recoder_20260909.json
          git commit -m 'research: record phase-splice source-recoder primary census'
          git push origin HEAD:${GITHUB_REF_NAME}
