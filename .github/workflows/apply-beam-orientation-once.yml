name: Apply beam orientation once
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/apply-beam-orientation-once.yml'
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/dimensional-beam-resonance/current-account' &&
      github.event.pull_request.base.ref == 'gather/dimensional-beam-resonance-note'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply additions with exact preimage and preservation checks
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          def load(path, expected_blob):
              p = Path(path)
              data = p.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected_blob, (path, actual, expected_blob)
              return p, data.decode('utf-8')

          note, old_note = load('docs/research/2026-09-12-dimensional-beam-resonance.md', '80e132b5a835e05c7e58d862dc3b0ca82ab66f08')
          provenance = '\n**Authored by:** Codex / OpenAI GPT-5.6 Sol (initial orientation); OpenAI GPT-6 Astra Pro (dated integration below), 2026-09-12. **Reviewed by:** none; independent review pending on gathering PR #168.\n'
          line = '**Evidence:** interpretation / proposed research direction only. No new experiment or result is introduced here.'
          assert old_note.count(line) == 1
          new_note = old_note.replace(line, line + '\n' + provenance, 1)
          addendum = '''

          ## Dated integration: resources, evidence boundaries, and reusable leverage

          This 2026-09-12 addendum preserves the earlier motivation above while incorporating subsequent accepted evidence. It introduces no experiment, result, or change to a frozen protocol. The refinement remains inside [Dimensional Closure](2026-09-09-dimensional-closure-program.md), not a new Program.

          ### A history threshold is conditional, not a dimension counter

          The [full-field audit](2026-09-12-interface-history-global.md) found two-lag sufficiency on rings 6 and 7. The now-accepted [cross-width audit](2026-09-12-interface-history-cross-width.md) finds that masks 11, 13, and 15 remain globally deterministic on width 8 but fail globally on width 9, under the same D2/two-lag observation. Thus two lags are not a width-uniform threshold for that representation. Width-9 full-field conflicts cannot be repaired by increasing spatial radius alone there; they do not imply monotone failure at larger widths.

          Any proposed minimum history must name the law, observation, admissible family, cadence, prediction target, and locality contract as well as dimension. Complete-state observation of deterministic Markov dynamics needs no retained past. A selected lossy observation can need memory; that fact alone supplies no universal h_min(d)=d law. History depth counts previous samples, so two lags mean three observed time slices. Prediction of the next observed field is weaker than reconstruction of the full physical state.

          A joint resource profile should generally be a Pareto frontier rather than one preferred tuple: history depth, spatial radius, retained coordinates, and construction/intervention cost need not have the same minimizer. A tradeoff requires a declared budget or partial ordering, not an unpriced claim that one resource has become another.

          ### Predictive support is not constructive assembly

          The follow-up [PAS unit #172](https://github.com/bombadil-labs/groovy-commutator/pull/172) concerns a minimum decision-table reduct: choose a fixed subset of lag/site/channel coordinates separating every pair of allowed records with different next fields. It is a family-level predictive sufficiency cost under fixed atoms and target, not the complexity of one individual state, not an entropy, and not a construction history. Its reuse-grammar diagnostic was removed at Gate 1; no result here reinstates it.

          In contrast, Sharma et al., [Assembly theory explains and quantifies selection and evolution](https://doi.org/10.1038/s41586-023-06600-9), define assembly index through shortest recursive construction paths from basic parts with intermediate objects available for reuse. Their ensemble assembly quantity also uses copy number. This motivates asking a future construction question but does not identify PAS with assembly index. A genuine construction-cost experiment would need explicit elementary objects, legal joins, reusable intermediates, output equivalence, and charged preparation resources.

          ### The free-lunch analogy needs a costed task

          Levin's [research overview](https://drmichaellevin.org/research/) describes exploiting physical and computational affordances for adaptive solutions without separately evolving every solution. That is broader than merely storing a previously learned program. The connection to this Program is a proposed question about reusable leverage, not a finding that our beam already supplies it.

          For a future cost experiment, compare the same task under homologous inherited organization and matched alternatives while charging preparation, storage, locality, latency, and interventions consistently. Adding free primitives can only weakly lower a minimum by definition; that monotonicity is a null, not an observed benefit. A scientifically informative gain must survive that accounting and matched controls. Neither a small PAS value nor a response difference alone establishes such a gain.

          ### Resonance remains a stronger target, not a renamed success score

          The user defines ananda personally as the somatic resonance of self-recognition through self-similarity. The mechanical research target inspired by this is a response to structural correspondence that can itself be transported through the dimensional lift. An analyst-labelled homologous pair producing a different response is only an initial operational test: it does not establish that the system recognizes homology, experiences anything, or autonomously discovers the correspondence.

          Homology-sensitive response and a beneficial cost reduction are separate claims. Preservation, stronger interaction, synchronization, and repair cannot be interchanged after seeing a result. The [response unit #173](https://github.com/bombadil-labs/groovy-commutator/pull/173) must follow its own frozen matching, response signs, symmetry-aware null, and horizon; this note neither authorizes a run nor changes those choices.

          The workstreams can proceed in parallel under their own gates. Documentation integration does not grant Gate 1 to any experiment and does not reopen a completed protocol. Keep the original failures, later scope corrections, and the distinction between observer-supplied structure and endogenous organization visible.
          '''
          # Dedent the embedded prose without reflowing any existing content.
          import textwrap
          addendum = textwrap.dedent(addendum)
          new_note = new_note.rstrip() + addendum + '\n'
          assert new_note.split('\n\n## Dated integration:')[0].replace('\n' + provenance, '', 1).rstrip() == old_note.rstrip()
          note.write_text(new_note, encoding='utf-8')

          program, old_program = load('docs/research/2026-09-09-dimensional-closure-program.md', 'd0d77237fc948f1e6cb79989af8c6ee77dbb49d0')
          anchor = '## Shared representation contract\n'
          section = '''## Beam refinement: structural correspondence must become consequential

          The [2026-09-12 beam refinement](2026-09-12-dimensional-beam-resonance.md) sharpens the objective inside this Program: eventual beam success should transport an endogenous dynamical response to structural self-correspondence, not only an externally verified inherited trajectory. This is an orientation and proposed criterion, not a result or a new Program. The user's ananda/resonance language remains personal motivation rather than evidence of experience.

          Keep predictive history/support, constructive assembly cost, homology-sensitive response, and costed reusable leverage distinct. The width-nine failure below prevents treating the earlier two-lag passes as a universal dimensional threshold. Future comparisons require explicit law/observer/family/cadence/resource contracts and separate frozen protocols; this refinement does not re-score any completed unit or alter ongoing experiments.

          '''
          section = textwrap.dedent(section)
          assert old_program.count(anchor) == 1
          new_program = old_program.replace(anchor, section + anchor, 1)
          assert new_program.replace(section, '', 1) == old_program
          program.write_text(new_program, encoding='utf-8')

          checkpoint, old_checkpoint = load('docs/research/checkpoints/dimensional-lift.md', 'efdaff89834394dd0a46a9808523ba2c545c705e')
          marker = '## Checkpoint 2026-09-12: cross-width two-lag closure'
          orientation = '''## Orientation 2026-09-12: resonance and resource accounting refine the existing beam

          Read `docs/research/2026-09-12-dimensional-beam-resonance.md`, including its dated integration. This is a user-requested direction record, not new evidence and not authorization to evaluate.

          - Keep the work inside Dimensional Closure: the long-term target includes a transported endogenous response to structural self-correspondence, beyond externally verified inheritance alone.
          - Keep history, locality, predictive support, constructive assembly, and task-dependent reuse costs separate. PAS is a decision-table reduct over a fixed family; it is not an individual's assembly index. A response difference does not by itself establish recognition or useful cost reduction.
          - The accepted cross-width note governs the finite h=2 claim; do not turn its earlier widths-6/7 success into h_min(d)=d. Wider-radius rescue cannot fix the exact width-nine global conflicts, but other histories/representations remain open.
          - Preserve ongoing experiment protocols and independent gates. The philosophical language is motivation, not consciousness, physics, metaphysics, or a dimensional theorem. This orientation is proposed in #168; independent wording review/reviewer merge is pending.

          '''
          orientation = textwrap.dedent(orientation)
          assert old_checkpoint.count(marker) == 1
          new_checkpoint = old_checkpoint.replace(marker, orientation + marker, 1)
          assert new_checkpoint.replace(orientation, '', 1) == old_checkpoint
          checkpoint.write_text(new_checkpoint, encoding='utf-8')

          catalog = Path('site/content/research/dimensional-beam-resonance.json')
          assert not catalog.exists()
          catalog.write_text(json.dumps([{
              'recordType': 'checkpoint', 'scope': 'dimensional-lift',
              'slug': 'dimensional-beam-resonance', 'label': 'Beam refinement',
              'title': 'The beam: correspondence, support, and reusable leverage',
              'date': '2026-09-12', 'updated': '2026-09-12',
              'kind': 'Checkpoint: research direction and interpretation contract',
              'evidence': 'state', 'topic': 'Algebra and closure',
              'summary': 'A user-requested refinement inside Dimensional Closure: seek causally consequential structural correspondence while separating predictive support, assembly cost, and reusable leverage. No new experiment or evidence.',
              'takeaway': 'Treat resonance as an operational research target, not a finding; history, geometry, and constructive reuse require separate resource contracts and independently reviewed protocols.',
              'source': 'docs/research/2026-09-12-dimensional-beam-resonance.md',
              'promotion': {'stage': 'research'},
              'related': ['dimensional-vision-and-interpretation', 'interface-history-global', 'relational-rank']
          }], indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate documentation and publisher
        run: |
          git diff --check
          npm ci --prefix site
          npm run test:research --prefix site
          npm run build --prefix site
      - name: Commit only the documentation and remove this one-shot runner
        run: |
          git config user.name 'OpenAI GPT-6 Astra Pro - beam orientation'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/apply-beam-orientation-once.yml
          git add docs/research/2026-09-12-dimensional-beam-resonance.md docs/research/2026-09-09-dimensional-closure-program.md docs/research/checkpoints/dimensional-lift.md site/content/research/dimensional-beam-resonance.json
          git commit -m 'docs: integrate beam orientation with preserved research history'
          git push origin HEAD:work/dimensional-beam-resonance/current-account
