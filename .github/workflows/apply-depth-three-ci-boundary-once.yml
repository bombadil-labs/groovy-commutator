name: Apply depth-three CI cost boundary once
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-depth-three-ci-boundary-once.yml'
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/ci-cost-boundary/depth-three-replay' &&
      github.event.pull_request.base.ref == 'gather/ci-cost-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Move expensive replay out of automatic CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/research-checks.yml')
          lines = p.read_text().splitlines(True)
          if not any('Fast canonical-result integrity' in line for line in lines):
            hits = [i for i,line in enumerate(lines) if 'run: python -m compileall -q src scripts' in line]
            assert len(hits) == 1, hits
            i = hits[0]
            indent = re.match(r'^(\s*)', lines[i]).group(1)
            lines[i+1:i+1] = [
              indent[:-2] + '- name: Fast canonical-result integrity\n',
              indent + 'run: python scripts/check_result_integrity.py\n',
            ]
          p.write_text(''.join(lines))

          p = Path('.github/workflows/research-full-shift-depth-three.yml')
          lines = p.read_text().splitlines(True)
          job_starts = [i for i,line in enumerate(lines) if re.match(r'^  [A-Za-z0-9_-]+:\s*$', line)]
          assert job_starts, 'no jobs found'
          candidates = []
          for j,start in enumerate(job_starts):
            end = job_starts[j+1] if j+1 < len(job_starts) else len(lines)
            block = ''.join(lines[start:end])
            vals = [int(x) for x in re.findall(r'timeout-minutes:\s*(\d+)', block)]
            if vals:
              candidates.append((max(vals), start, end, block))
          assert candidates, 'no timeout-bearing jobs found'
          max_timeout = max(x[0] for x in candidates)
          expensive = [x for x in candidates if x[0] == max_timeout]
          assert max_timeout > 10 and len(expensive) == 1, [(x[0], lines[x[1]].strip()) for x in candidates]
          _, job_i, end, block = expensive[0]
          assert 'verify_full_shift_depth_three.py' in block, (max_timeout, lines[job_i].strip())
          existing_if = [i for i in range(job_i + 1, end) if re.match(r'^    if:', lines[i])]
          if existing_if:
            assert len(existing_if) == 1
            lines[existing_if[0]] = "    if: github.event_name == 'workflow_dispatch'\n"
          else:
            lines.insert(job_i + 1, "    if: github.event_name == 'workflow_dispatch'\n")
          text = ''.join(lines)
          assert "if: github.event_name == 'workflow_dispatch'" in text
          p.write_text(text)
          PY
          git diff --check
      - name: Commit bounded workflow and remove one-shot editor
        run: |
          git config user.name 'OpenAI GPT-5.6 Sol - CI cost policy'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/apply-depth-three-ci-boundary-once.yml
          git add .github/workflows/research-checks.yml .github/workflows/research-full-shift-depth-three.yml
          git commit -m 'ci: make expensive depth-three replay manual-only'
          git push origin HEAD:work/ci-cost-boundary/depth-three-replay
