name: Apply depth-three CI cost boundary once
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-depth-three-ci-boundary-once.yml'
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/ci-cost-boundary/depth-three-replay' &&
      github.event.pull_request.base.ref == 'gather/ci-cost-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Move expensive replay out of automatic CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/research-checks.yml')
          s = p.read_text()
          anchor = """      - name: Compile Python sources\n        run: python -m compileall -q src scripts\n"""
          addition = anchor + """      - name: Fast canonical-result integrity\n        run: python scripts/check_result_integrity.py\n"""
          assert s.count(anchor) == 1, 'research-checks compile anchor changed'
          if 'Fast canonical-result integrity' not in s:
            s = s.replace(anchor, addition, 1)
          p.write_text(s)

          p = Path('.github/workflows/research-full-shift-depth-three.yml')
          lines = p.read_text().splitlines(True)
          job_starts = [i for i,line in enumerate(lines) if re.match(r'^  [A-Za-z0-9_-]+:\s*$', line)]
          blocks = []
          for j,start in enumerate(job_starts):
            end = job_starts[j+1] if j+1 < len(job_starts) else len(lines)
            blocks.append((start,end,''.join(lines[start:end])))
          expensive = [(start,end,block) for start,end,block in blocks if 'timeout-minutes: 300' in block]
          assert len(expensive) == 1, [(lines[s].strip(), 'timeout-minutes: 300' in b) for s,e,b in blocks]
          job_i,end,_ = expensive[0]
          existing_if = [i for i in range(job_i + 1, end) if re.match(r'^    if:', lines[i])]
          if existing_if:
            assert len(existing_if) == 1
            lines[existing_if[0]] = "    if: github.event_name == 'workflow_dispatch'\n"
          else:
            lines.insert(job_i + 1, "    if: github.event_name == 'workflow_dispatch'\n")
          text = ''.join(lines)
          assert "if: github.event_name == 'workflow_dispatch'" in text
          p.write_text(text)
          PY
          git diff --check
      - name: Commit bounded workflow and remove one-shot editor
        run: |
          git config user.name 'OpenAI GPT-5.6 Sol - CI cost policy'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/apply-depth-three-ci-boundary-once.yml
          git add .github/workflows/research-checks.yml .github/workflows/research-full-shift-depth-three.yml
          git commit -m 'ci: make expensive depth-three replay manual-only'
          git push origin HEAD:work/ci-cost-boundary/depth-three-replay
