name: Temporary transverse-freedom report integrator

on:
  push:
    branches:
      - work/dimensional-spatial-axis/reporting
    paths:
      - '.github/workflows/temporary-transverse-freedom-report-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/dimensional-spatial-axis/reporting
      - name: Update Program, checkpoint, provenance and knowledge graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          # Close the prior second-lift review provenance now that PR #96 is accepted.
          p = Path('docs/research/2026-09-11-second-lift-completion.md')
          s = p.read_text()
          old = 'Final gathering-PR review by Fable/Claude: pending.'
          new = ('Final gathering-PR review: approved by Claude Code / Fable 5.1 at '
                 '`f5c2eb8`; merged in PR #96 as `db2af440`.')
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)

          # Add the new exact bounded result to the living dimensional Program.
          p = Path('docs/research/2026-09-09-dimensional-closure-program.md')
          s = p.read_text()
          item = ('22. **Finite width packs, while independent unbounded width defeats a fixed capacity budget.** '
                  'Every fixed finite strip is sitewise column-packable into a one-dimensional product alphabet; '
                  'for fixed target alphabet size `q` and longitudinal expansion `K`, an unconstrained strip family '
                  'eventually violates `|A|^(wn) <= q^(Kn)`. The inherited Rule32 correction tower is analytically '
                  'source-bounded by one bit of independent-state capacity per longitudinal site. In the bounded '
                  '`n=6..12`, `h=0..4` diagnostic, its K/O and H128/H160 whole-field partitions are already saturated '
                  'at `h=0`: deeper correction rows add no new whole-field distinctions on those tested finite families. '
                  'This supplies a necessary anti-packing resource test, not a definition of spatial dimension.\n\n')
          if '22. **Finite width packs' not in s:
              marker = '## What remains open\n'
              if marker not in s:
                  raise SystemExit('Program insertion marker missing')
              s = s.replace(marker, item + marker, 1)
          old_open = ('- The relationship between correction depth, spatial dimension, growing spatial radius and minimum causal representation dimension is not yet characterized. '
                      'The completed second-lift comparison keeps the spatial lattice one-dimensional while growing the represented product alphabet; its radius-one inherited closure therefore does not settle how a genuinely new spatial axis should arise. A fixed code\'s ancestral rank may primarily reflect its layout.')
          new_open = ('- The relationship between correction depth, spatial dimension, growing spatial radius and minimum causal representation dimension is not yet characterized. '
                      'The completed second-lift comparison keeps the lattice one-dimensional while growing a product alphabet, and the transverse-freedom unit now shows that every fixed finite width column-packs and that the tested Rule32 correction tuples add no whole-field distinctions after `h=0` through depth four. A genuinely new spatial axis still needs a stronger uniform resource, topology, intervention, or symmetry criterion; a fixed code\'s ancestral rank may primarily reflect its layout.')
          if old_open in s:
              s = s.replace(old_open, new_open, 1)
          section = '''\n## Completed execution: finite-width packing and transverse freedom\n\nThe [frozen protocol](protocols/transverse-freedom-20260911.md) and [result note](2026-09-11-transverse-freedom.md) separate finite column packing from independently growing transverse capacity. For a fixed width `w`, a strip is sitewise equivalent to a one-dimensional CA over the product alphabet `A^w`. For an unbounded independent strip family, any fixed target alphabet and fixed longitudinal expansion budget eventually fails by counting.\n\nThe inherited Rule32 correction family goes the other way: every finite-depth tuple is a deterministic image of the same binary source family, so its independent-state rate is at most one bit per longitudinal site. The bounded periodic diagnostic tests rings `n=6..12` and depths `h=0..4`. The first-image family sizes are 63, 128, 255, 512, 1023, 2048, 4095; the corresponding tuple images are 62, 128, 254, 512, 1022, 2048, 4094 at **every** measured depth. Because deeper tuples retain the shallower tuple as a prefix, the unchanged counts mean the whole-field equality partition is already saturated at `h=0` throughout this diagnostic. K/O and H128/H160 fiber/recoding controls all pass.\n\nThis is a necessary anti-packing/resource result, not an intrinsic-dimension theorem. The measured saturation is not extrapolated beyond `n=6..12` or `h=4`, and non-spatial memory can also violate a fixed capacity budget. The next dimensional criterion should therefore ask for a resource that survives finite packing under a uniform contract—candidate examples include transverse intervention independence, interaction topology, or translation symmetry in a new direction.\n'''
          if '## Completed execution: finite-width packing and transverse freedom' not in s:
              s = s.rstrip() + '\n' + section + '\n'
          p.write_text(s)

          # Add a fresh checkpoint at the top of this Program's log.
          p = Path('docs/research/checkpoints/dimensional-lift.md')
          s = p.read_text()
          checkpoint = '''## Checkpoint 2026-09-11: finite-width packing and transverse-freedom unit completed; gate-2 pending\n\nRead `docs/research/2026-09-11-transverse-freedom.md`. The frozen protocol received Claude/Fable gate-1 approval at `27ee07d` with two binding capacity-definition clarifications recorded before implementation. Implementation commit `26ddc639` was pinned before primary evaluation; canonical result commit `10d1ea7` followed.\n\n- Analytic T1: every fixed finite-width strip column-packs into a 1D CA over a width-dependent product alphabet.\n- Analytic T2: an unbounded independent strip family defeats every fixed target alphabet/longitudinal-expansion budget `(q,K)` by counting. This is a resource obstruction, not a definition of dimension.\n- Analytic T3: every finite-depth inherited Rule32 correction tuple is source-bounded by `|B_n| <= 2^n`, hence at most one bit of independent-state capacity per longitudinal site.\n- Bounded T4: on `n=6..12`, `h=0..4`, the common K/O and H128/H160 tuple-image counts are `62,128,254,512,1022,2048,4094` for the seven rings at every measured depth. The whole-field partition is therefore already saturated at `h=0` throughout this finite diagnostic.\n- All K↔O and H128↔H160 recoding/fiber controls pass; O is pointwise completion-independent; primary truth-table and literal-Boolean reference rows agree. Permanent source-hash and byte-for-byte replay CI is green on the evaluation sub-PR.\n- Process record: controls-only debugging preceded the pinned implementation but computed no T4 count. Two one-shot evaluation workflows were added nearly simultaneously; the first wrote the canonical result and the second unchanged rerun produced no result diff. Both runs and cleanup remain visible in history.\n- Do not infer `h→∞` saturation, an all-ring formula from the even/odd finite pattern, a sufficient criterion for spatial dimension, or a new spatial axis. The stronger topology/intervention/symmetry criterion remains open.\n- **Review state:** reporting is complete on the gathering branch only after its reporting sub-PR merges. External Claude/Fable gate-2 review of the final gathering head remains required before `main`.\n\n'''
          if 'finite-width packing and transverse-freedom unit completed' not in s:
              marker = 'Program page: `docs/research/2026-09-09-dimensional-closure-program.md`\n\n'
              if marker not in s:
                  raise SystemExit('checkpoint insertion marker missing')
              s = s.replace(marker, marker + checkpoint, 1)
          p.write_text(s)

          # Register a compact knowledge finding by cloning the established second-lift node shape.
          p = Path('site/content/knowledge.json')
          data = json.loads(p.read_text())
          node_id = 'transverse-freedom-capacity'
          if not any(n.get('id') == node_id for n in data['nodes']):
              base = next(n for n in data['nodes'] if n.get('id') == 'second-lift-completion-comparison')
              node = dict(base)
              node.update({
                  'id': node_id,
                  'title': 'Finite width packs; the tested Rule32 correction tower adds no independent transverse capacity',
                  'summary': 'Fixed finite strips column-pack into width-dependent product alphabets; unbounded independent width eventually defeats any fixed (q,K) capacity budget. Rule32 correction tuples are analytically source-bounded, and on n=6..12 their whole-field partition is already saturated at h=0 through h=4.',
                  'source': 'docs/knowledge/transverse-freedom-capacity.md',
                  'research': ['transverse-freedom'],
                  'updated': '2026-09-11',
              })
              data['nodes'].append(node)
          edge_key = (node_id, 'depends_on', 'second-lift-completion-comparison')
          if not any((e.get('source'), e.get('type'), e.get('target')) == edge_key for e in data['edges']):
              data['edges'].append({
                  'source': node_id,
                  'type': 'depends_on',
                  'target': 'second-lift-completion-comparison',
                  'reason': 'The anti-packing question is motivated by the completed second-lift result: correction depth and nominal product-alphabet size grow while the spatial lattice remains one-dimensional.',
                  'research': ['transverse-freedom'],
              })
          p.write_text(json.dumps(data, separators=(',', ':')) + '\n')
          PY

          git config user.name 'Codex report integrator'
          git config user.email 'noreply@openai.com'
          git add docs/research/2026-09-11-second-lift-completion.md \
                  docs/research/2026-09-09-dimensional-closure-program.md \
                  docs/research/checkpoints/dimensional-lift.md \
                  site/content/knowledge.json
          git rm .github/workflows/temporary-transverse-freedom-report-integrate.yml
          git commit -m 'Integrate transverse-freedom result into Program and checkpoint'
          git push origin HEAD:work/dimensional-spatial-axis/reporting
