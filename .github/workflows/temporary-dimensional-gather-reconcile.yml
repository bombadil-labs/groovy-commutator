name: Temporary dimensional gathering reconciliation

on:
  push:
    branches:
      - gather/dimensional-second-lift
    paths:
      - '.github/workflows/temporary-dimensional-gather-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gather/dimensional-second-lift
      - name: Merge current main and reconcile shared registries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp site/content/knowledge.json /tmp/branch_knowledge.json

          git fetch origin main
          git merge origin/main --no-commit || true

          # AGENTS is canonical guidance; the dimensional branch carries no
          # unique second-lift addition there, so current main wins wholesale.
          if git diff --name-only --diff-filter=U | grep -qx 'AGENTS.md'; then
            git checkout --theirs AGENTS.md
          fi

          # Start from current main's integrity registry and add the completed
          # second-lift result registration.
          if git diff --name-only --diff-filter=U | grep -qx 'scripts/check_result_integrity.py'; then
            git checkout --theirs scripts/check_result_integrity.py
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/check_result_integrity.py')
          s = p.read_text()
          entry = """    'results/second_lift_completion_20260911.json': {\n        'script': 'scripts/verify_second_lift_completion.py',\n        'protocol': 'docs/research/protocols/second-lift-completion-comparison-20260910.md'},\n"""
          if "results/second_lift_completion_20260911.json" not in s:
              marker = "}\n\ndef sha("
              if marker not in s:
                  raise SystemExit('integrity registry insertion marker not found')
              s = s.replace(marker, entry + marker, 1)
              p.write_text(s)
          PY

          # Start from current main's knowledge graph so all accepted nodes and
          # edges survive, then replace only the second-lift experiment node and
          # its dependency edge with the completed dimensional versions.
          if git diff --name-only --diff-filter=U | grep -qx 'site/content/knowledge.json'; then
            git checkout --theirs site/content/knowledge.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          main_p = Path('site/content/knowledge.json')
          main = json.loads(main_p.read_text())
          branch = json.loads(Path('/tmp/branch_knowledge.json').read_text())
          node_id = 'second-lift-completion-comparison'
          bn = next(n for n in branch['nodes'] if n.get('id') == node_id)
          replaced = False
          nodes = []
          for n in main['nodes']:
              if n.get('id') == node_id:
                  nodes.append(bn); replaced = True
              else:
                  nodes.append(n)
          if not replaced:
              nodes.append(bn)
          main['nodes'] = nodes
          key = (node_id, 'depends_on', 'completion-independent-fibers')
          be = next(e for e in branch['edges'] if (e.get('source'), e.get('type'), e.get('target')) == key)
          replaced = False
          edges = []
          for e in main['edges']:
              if (e.get('source'), e.get('type'), e.get('target')) == key:
                  edges.append(be); replaced = True
              else:
                  edges.append(e)
          if not replaced:
              edges.append(be)
          main['edges'] = edges
          main_p.write_text(json.dumps(main, separators=(',', ':')) + '\n')
          PY

          git add AGENTS.md scripts/check_result_integrity.py site/content/knowledge.json
          git rm -f .github/workflows/temporary-dimensional-gather-reconcile.yml

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge conflicts:'
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git commit -m "Merge current main into dimensional gathering branch"
          git push origin HEAD:gather/dimensional-second-lift