name: Parity history-bound certificate

on:
  pull_request:
    paths:
      - 'scripts/verify_parity_history_bound.py'
      - 'scripts/verify_parity_coarse_graining.py'
      - 'results/parity_history_bound_20260911.json'
      - 'results/parity_coarse_graining_20260911.json'
      - '.github/workflows/research-parity-history-bound.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_parity_history_bound.py'
      - 'results/parity_history_bound_20260911.json'
      - '.github/workflows/research-parity-history-bound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Rerun the frozen certificate and compare the canonical JSON byte for byte
        run: |
          cp results/parity_history_bound_20260911.json /tmp/expected.json
          python scripts/verify_parity_history_bound.py > /dev/null
          cmp /tmp/expected.json results/parity_history_bound_20260911.json
