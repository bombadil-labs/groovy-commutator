name: Dimensional history-scaling product-law control

# Permanent two-tier workflow. The implementation-only stage has no canonical
# result: compile and run only the out-of-domain n=3 self-test. Once evaluation
# adds the result, touching PRs verify source hashes and result-changing PRs,
# main, weekly, and manual runs replay it byte for byte.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/verify_dimensional_history_scaling_control.py'
      - 'results/dimensional_history_scaling_control_20260912.json'
      - 'docs/research/protocols/dimensional-history-scaling-20260912.md'
      - 'docs/research/protocols/dimensional-history-scaling-gate1-refreeze-20260912.md'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-dimensional-history-scaling-control.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_dimensional_history_scaling_control.py'
      - 'results/dimensional_history_scaling_control_20260912.json'
      - 'docs/research/protocols/dimensional-history-scaling-20260912.md'
      - 'docs/research/protocols/dimensional-history-scaling-gate1-refreeze-20260912.md'
      - 'scripts/check_result_integrity.py'
      - '.github/workflows/research-dimensional-history-scaling-control.yml'
  schedule:
    - cron: '19 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dimensional-history-scaling-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check pinned verifier
        run: python -m py_compile scripts/verify_dimensional_history_scaling_control.py
      - name: Run implementation-only out-of-domain self-test while result is absent
        run: |
          if [ -f results/dimensional_history_scaling_control_20260912.json ]; then
            echo 'Canonical result present: skip the implementation-only absence guard.'
          else
            python scripts/verify_dimensional_history_scaling_control.py --self-test
          fi
      - name: Recorded source hashes match when canonical result exists
        run: |
          if [ -f results/dimensional_history_scaling_control_20260912.json ]; then
            python scripts/check_result_integrity.py results/dimensional_history_scaling_control_20260912.json
          else
            echo 'Implementation-only stage: canonical theorem-control result not committed yet.'
          fi
      - name: Does this run require full canonical replay?
        id: result
        run: |
          if [ ! -f results/dimensional_history_scaling_control_20260912.json ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'results/dimensional_history_scaling_control_20260912.json'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Replay frozen control and compare canonical JSON byte for byte
        if: steps.result.outputs.changed == 'true'
        run: |
          cp results/dimensional_history_scaling_control_20260912.json /tmp/expected.json
          python scripts/verify_dimensional_history_scaling_control.py > /dev/null
          cmp /tmp/expected.json results/dimensional_history_scaling_control_20260912.json
