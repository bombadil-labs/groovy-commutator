name: Research032 horizon-5 symbolic witness census

on:
  push:
    branches: ['research/causal-witness-automaton-20260909']
    paths:
      - 'scripts/experiment_causal_witness_automaton.py'
      - 'scripts/aggregate_causal_witness_automaton.py'
      - 'docs/research/protocols/causal-witness-automaton-20260909.md'
      - '.github/workflows/causal-witness-automaton-h5-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pandas
      - name: Reproduce Rule35 horizon-3 birth
        run: |
          python scripts/experiment_causal_witness_automaton.py \
            --rule-start 35 --rule-end 36 --hmax 3 \
            --output /tmp/sentinel.json
          python - <<'PY'
          import json
          row=json.load(open('/tmp/sentinel.json'))['rows'][0]
          ev=[e for e in row['events_h3_plus'] if e['horizon']==3]
          assert ev==[{'horizon':3,'pair':'2-6','target':'00000001','target_id':63}], ev
          assert row['censored'] is None
          PY

  shard:
    needs: sentinel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e . pandas
      - name: Run exact symbolic shard through horizon 5
        shell: bash
        run: |
          start=$(( ${{ matrix.shard }} * 32 ))
          end=$(( start + 32 ))
          python scripts/experiment_causal_witness_automaton.py \
            --rule-start "$start" --rule-end "$end" --hmax 5 \
            --node-budget 5000000 \
            --output "/tmp/causal-witness-mdd-${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: causal-witness-mdd-${{ matrix.shard }}
          path: /tmp/causal-witness-mdd-${{ matrix.shard }}.json
          retention-days: 30

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: causal-witness-mdd-*
          path: /tmp/shards
      - name: Aggregate and enforce Research031/h4 controls
        run: |
          python scripts/aggregate_causal_witness_automaton.py \
            --input-dir /tmp/shards \
            --output /tmp/causal_witness_automaton_h5_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: causal-witness-automaton-h5-summary
          path: /tmp/causal_witness_automaton_h5_summary.json
          retention-days: 30
      - name: Surface result on PR 37
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/comment.md
          import json
          s=json.load(open('/tmp/causal_witness_automaton_h5_summary.json'))
          print('## Research032 phase 1 — symbolic horizon-5 census')
          print()
          print(f"- Research031 horizon-3 regression: **{len(s['h3_regression_events'])}/4 exact events recovered**")
          print(f"- horizon-4 births (pilot reproduction): **{s['h4_births']}**")
          print(f"- horizon-5 births in pilot Rules 0–63: **{s['pilot_h5_births_rules_0_63']}**")
          print(f"- **fresh horizon-5 births in Rules 64–255: {s['fresh_h5_births_rules_64_255']}**")
          print(f"- censored rules at 5M-node ceiling: **{len(s['censored'])}**")
          print(f"- unresolved pair/target distinctions after h5: **{s['unresolved_after_run']}**")
          print()
          if s['fresh_h5_events']:
              print('### Fresh horizon-5 events')
              for e in s['fresh_h5_events'][:20]:
                  print(f"- Rule {e['rule']}, target `{e['target']}`, pair `{e['pair']}`")
          else:
              print('Fresh h=5 is null; per the frozen protocol, horizon 6 on all 256 rules is now authorized.')
          print()
          print('### Symbolic state growth')
          for h,x in s['horizon_stats'].items():
              print(f"- h={h}: {x['rules_built']} rules built; median core nodes {x['median_build_nodes']}; max {x['max_build_nodes']} (Rule {x['max_build_rule']})")
          PY
          gh pr comment 37 --body-file /tmp/comment.md
