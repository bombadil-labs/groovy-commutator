name: Apply dimensional history-scaling current account once
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/apply-dimensional-history-scaling-current-account-once.yml'
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/dimensional-history-scaling/current-account' &&
      github.event.pull_request.base.ref == 'gather/dimensional-history-scaling'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply additions with exact preimage and preservation checks
        run: |
          python - <<'PY'
          import hashlib
          import json
          import textwrap
          from pathlib import Path

          def load(path, expected_blob):
              p = Path(path)
              data = p.read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected_blob, (path, actual, expected_blob)
              return p, data.decode('utf-8')

          program, old_program = load(
              'docs/research/2026-09-09-dimensional-closure-program.md',
              'd0d77237fc948f1e6cb79989af8c6ee77dbb49d0')
          program_anchor = '## Relational rank separates available directions from law-used directions\n'
          program_section = textwrap.dedent('''## Product-form linear slice observations are a dimension-blind history control

          The [dimensional history-scaling control](2026-09-12-dimensional-history-scaling-control.md) preserves a rejected first attempt to test whether retained history depth tracks dimensional level. Independent Gate 1 showed before implementation that the chosen pair—product-form ordered-axis Rule90 and a complete coordinate-slice observation—is algebraically blind to the number of axes: if `D(n)` is the minimal-polynomial degree of `g=x+x^-1` in the cyclic one-dimensional quotient, then `h_min(d,n)=D(n)-1` for the declared history criterion.

          The frozen theorem controls verify this independently in dimensions 1, 2 and 3: `h_min=2` for `n=5` and `h_min=3` for `n=7`, with the packed full-state matrix path agreeing with a separate one-dimensional polynomial reference in every cell. These values were known at Gate 1 and are regression results, not a rediscovered dimensional law. The useful conclusion is methodological: this product-law/slice-observer design cannot discriminate a history-versus-dimension hypothesis. It neither confirms nor refutes such scaling for nonlinear sources, non-product lifts, or different observations; any discriminating replacement requires its own frozen protocol.

          ''')
          assert old_program.count(program_anchor) == 1
          new_program = old_program.replace(program_anchor, program_section + program_anchor, 1)
          assert new_program.replace(program_section, '', 1) == old_program
          program.write_text(new_program, encoding='utf-8')

          checkpoint, old_checkpoint = load(
              'docs/research/checkpoints/dimensional-lift.md',
              'd4334897c673cbb70a553ec0afd1f3d326a9e8f3')
          checkpoint_anchor = '## Checkpoint 2026-09-12: cross-width two-lag closure persists through width eight and fails at width nine; accepted\n'
          checkpoint_entry = textwrap.dedent('''## Checkpoint 2026-09-12: product-form Rule90 plus a coordinate slice is dimension-blind for the frozen history criterion; Gate 2 pending

          Read `docs/research/2026-09-12-dimensional-history-scaling-control.md`. The original cross-dimensional `h_min(d)=d` protocol was not run as proposed: independent Gate 1 derived a theorem showing the selected product-form linear law and coordinate-slice observer cannot make this `h_min` depend on dimension. The unit was refrozen before implementation as a negative design theorem/control.

          - Original protocol head `eb992ce8d29a864b4ecf3ba94ced6adda0a22e74` was blocked at Gate 1. The theorem-control refreeze at `74393d18a33c51cfff133c88e09a40a2a3018cf6` received renewed Claude/Fable Gate 1 before implementation. The refreeze was accidentally committed directly to the gathering branch; the protocol-only routing deviation is preserved and disclosed, with no pre-gate scientific execution.
          - Frozen theorem: for product-form ordered-axis Rule90 under the complete coordinate-zero slice and odd `n`, `h_min(d,n)=D(n)-1`, where `D(n)` is the minimal-polynomial degree of `g=x+x^-1` in `GF(2)[x]/(x^n-1)`. The declared controls are `D(5)=3 -> h_min=2` and `D(7)=4 -> h_min=3` for `d=1,2,3`. These were pre-run predictions, not bets.
          - Implementation-only #181 pinned two materially independent paths, permanent integrity/replay CI, and future result registration with no canonical result. First evaluation #183 produced theorem-matching bytes but was preserved unmerged because the permanent workflow's implementation-stage absence self-test remained red after the result appeared. Workflow-only #184 corrected only that plumbing before rerun.
          - Corrected evaluation #185 regenerated the unchanged canonical result from the corrected integrated stage. The result is byte-identical to the preserved first run; all six matrix cells match the independent polynomial theorem and the fixed-`n` closing depth is identical across `d=1,2,3`. Reporting-only #188 added the exact result note.
          - Preservation reconciliation #189 then merged accepted current `main` into the gathering lineage without changing the theorem, verifier, canonical result or interpretation; all 29 exact-head checks passed, including the inherited full-shift-depth-three replay.
          - Interpretation: this is a reusable **design null**. It says the pair (product-form linear law, coordinate-slice observer) factors dimension out of this history-sufficiency measure. It does not refute a broader history-to-geometry conjecture. A discriminating follow-up must separately break the product factorization and/or slice-module observer structure.
          - Do not infer intrinsic dimension, a general space/time equivalence, self-assembly, endogenous control, resonance/self-recognition, physics/metaphysics, spacetime, Class IV, universality, renormalization, or any prime/`8n+1` connection.
          - **Review state:** canonical theorem-control result and reporting are integrated on gathering #171. This current-account integration updates Program/checkpoint/catalog only. Independent exact-head Gate 2 and reviewer merge are still required before acceptance on `main`.

          ''')
          assert old_checkpoint.count(checkpoint_anchor) == 1
          new_checkpoint = old_checkpoint.replace(checkpoint_anchor, checkpoint_entry + checkpoint_anchor, 1)
          assert new_checkpoint.replace(checkpoint_entry, '', 1) == old_checkpoint
          checkpoint.write_text(new_checkpoint, encoding='utf-8')

          catalog = Path('site/content/research/dimensional-history-scaling-control.json')
          assert not catalog.exists()
          catalog.write_text(json.dumps([{
              'slug': 'dimensional-history-scaling-control',
              'label': 'History-scaling control',
              'title': 'When a history-scaling test is blind to dimension',
              'date': '2026-09-12',
              'updated': '2026-09-12',
              'kind': 'Exact theorem control',
              'evidence': 'exact',
              'topic': 'Algebra and closure',
              'summary': 'Gate 1 proved before execution that product-form ordered-axis Rule90 viewed through a coordinate slice has a history threshold set by one-dimensional ring algebra, not by the number of axes; independent implementations verify the frozen n=5/7 controls.',
              'takeaway': 'For this declared law/observer pair, h_min(d,n)=D(n)-1 and is dimension-blind. This is a reusable experimental-design null, not evidence against history/dimension scaling under other representations.',
              'source': 'docs/research/2026-09-12-dimensional-history-scaling-control.md',
              'promotion': {'stage': 'research'},
              'related': ['interface-history-global', 'guard-free-axial-lift']
          }], indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit current-account files and remove this one-shot runner
        run: |
          git diff --check
          git config user.name 'OpenAI GPT-5.6 Sol - dimensional history current account'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/apply-dimensional-history-scaling-current-account-once.yml
          git add docs/research/2026-09-09-dimensional-closure-program.md docs/research/checkpoints/dimensional-lift.md site/content/research/dimensional-history-scaling-control.json
          git commit -m 'report: integrate dimensional history-scaling current account'
          git push origin HEAD:work/dimensional-history-scaling/current-account
      - name: Validate committed current account
        run: |
          npm ci --prefix site
          npm run test:research --prefix site
          npm run build --prefix site