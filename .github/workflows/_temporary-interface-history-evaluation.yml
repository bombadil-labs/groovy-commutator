name: Temporary interface-history evaluation

on:
  push:
    branches:
      - work/dimensional-interface-history/evaluation
    paths:
      - '.github/workflows/_temporary-interface-history-evaluation.yml'

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify canonical result is absent before first run
        run: test ! -f results/interface_history_20260911.json
      - name: Execute frozen verifier once
        run: python scripts/verify_interface_history.py
      - name: Commit canonical result only
        run: |
          git config user.name 'Codex interface-history evaluation'
          git config user.email 'actions@users.noreply.github.com'
          git add results/interface_history_20260911.json
          test "$(git diff --cached --name-only)" = 'results/interface_history_20260911.json'
          git commit -m 'research: evaluate frozen interface-history protocol'
          git push
