name: Apply PAS tractability correction once

on:
  push:
    branches:
      - work/predictive-assembly-support/tractability
    paths:
      - '.github/workflows/apply-pas-tractability-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/predictive-assembly-support/tractability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch verifier without evaluating frozen source cells
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/verify_predictive_assembly_support.py')
          s = p.read_text()
          start = s.index('def independent_raw_certificate(')
          end = s.index('\n\ndef orbit_support_mask', start)

          new = '''def disjoint_constraint_packing(constraints: Sequence[int], k: int) -> tuple[int, ...] | None:
              """Find k pairwise-disjoint valid difference constraints as a lower-bound certificate."""
              unique = tuple(sorted(set(c for c in constraints if c), key=lambda x: (x.bit_count(), x)))
              if k == 0:
                  return ()

              greedy: list[int] = []
              used = 0
              for c in unique:
                  if c & used:
                      continue
                  greedy.append(c)
                  used |= c
                  if len(greedy) == k:
                      return tuple(greedy)

              def rec(start: int, used_mask: int, chosen: tuple[int, ...]) -> tuple[int, ...] | None:
                  need = k - len(chosen)
                  if need == 0:
                      return chosen
                  if len(unique) - start < need:
                      return None
                  for i in range(start, len(unique)):
                      c = unique[i]
                      if c & used_mask:
                          continue
                      found = rec(i + 1, used_mask | c, chosen + (c,))
                      if found is not None:
                          return found
                  return None

              return rec(0, 0, ())


          def tuple_disjoint_conflict_packing(classes: Sequence[TupleClass], k: int) -> tuple[dict, ...] | None:
              """Independent greedy packing directly from the explicit tuple decision table."""
              if k == 0:
                  return ()
              selected: tuple[int, ...] = ()
              witnesses: list[dict] = []
              used: set[int] = set()
              for _ in range(k):
                  conflict = first_tuple_conflict(classes, selected)
                  if conflict is None:
                      return None
                  left, right, diff = conflict
                  if not diff or any(i in used for i in diff):
                      return None
                  witnesses.append({
                      "class_indices": [left, right],
                      "difference_atoms": list(diff),
                  })
                  used.update(diff)
                  selected = tuple(sorted(used))
              return tuple(witnesses)


          def independent_raw_certificate(
              classes: Sequence[TupleClass],
              optimum: int,
              n_atoms: int,
              primary_constraints: Sequence[int],
          ) -> dict:
              """Independent sufficiency check plus an exact lower-bound certificate.

              Gate 1 explicitly permits a machine-checked disjoint-difference-set
              packing equal to the reported optimum. Prefer that fast exact
              certificate and retain the original direct decision-table search as
              a fallback when no size-k packing is found.
              """
              k = optimum.bit_count()
              selected = support_tuple(optimum)
              if not tuple_support_ok(classes, selected):
                  raise AssertionError("primary optimum fails independent tuple sufficiency check")

              packing = disjoint_constraint_packing(primary_constraints, k)
              if packing is not None:
                  return {
                      "method": "disjoint_difference_set_packing_from_valid_cutting_plane_constraints",
                      "no_support_at_most_k_minus_1": True,
                      "support_at_k_found": list(selected),
                      "reference_optimum": k,
                      "packing_size": len(packing),
                      "packing_difference_atom_sets": [list(support_tuple(c)) for c in packing],
                  }

              tuple_packing = tuple_disjoint_conflict_packing(classes, k)
              if tuple_packing is not None:
                  return {
                      "method": "independent_tuple_disjoint_difference_set_packing",
                      "no_support_at_most_k_minus_1": True,
                      "support_at_k_found": list(selected),
                      "reference_optimum": k,
                      "packing_size": len(tuple_packing),
                      "packing_witnesses": list(tuple_packing),
                  }

              below = reference_exists_at_most(classes, k - 1, n_atoms) if k else None
              if below is not None:
                  raise AssertionError(("reference found smaller support", support_tuple(below), k))
              at = reference_exists_at_most(classes, k, n_atoms)
              if at is None:
                  raise AssertionError("reference solver failed to find support at primary optimum")
              return {
                  "method": "direct_decision_table_iterative_deepening_fallback",
                  "no_support_at_most_k_minus_1": True,
                  "support_at_k_found": list(support_tuple(at)),
                  "reference_optimum": k,
              }
          '''

          s = s[:start] + new + s[end:]

          old_call = 'reference_certificate = independent_raw_certificate(tuples, optimum, len(labels))'
          if old_call not in s:
              raise SystemExit('expected evaluate_cell certificate call not found')
          s = s.replace(old_call, 'reference_certificate = independent_raw_certificate(tuples, optimum, len(labels), generated_constraints)', 1)

          old_self = 'cert = independent_raw_certificate(tuples, optimum, 4)'
          if old_self not in s:
              raise SystemExit('expected synthetic certificate call not found')
          s = s.replace(old_self, 'cert = independent_raw_certificate(tuples, optimum, 4, constraints)', 1)

          p.write_text(s)
          Path('.github/workflows/apply-pas-tractability-once.yml').unlink()
          PY
      - name: Synthetic implementation-only verification
        run: |
          python -m py_compile scripts/verify_predictive_assembly_support.py
          python scripts/verify_predictive_assembly_support.py --self-test
      - name: Commit bounded tractability correction
        run: |
          git config user.name 'OpenAI GPT-5.6 Sol'
          git config user.email 'noreply@openai.com'
          git add scripts/verify_predictive_assembly_support.py .github/workflows/apply-pas-tractability-once.yml
          git commit -m 'perf: add exact PAS packing certificate fast path'
          git push origin HEAD:work/predictive-assembly-support/tractability
