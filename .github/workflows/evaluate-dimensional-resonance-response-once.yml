name: One-shot dimensional resonance response evaluation

on:
  push:
    branches:
      - research/dimensional-resonance-response-evaluation

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/dimensional-resonance-response-evaluation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Run frozen canonical n=6/7 evaluation
        run: python scripts/verify_dimensional_resonance_response.py
      - name: Verify canonical source integrity
        run: python scripts/check_result_integrity.py results/dimensional_resonance_response_20260912.json
      - name: Commit canonical result and remove one-shot runner
        run: |
          rm .github/workflows/evaluate-dimensional-resonance-response-once.yml
          git config user.name "Codex resonance evaluation"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "research: evaluate frozen dimensional resonance response"
          git push origin HEAD:research/dimensional-resonance-response-evaluation
